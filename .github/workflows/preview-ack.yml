name: Preview PR (CN test cluster)

# Builds a teable-ee pull request and deploys it as a preview on the CN test cluster
# (ACK teable-cn-test, namespace teable-preview, https://pr-<edition>-<n>.preview.teable.cn).
# Replaces the Sealos preview workflows (manual-preview-{cloud,ee}{,-update}.yml).
#
# One workflow for both editions and for create and update: every run re-renders the
# template from teable-ee and applies it. Data survives redeploys: the preview's
# PostgreSQL / Redis / MinIO run in a StatefulSet that keeps its disk, and their
# passwords live in a Secret created once on the first deploy.
#
# The template and the scripts come from teable-ee `tooling_ref` (develop), not from
# the PR, so every preview uses the current template; the images come from the PR ref.
# Cluster access: GitHub OIDC -> RAM role teable-cn-test-github-deploy (trusts this
# repository's main only) -> short-lived kubeconfig limited to the preview namespace.
#
# Triggers: the label events from teable-ee's preview-trigger.yml (preview-cloud /
# preview-ee when the label is added, *-update on every push and on the tracing label;
# preview-*-build sends skip_deploy) and workflow_dispatch for manual (re)deploys.

on:
  repository_dispatch:
    types: [preview-cloud, preview-cloud-update, preview-ee, preview-ee-update]
  workflow_dispatch:
    inputs:
      pr_number:
        description: teable-ee pull request number
        required: true
        type: string
      ref:
        description: Head branch of that pull request
        required: true
        type: string
      edition:
        description: Edition to build and deploy
        required: true
        type: choice
        options: [cloud, ee]
        default: cloud
      tooling_ref:
        description: teable-ee ref to take the preview template and scripts from
        required: true
        type: string
        default: develop

concurrency:
  # A newer push to the same PR supersedes the build in flight.
  group: preview-ack-${{ inputs.pr_number || github.event.client_payload.pr_number }}-${{ inputs.edition || (startsWith(github.event.action, 'preview-ee') && 'ee' || 'cloud') }}
  cancel-in-progress: true

permissions: {}

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
  PR_REF: ${{ inputs.ref || github.event.client_payload.ref }}
  EDITION: ${{ inputs.edition || (startsWith(github.event.action, 'preview-ee') && 'ee' || 'cloud') }}
  TOOLING_REF: ${{ inputs.tooling_ref || 'develop' }}
  SKIP_DEPLOY: ${{ github.event.client_payload.skip_deploy == true || github.event.client_payload.skip_deploy == 'true' }}
  ACR: registry.cn-shenzhen.aliyuncs.com/teable

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Comment build progress on PR
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo "::error::invalid pr_number"; exit 1; }
          gh api "repos/teableio/teable-ee/issues/${PR_NUMBER}/comments" \
            -f body="🚀 Your ${EDITION} preview is being built and deployed to the CN test cluster. [Progress](${RUN_URL})"

  # Runs the PR's own build script: no cluster credentials and no id-token here.
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.get_sha.outputs.sha }}
    strategy:
      matrix:
        include:
          - component: app
            file: Dockerfile
          - component: sandbox
            file: Dockerfile.sandbox
          # The app pulls its sandbox agent as <prefix>:<own BUILD_VERSION>, and preview
          # builds stamp BUILD_VERSION with the PR tag, so the agent is built here too.
          - component: sandbox-agent
            file: Dockerfile.sandbox-agent
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          submodules: 'true'
          ref: ${{ env.PR_REF }}

      - name: Get teable-ee SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "${COMPONENT}" in
            app) echo "name=teable-${EDITION}-preview" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=teable-${COMPONENT}-${EDITION}-preview" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${EDITION}" in
            cloud) echo "edition_arg=CLOUD" >> "$GITHUB_OUTPUT" ;;
            ee) echo "edition_arg=EE" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Login to Ali container registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ vars.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_KEY }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: ⚙️ Install zx
        run: npm install -g zx

      - name: ⚙️ Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            registry.cn-shenzhen.aliyuncs.com/teable/${{ steps.image.outputs.name }}
            ghcr.io/teableio/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=alpha-pr-${{ env.PR_NUMBER }}
            type=raw,value=${{ steps.get_sha.outputs.sha }}

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: ⚙️ Expose GitHub runtime for Buildx cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: 📦 Build and push
        env:
          PREVIEW_PUSH_REGISTRIES: ${{ env.SKIP_DEPLOY == 'true' && 'registry.cn-shenzhen.aliyuncs.com,ghcr.io' || '' }}
          DOCKERFILE: dockers/teable/${{ matrix.file }}
          TAGS: ${{ steps.meta.outputs.tags }}
          EDITION_ARG: ${{ steps.image.outputs.edition_arg }}
        run: |
          zx scripts/build-image.mjs --file="${DOCKERFILE}" \
              --build-arg="ENABLE_CSP=false" \
              --build-arg="SENTRY_ENABLED=false" \
              --build-arg="NEXT_BUILD_ENV_EDITION=${EDITION_ARG}" \
              --tag="${TAGS}" \
              --platform="linux/amd64" \
              --push

  notify-skip-deploy:
    needs: [build-push]
    if: github.event.client_payload.skip_deploy == true || github.event.client_payload.skip_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment images pushed on PR
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          SHA: ${{ needs.build-push.outputs.sha }}
        run: |
          gh api "repos/teableio/teable-ee/issues/${PR_NUMBER}/comments" \
            -f body="📦 Images built and pushed, deploy skipped. Image tags: alpha-pr-${PR_NUMBER}, ${SHA}"

  deploy:
    needs: [build-push]
    if: github.event.client_payload.skip_deploy != true && github.event.client_payload.skip_deploy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_NAME: pr-${{ inputs.edition || (startsWith(github.event.action, 'preview-ee') && 'ee' || 'cloud') }}-${{ inputs.pr_number || github.event.client_payload.pr_number }}
      IMAGE_TAG: ${{ needs.build-push.outputs.sha }}
      PREVIEW_DOMAIN_BASE: ${{ vars.PREVIEW_DOMAIN_BASE || 'preview.teable.cn' }}
      ALIYUN_ROLE_ARN: ${{ vars.CN_TEST_DEPLOY_ROLE_ARN || 'acs:ram::1145786521954482:role/teable-cn-test-github-deploy' }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.CN_TEST_OIDC_PROVIDER_ARN || 'acs:ram::1145786521954482:oidc-provider/github-actions' }}
    steps:
      - name: Checkout cluster access scripts
        uses: actions/checkout@v4

      # Template, renderer, bootstrap-admin script and the scope list it reads.
      - name: Checkout preview tooling from teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          sparse-checkout: |
            .github
            community/packages/core/src/auth

      - name: Check tracing label
        id: labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PACKAGES_KEY }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: 'teableio',
              repo: 'teable-ee',
              pull_number: Number(process.env.PR_NUMBER),
            });
            const labels = pullRequest.labels.map((label) => label.name);
            core.setOutput('enable_tracing', String(labels.includes('tracing')));
            console.log('PR labels:', labels.join(', '));

      - name: Get Aliyun STS credentials via OIDC
        run: bash .github/scripts/aliyun-oidc-login.sh

      - name: Fetch cluster kubeconfig
        run: bash .github/scripts/cn-test-kubeconfig.sh

      - name: Check whether the preview exists
        id: exists
        run: |
          if kubectl get deployment "teable-${INSTANCE_NAME}" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      # Created once, never rewritten: redeploys must keep the database, Redis and
      # MinIO credentials the data was written with.
      - name: Ensure the data Secret
        run: |
          set -euo pipefail
          name="teable-${INSTANCE_NAME}-data"
          if kubectl get secret "${name}" >/dev/null 2>&1; then
            echo "${name} exists"
            exit 0
          fi
          b64() { printf '%s' "$1" | base64 -w0; }
          kubectl create -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${name}
            labels:
              teable.io/preview-instance: teable-${INSTANCE_NAME}
          type: Opaque
          data:
            PG_PASSWORD: $(b64 "$(openssl rand -hex 24)")
            REDIS_PASSWORD: $(b64 "$(openssl rand -hex 24)")
            MINIO_ROOT_USER: $(b64 teable)
            MINIO_ROOT_PASSWORD: $(b64 "$(openssl rand -hex 24)")
          EOF

      - name: Render and apply
        env:
          EDITION: ${{ env.EDITION }}
          MAIN_IMAGE: ${{ env.ACR }}/teable-${{ env.EDITION }}-preview:${{ env.IMAGE_TAG }}
          SANDBOX_IMAGE: ${{ env.ACR }}/teable-sandbox-${{ env.EDITION }}-preview:${{ env.IMAGE_TAG }}
          ENABLE_TRACING: ${{ steps.labels.outputs.enable_tracing }}
          PREVIEW_CONFIG_SOURCE: ${{ secrets.PREVIEW_CONFIG_SOURCE }}
          PREVIEW_EE_ENTERPRISE_LICENSE_KEY: ${{ secrets.PREVIEW_EE_ENTERPRISE_LICENSE_KEY }}
          # Preset env, both halves optional: the variable holds non-sensitive entries and
          # stays editable in the UI, the secret holds credentials and wins on duplicate
          # keys. See teable-ee .github/scripts/render-preview-env-secret.sh.
          PREVIEW_PRESET_ENV_DEFAULTS: SANDBOX_OPENSANDBOX_IMAGE=${{ env.ACR }}/teable-sandbox-agent-${{ env.EDITION }}-preview
          PREVIEW_PRESET_ENV_VARS: ${{ vars.PREVIEW_PRESET_ENV_VARS }}
          PREVIEW_PRESET_ENV: ${{ secrets.PREVIEW_PRESET_ENV }}
        run: |
          set -euo pipefail
          # The rendered manifest holds Secrets: write it to the runner, never print it.
          bash tooling/.github/scripts/render-preview-ack.sh > "${RUNNER_TEMP}/preview.yaml"
          kubectl apply -f "${RUNNER_TEMP}/preview.yaml"
          if [ "${ENABLE_TRACING}" != "true" ]; then
            kubectl delete deployment,service,ingress "teable-${INSTANCE_NAME}-jaeger" --ignore-not-found
          fi
          rm -f "${RUNNER_TEMP}/preview.yaml"

      - name: Rollout status
        env:
          ENABLE_TRACING: ${{ steps.labels.outputs.enable_tracing }}
        run: |
          set -euo pipefail
          kubectl rollout status "statefulset/teable-${INSTANCE_NAME}-data" --timeout=300s
          kubectl rollout status "deployment/teable-${INSTANCE_NAME}-sandbox" --timeout=300s
          # First deploy runs the database migrations in an init container.
          kubectl rollout status "deployment/teable-${INSTANCE_NAME}" --timeout=600s
          if [ "${ENABLE_TRACING}" = "true" ]; then
            kubectl rollout status "deployment/teable-${INSTANCE_NAME}-jaeger" --timeout=300s
          fi

      - name: Wait for application health check
        run: |
          kubectl exec "deployment/teable-${INSTANCE_NAME}" -- \
            curl -f --retry 30 --retry-delay 5 --retry-connrefused http://localhost:3000/health

      # Fixed preview admin (dev+pr@teable.io) + full-scope instance API token, shown
      # on the PR by the status comment. Only on the first deploy, like the Sealos lane.
      - name: Bootstrap preview admin
        id: preview_admin
        if: steps.exists.outputs.fresh == 'true'
        continue-on-error: true
        run: bash tooling/.github/scripts/preview-bootstrap-admin.sh

      - name: Create deployment status comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          SUCCESS: ${{ job.status == 'success' }}
          TRACING_ENABLED: ${{ steps.labels.outputs.enable_tracing }}
          ADMIN_STATUS: ${{ steps.preview_admin.outputs.status }}
          ADMIN_EMAIL: ${{ steps.preview_admin.outputs.admin_email }}
          ADMIN_PASSWORD: ${{ steps.preview_admin.outputs.admin_password }}
          ADMIN_TOKEN: ${{ steps.preview_admin.outputs.admin_token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url="https://${INSTANCE_NAME}.${PREVIEW_DOMAIN_BASE}"
          if [ "${SUCCESS}" = "true" ]; then
            body="**Deployment Status: ✅ Success** 🔗 Preview URL: ${url}"
            if [ "${TRACING_ENABLED}" = "true" ]; then
              body="${body} 🔎 Jaeger URL: https://jaeger-${INSTANCE_NAME}.${PREVIEW_DOMAIN_BASE}"
            fi
            if [ "${ADMIN_STATUS}" = "created" ]; then
              body="${body}"$'\n'"🔐 Admin: \`${ADMIN_EMAIL}\` / \`${ADMIN_PASSWORD}\`"$'\n'"🔑 Instance API token: \`${ADMIN_TOKEN}\`"
            fi
          else
            body="**Deployment Status: ❌ Failed** [Run](${RUN_URL})"
          fi
          gh api "repos/teableio/teable-ee/issues/${PR_NUMBER}/comments" -f body="${body}"
