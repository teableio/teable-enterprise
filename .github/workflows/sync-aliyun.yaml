name: Sync images to Aliyun

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to sync (cloud or ee)'
        required: true
        type: choice
        options:
          - cloud
          - ee
      tags:
        description: 'Comma-separated tags to sync (e.g., latest,abc123,1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      edition:
        required: true
        type: string
      tags:
        required: true
        type: string
    secrets:
      PACKAGES_KEY:
        required: true
      ALI_DOCKER_PASSWORD:
        required: true
      DOCKER_HUB_AK:
        required: false

env:
  SRC_REGISTRY: ghcr.io/teableio
  EE_SRC_REGISTRY: docker.io/teableio
  DST_REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable
  MAX_RETRIES: 3
  RETRY_DELAY: 15

jobs:
  sync:
    name: Sync ${{ inputs.edition }} images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install skopeo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
               sudo env DEBIAN_FRONTEND=noninteractive \
                timeout 180s apt-get install -y skopeo; then
              exit 0
            fi
            echo "::warning::skopeo install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::skopeo installation failed after 3 attempts"
          exit 1

      - name: Sync images to Aliyun
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.PACKAGES_KEY }}
          DOCKER_HUB_AK: ${{ secrets.DOCKER_HUB_AK }}
          DST_CREDS: ${{ vars.ALI_DOCKER_USERNAME }}:${{ secrets.ALI_DOCKER_PASSWORD }}
        run: |
          set +e

          retry_copy() {
            local src="$1" dst="$2" all_flag="$3"
            local fallback_src="${4:-}" fallback_creds="${5:-}"
            local primary_attempts="$MAX_RETRIES"
            [ -n "$fallback_src" ] && primary_attempts=1

            for attempt in $(seq 1 "$primary_attempts"); do
              echo "[$attempt/$primary_attempts] Copying ${src} -> ${dst}"
              if timeout --signal=TERM 15m skopeo copy ${all_flag} \
                  "docker://${src}" "docker://${dst}" \
                  --src-creds="${SRC_CREDS}" \
                  --dest-creds="${DST_CREDS}"; then
                echo "✅ Success: ${src}"
                return 0
              fi
              echo "⚠️ Attempt ${attempt} failed. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            done

            if [ -n "$fallback_src" ]; then
              for attempt in $(seq 1 "$MAX_RETRIES"); do
                echo "[$attempt/$MAX_RETRIES] Falling back to ${fallback_src} -> ${dst}"
                if timeout --signal=TERM 15m skopeo copy ${all_flag} \
                    "docker://${fallback_src}" "docker://${dst}" \
                    --src-creds="${fallback_creds}" \
                    --dest-creds="${DST_CREDS}"; then
                  echo "✅ Success via fallback: ${fallback_src}"
                  return 0
                fi
                echo "⚠️ Fallback attempt ${attempt} failed. Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              done
            fi

            echo "❌ FAILED to copy ${src} -> ${dst}"
            return 1
          }

          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          FAILED=0

          if [ "${{ inputs.edition }}" = "cloud" ]; then
            # The cloud app images are multi-arch on ghcr, but arm64 ships
            # from ghcr ONLY — Aliyun (like ECR) stays amd64-only, byte-
            # identical to the pre-multi-arch behavior.
            IMAGES=("teable-cloud" "teable-sandbox-cloud")
            for image in "${IMAGES[@]}"; do
              for tag in "${TAGS[@]}"; do
                [ -n "$tag" ] || continue
                retry_copy \
                  "${SRC_REGISTRY}/${image}:${tag}" \
                  "${DST_REGISTRY}/${image}:${tag}" \
                  "--override-arch amd64 --override-os linux" \
                  || FAILED=1
              done
            done

            # The agent is built by the ee lane under its single canonical name
            # (no -cloud alias), but it is synced in BOTH lanes so a manual
            # cloud-only resync still refreshes the CN agent tag. skopeo copy
            # is idempotent, so the double sync on the normal path is harmless.
            # "latest" is skipped: the agent publishes no latest tag (its only
            # consumers pull prefix + explicit app build tag).
            for tag in "${TAGS[@]}"; do
              [ -n "$tag" ] || continue
              [ "$tag" = "latest" ] && continue
              retry_copy \
                "${SRC_REGISTRY}/teable-sandbox-agent:${tag}" \
                "${DST_REGISTRY}/teable-sandbox-agent:${tag}" \
                "--all" \
                || FAILED=1
            done
          elif [ "${{ inputs.edition }}" = "ee" ]; then
            # promote-latest-ee has already copied these exact multi-arch tags
            # to Docker Hub. Keep GHCR as the primary source for standalone
            # syncs, then use Docker Hub after one bounded GHCR attempt.
            FALLBACK_CREDS=""
            [ -n "$DOCKER_HUB_AK" ] && FALLBACK_CREDS="teableio:${DOCKER_HUB_AK}"
            IMAGES=("teable" "teable-sandbox")
            SUFFIXES=("" "-ee")

            for image in "${IMAGES[@]}"; do
              for suffix in "${SUFFIXES[@]}"; do
                for tag in "${TAGS[@]}"; do
                  [ -n "$tag" ] || continue
                  fallback_src=""
                  [ -n "$FALLBACK_CREDS" ] && fallback_src="${EE_SRC_REGISTRY}/${image}${suffix}:${tag}"
                  retry_copy \
                    "${SRC_REGISTRY}/${image}${suffix}:${tag}" \
                    "${DST_REGISTRY}/${image}${suffix}:${tag}" \
                    "--all" \
                    "$fallback_src" \
                    "$FALLBACK_CREDS" \
                    || FAILED=1
                done
              done
            done

            # Single canonical sandbox agent (no -ee/-cloud alias); both
            # teable.ai and teable.cn preheat teable/teable-sandbox-agent.
            # "latest" is skipped: the agent publishes no latest tag (its only
            # consumers pull prefix + explicit app build tag). Same rule as the
            # cloud lane above; without it every ee latest-promotion sync fails.
            for tag in "${TAGS[@]}"; do
              [ -n "$tag" ] || continue
              [ "$tag" = "latest" ] && continue
              fallback_src=""
              [ -n "$FALLBACK_CREDS" ] && fallback_src="${EE_SRC_REGISTRY}/teable-sandbox-agent:${tag}"
              retry_copy \
                "${SRC_REGISTRY}/teable-sandbox-agent:${tag}" \
                "${DST_REGISTRY}/teable-sandbox-agent:${tag}" \
                "--all" \
                "$fallback_src" \
                "$FALLBACK_CREDS" \
                || FAILED=1
            done
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::Some images failed to sync to Aliyun"
            exit 1
          fi
          echo "🎉 All images synced successfully"
