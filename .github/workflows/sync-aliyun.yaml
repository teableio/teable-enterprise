name: Sync images to Aliyun

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to sync (cloud or ee)'
        required: true
        type: choice
        options:
          - cloud
          - ee
      tags:
        description: 'Comma-separated tags to sync (e.g., latest,abc123,1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      edition:
        required: true
        type: string
      tags:
        required: true
        type: string
      release_record_id:
        required: false
        type: string
        default: ''
      publish_lock_id:
        required: false
        type: string
        default: ''
      publish_target:
        required: false
        type: string
        default: ''
    secrets:
      ALI_DOCKER_PASSWORD:
        required: true
      TEABLE_API_TOKEN:
        required: false

env:
  SRC_REGISTRY: ghcr.io/teableio
  EE_SRC_REGISTRY: docker.io/teableio
  DST_REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable
  # The copies run on the Hong Kong relay (see .github/scripts/acr-relay-copy.sh).
  # Defaults match terraform/deployments/aliyun-acr-relay-hk in teable-infra;
  # repository variables override them.
  ACR_RELAY_INSTANCE_ID: ${{ vars.ACR_RELAY_INSTANCE_ID || 'i-j6cgf1dhj2eq8ue1rogk' }}
  ALIYUN_ROLE_ARN: ${{ vars.ACR_RELAY_ROLE_ARN || 'acs:ram::1145786521954482:role/acr-relay-hk-github' }}
  ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ACR_RELAY_OIDC_PROVIDER_ARN || 'acs:ram::1145786521954482:oidc-provider/github-actions' }}

jobs:
  sync:
    name: Sync ${{ inputs.edition }} images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # id-token: the relay is driven with a 1h OIDC credential. packages: read
    # lets the job's GITHUB_TOKEN pull the private ghcr images (on the relay).
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Revalidate publishing lock
        if: inputs.release_record_id != '' && inputs.publish_lock_id != '' && inputs.publish_target != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: ${{ inputs.publish_target }}
        run: bash .github/scripts/validate-teable-publish-lock.sh

      - name: Get Aliyun STS credentials for the relay
        run: bash .github/scripts/aliyun-oidc-login.sh

      # Only for the "already on Aliyun" checks; the copies run on the relay.
      - name: Install skopeo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
               sudo env DEBIAN_FRONTEND=noninteractive \
                timeout 180s apt-get install -y skopeo; then
              exit 0
            fi
            echo "::warning::skopeo install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::skopeo installation failed after 3 attempts"
          exit 1

      - name: Sync images to Aliyun
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DST_CREDS: ${{ vars.ALI_DOCKER_USERNAME }}:${{ secrets.ALI_DOCKER_PASSWORD }}
        run: |
          set +e

          # retry_copy <src> <dst> <amd64|all> [fallback_src]: one relay
          # invocation per source; the relay retries the copy itself. ghcr
          # sources get the job token (private images); the Docker Hub
          # fallback is public and pulled anonymously.
          retry_copy() {
            local src="$1" dst="$2" arch="$3" fallback_src="${4:-}"
            local token=""
            [[ "$src" == ghcr.io/* ]] && token="$GHCR_TOKEN"
            if bash .github/scripts/acr-relay-copy.sh "$src" "$dst" "$arch" "$token"; then
              echo "✅ Success: ${src}"
              return 0
            fi
            if [ -n "$fallback_src" ]; then
              echo "⚠️ ${src} failed, falling back to ${fallback_src}"
              if bash .github/scripts/acr-relay-copy.sh "$fallback_src" "$dst" "$arch"; then
                echo "✅ Success via fallback: ${fallback_src}"
                return 0
              fi
            fi
            echo "❌ FAILED to copy ${src} -> ${dst}"
            return 1
          }

          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          FAILED=0

          if [ "${{ inputs.edition }}" = "cloud" ]; then
            # The cloud app images are multi-arch on ghcr, but arm64 ships
            # from ghcr ONLY — Aliyun (like ECR) stays amd64-only, byte-
            # identical to the pre-multi-arch behavior.
            IMAGES=("teable-cloud" "teable-sandbox-cloud")
            for image in "${IMAGES[@]}"; do
              for tag in "${TAGS[@]}"; do
                [ -n "$tag" ] || continue
                # teable.cn's manual-ack-cn-deploy patches teable-cloud:<release>
                # in place on Aliyun for the CN CDN. Re-copying the clean ghcr
                # image over it reverts that patch (whichever launch wrote last
                # won), so a release tag already on Aliyun is left alone, the
                # same rule as ensure-aliyun. Only "latest" is re-pointed.
                if [ "$image" = "teable-cloud" ] && [ "$tag" != "latest" ] && \
                   timeout 60s skopeo inspect --raw --creds="${DST_CREDS}" \
                     "docker://${DST_REGISTRY}/${image}:${tag}" >/dev/null 2>&1; then
                  echo "✅ ${image}:${tag} already on Aliyun, keeping it"
                  continue
                fi
                retry_copy \
                  "${SRC_REGISTRY}/${image}:${tag}" \
                  "${DST_REGISTRY}/${image}:${tag}" \
                  amd64 \
                  || FAILED=1
              done
            done

            # The agent is built by the ee lane under its single canonical name
            # (no -cloud alias), but it is synced in BOTH lanes so a manual
            # cloud-only resync still refreshes the CN agent tag. skopeo copy
            # is idempotent, so the double sync on the normal path is harmless.
            # "latest" is skipped: the agent publishes no latest tag (its only
            # consumers pull prefix + explicit app build tag).
            for tag in "${TAGS[@]}"; do
              [ -n "$tag" ] || continue
              [ "$tag" = "latest" ] && continue
              retry_copy \
                "${SRC_REGISTRY}/teable-sandbox-agent:${tag}" \
                "${DST_REGISTRY}/teable-sandbox-agent:${tag}" \
                all \
                || FAILED=1
            done
          elif [ "${{ inputs.edition }}" = "ee" ]; then
            # promote-latest-ee has already copied these exact multi-arch tags
            # to Docker Hub. Keep GHCR as the primary source for standalone
            # syncs, then use Docker Hub (public) if the GHCR copy fails.
            IMAGES=("teable" "teable-sandbox")
            SUFFIXES=("" "-ee")

            for image in "${IMAGES[@]}"; do
              for suffix in "${SUFFIXES[@]}"; do
                for tag in "${TAGS[@]}"; do
                  [ -n "$tag" ] || continue
                  retry_copy \
                    "${SRC_REGISTRY}/${image}${suffix}:${tag}" \
                    "${DST_REGISTRY}/${image}${suffix}:${tag}" \
                    all \
                    "${EE_SRC_REGISTRY}/${image}${suffix}:${tag}" \
                    || FAILED=1
                done
              done
            done

            # Single canonical sandbox agent (no -ee/-cloud alias); both
            # teable.ai and teable.cn preheat teable/teable-sandbox-agent.
            # "latest" is skipped: the agent publishes no latest tag (its only
            # consumers pull prefix + explicit app build tag). Same rule as the
            # cloud lane above; without it every ee latest-promotion sync fails.
            for tag in "${TAGS[@]}"; do
              [ -n "$tag" ] || continue
              [ "$tag" = "latest" ] && continue
              retry_copy \
                "${SRC_REGISTRY}/teable-sandbox-agent:${tag}" \
                "${DST_REGISTRY}/teable-sandbox-agent:${tag}" \
                all \
                "${EE_SRC_REGISTRY}/teable-sandbox-agent:${tag}" \
                || FAILED=1
            done
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::Some images failed to sync to Aliyun"
            exit 1
          fi
          echo "🎉 All images synced successfully"
