name: Manual ECS Deploy (Verify)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., release.2026-04-20T10-38-57Z.1)'
        required: true
      trigger:
        description: 'Who triggered this deployment'
        required: false
        default: 'Manual'
      release_created_time:
        description: 'Creation time of the release record that triggered this deploy (ISO 8601)'
        required: false
        default: ''
      release_record_id:
        description: 'Cloud release record ID in Teable Releases table'
        required: false
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Teable release record IDs to link on the launch record'
        required: false
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the launch record'
        required: false
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the launch record'
        required: false
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      trigger:
        description: 'Who triggered this deployment'
        required: false
        type: string
        default: 'Automation'
      release_created_time:
        description: 'Creation time of the release record that triggered this deploy (ISO 8601)'
        required: false
        type: string
        default: ''
      release_record_id:
        description: 'Cloud release record ID in Teable Releases table'
        required: false
        type: string
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Teable release record IDs to link on the launch record'
        required: false
        type: string
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the launch record'
        required: false
        type: string
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the launch record'
        required: false
        type: string
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        type: string
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        type: string
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
    outputs:
      start_time:
        description: 'Deployment start timestamp'
        value: ${{ jobs.prepare.outputs.start_time }}
      image_tag:
        description: 'Deployed image tag'
        value: ${{ jobs.prepare.outputs.image_tag }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PACKAGES_KEY:
        required: true
      TEABLE_API_TOKEN:
        required: false
      INFRA_TEABLE_AI_PREHEAT_TOKEN:
        required: false
      INFRA_TEABLE_CN_PREHEAT_TOKEN:
        required: false

# NOTE on ordering: no workflow-level concurrency here on purpose — GitHub
# keeps only ONE pending run per group and CANCELS earlier pending ones,
# which would cancel a whole production release (ECS + promote + aliyun).
# The only shared mutable state this workflow touches cross-run is the EKS
# deployments; deploy-eks guards those with a deploy-epoch annotation CAS
# instead (older attempt refuses to overwrite a newer one).
jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.start_time.outputs.start }}
      image_tag: ${{ inputs.image_tag }}

    steps:
      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

  # Production deploys run from the official release.<id> tag. A staging
  # build only carries its beta-<id> registry twin, so the FIRST launch of a
  # build stamps release.<id> from it (ghcr + ECR) before anything deploys —
  # the presence of a release.* tag is what makes a version official,
  # permanently retained, and exempt from beta cleanup / the ECR lifecycle
  # policy. Re-deploys of an already-released id (rollbacks) find the tag
  # present and skip, so they work even after the beta twin is reaped.
  stamp-release:
    name: Stamp official release tags
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stamp release tags from the staging build
        env:
          RELEASE_ID: ${{ inputs.image_tag }}
          ECR_REGISTRY: 649941507946.dkr.ecr.us-west-2.amazonaws.com/teable
        run: |
          set -euo pipefail
          BETA_TAG="beta-${RELEASE_ID#release.}"
          REGISTRIES=("ghcr.io/teableio" "$ECR_REGISTRY")
          IMAGES=("teable-cloud" "teable-sandbox-cloud")

          # Source EVERY release stamp from ghcr's beta, never from ECR's:
          # the staging CDN rehearsal (manual-ecs-staging-deploy) patches
          # ECR's beta-<id> IN PLACE under the same tag, and for now a
          # production launch must ship the clean UNPATCHED build — CDN
          # stays a staging-only experiment until it is promoted on purpose.
          # For untouched builds ghcr and ECR betas are identical, so this
          # changes nothing for them. imagetools copies blobs cross-registry
          # as needed.
          for REGISTRY in "${REGISTRIES[@]}"; do
            for IMAGE in "${IMAGES[@]}"; do
              if docker buildx imagetools inspect "$REGISTRY/${IMAGE}:${RELEASE_ID}" >/dev/null 2>&1; then
                echo "✅ ${IMAGE}:${RELEASE_ID} already stamped on ${REGISTRY}"
                continue
              fi
              docker buildx imagetools create \
                --tag "$REGISTRY/${IMAGE}:${RELEASE_ID}" \
                "ghcr.io/teableio/${IMAGE}:${BETA_TAG}"
            done
          done

  # Production twin of the staging patch-cdn. Prefers promoting the staging-
  # patched beta (ship what staging tested; its assets are already in S3);
  # otherwise patches the clean release stamp in place. ghcr stays clean —
  # sync-aliyun keeps shipping unpatched images to CN, which patches its own.
  patch-cdn:
    name: Patch app image for CDN
    needs: [prepare, stamp-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ inputs.image_tag }}
      CDN_ORIGIN: https://sss.teable.ai
      ASSET_BUCKET: teable-next-asset
      ECR_IMAGE: 649941507946.dkr.ecr.us-west-2.amazonaws.com/teable/teable-cloud

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if the release is already patched (rollback fast-path)
        id: existing
        run: |
          set -euo pipefail
          docker pull "${ECR_IMAGE}:${RELEASE_ID}"
          CURRENT=$(docker inspect --format '{{index .Config.Labels "teable.asset-prefix"}}' \
            "${ECR_IMAGE}:${RELEASE_ID}" 2>/dev/null || echo "")
          if [ "$CURRENT" = "$CDN_ORIGIN" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${RELEASE_ID} already carries the ${CDN_ORIGIN} patch; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote the staging-patched beta if available
        if: steps.existing.outputs.exists == 'false'
        id: promote
        run: |
          set -euo pipefail
          BETA_TAG="beta-${RELEASE_ID#release.}"
          if docker pull "${ECR_IMAGE}:${BETA_TAG}" 2>/dev/null; then
            LABEL=$(docker inspect --format '{{index .Config.Labels "teable.asset-prefix"}}' \
              "${ECR_IMAGE}:${BETA_TAG}" 2>/dev/null || echo "")
            if [ "$LABEL" = "$CDN_ORIGIN" ]; then
              docker tag "${ECR_IMAGE}:${BETA_TAG}" "${ECR_IMAGE}:${RELEASE_ID}"
              docker push "${ECR_IMAGE}:${RELEASE_ID}"
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              echo "✅ promoted staging-patched ${BETA_TAG} (assets already uploaded by staging)"
              exit 0
            fi
          fi
          echo "promoted=false" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy scripts
        if: steps.existing.outputs.exists == 'false' && steps.promote.outputs.promoted == 'false'
        uses: actions/checkout@v4

      - name: Build patch layer
        if: steps.existing.outputs.exists == 'false' && steps.promote.outputs.promoted == 'false'
        id: patch
        run: |
          set -euo pipefail

          # Unrecognized bundle format → launch untouched, don't block.
          if ! docker run --rm --entrypoint node -e PATCH_DRY_RUN=1 \
              -v "$PWD/.github/scripts/patch-asset-prefix.mjs:/tmp/patch-asset-prefix.mjs:ro" \
              "${ECR_IMAGE}:${RELEASE_ID}" /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app; then
            echo "::warning::${RELEASE_ID} bundle format not recognized by the patch script; launching untouched"
            echo "patched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker build -t app-cdn-variant \
            --build-arg BASE_IMAGE="${ECR_IMAGE}:${RELEASE_ID}" \
            --build-arg CDN_ORIGIN="${CDN_ORIGIN}" \
            -f - .github/scripts <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG CDN_ORIGIN
          RUN --mount=type=bind,source=patch-asset-prefix.mjs,target=/tmp/patch-asset-prefix.mjs \
              node /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app
          ENV NEXT_BUILD_ENV_ASSET_PREFIX=${CDN_ORIGIN}
          LABEL teable.asset-prefix=${CDN_ORIGIN}
          EOF
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the patched image
        if: steps.existing.outputs.exists == 'false' && steps.promote.outputs.promoted == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh app-cdn-variant -c '
            set -e
            SAMPLE=$(ls /app/enterprise/app-ee/.next/static/chunks/turbopack-*.js | head -1)
            grep -q "'"${CDN_ORIGIN}"'/_next/" "$SAMPLE"
            [ "$NEXT_BUILD_ENV_ASSET_PREFIX" = "'"${CDN_ORIGIN}"'" ]
            echo "smoke OK: $SAMPLE"
          '

      - name: Upload patched static assets to S3 (append-only)
        if: steps.existing.outputs.exists == 'false' && steps.promote.outputs.promoted == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          CID=$(docker create app-cdn-variant)
          docker cp "$CID:/app/enterprise/app-ee/.next/static" ./static-out
          docker rm "$CID" >/dev/null
          # NEVER --delete: chunks of other builds must survive.
          # Fonts land as octet-stream (CLI can't guess those extensions) —
          # accepted: browsers sniff font magic bytes, nothing breaks.
          aws s3 cp ./static-out "s3://${ASSET_BUCKET}/_next/static/" \
            --recursive --only-show-errors
          echo "uploaded $(find ./static-out -type f | wc -l) files"

      - name: Push patched image under the release tag
        if: steps.existing.outputs.exists == 'false' && steps.promote.outputs.promoted == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker tag app-cdn-variant "${ECR_IMAGE}:${RELEASE_ID}"
          docker push "${ECR_IMAGE}:${RELEASE_ID}"

  # EKS is THE production deploy since 2026-07-27 (100% traffic cutover;
  # ECS legs removed from this workflow the same day). DB migration runs as
  # a K8s Job before the deployments roll.
  deploy-eks:
    name: Deploy to Production EKS
    needs: [prepare, stamp-release, patch-cdn]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC, namespace-scoped role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649941507946:role/teable-staging-eks-deploy
          role-session-name: eks-prod-deploy
          aws-region: us-west-2

      - name: Roll EKS deployments to this release
        id: roll
        env:
          RELEASE_ID: ${{ inputs.image_tag }}
          ECR: 649941507946.dkr.ecr.us-west-2.amazonaws.com
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region us-west-2 --name teable-infra

          # Ordering guard (Codex on #85): token is the RUN id — assigned at
          # run creation, so a run delayed in patch-cdn/migration still keeps
          # its original order (run ids increase monotonically per repo, and
          # workflow_call shares the caller's run id). Annotation write is a
          # CAS via resourceVersion; the primary deploy acts as the lock.
          MY_ID=${{ github.run_id }}
          for attempt in 1 2 3 4 5; do
            read -r RV CUR <<<"$(kubectl -n teable-prod get deploy teable-prod \
              -o jsonpath='{.metadata.resourceVersion} {.metadata.annotations.teable\.io/deploy-run-id}')"
            if [ -n "$CUR" ] && [ "$CUR" -gt "$MY_ID" ] 2>/dev/null; then
              echo "::notice::run $CUR (> mine $MY_ID) already deployed EKS; skipping"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # rerun of the same run keeps its run_id — resume, don't skip
            [ "$CUR" = "$MY_ID" ] && echo "resuming own run $MY_ID" && break
            kubectl -n teable-prod annotate --overwrite --resource-version="$RV" \
              deploy/teable-prod teable.io/deploy-run-id="$MY_ID" 2>/dev/null && break
            [ "$attempt" = "5" ] && echo "::error::deploy-run-id CAS failed 5x" && exit 1
            sleep 2
          done

          APP_DIGEST=$(aws ecr describe-images --region us-west-2 \
            --repository-name teable/teable-cloud \
            --image-ids imageTag="$RELEASE_ID" \
            --query 'imageDetails[0].imageDigest' --output text)
          SANDBOX_DIGEST=$(aws ecr describe-images --region us-west-2 \
            --repository-name teable/teable-sandbox-cloud \
            --image-ids imageTag="$RELEASE_ID" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "app:     ${RELEASE_ID} -> ${APP_DIGEST}"
          echo "sandbox: ${RELEASE_ID} -> ${SANDBOX_DIGEST}"

          # ── DB migration as a K8s Job (was an ECS one-off RunTask) ──
          JOB="migrate-${{ github.run_id }}-${{ github.run_attempt }}"
          kubectl -n teable-prod delete job "$JOB" --ignore-not-found >/dev/null 2>&1
          cat <<MIGEOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: teable-prod
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 7200
            activeDeadlineSeconds: 900
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { teable.io/node-pool: general }
                containers:
                  - name: migrate
                    image: ${ECR}/teable/teable-cloud@${APP_DIGEST}
                    args: ["migrate-only"]
                    envFrom: [{ secretRef: { name: teable-prod-env } }]
                    resources:
                      requests: { cpu: 250m, memory: 1Gi }
                      limits: { cpu: "2", memory: 3Gi }
          MIGEOF
          echo "waiting for migration job ${JOB}..."
          MIG_OK=""
          for i in $(seq 1 180); do
            ST=$(kubectl -n teable-prod get job "${JOB}" \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' 2>/dev/null || echo "")
            case "$ST" in
              *Complete=True*) MIG_OK=1; break ;;
              *Failed=True*)   break ;;
            esac
            sleep 5
          done
          if [ -z "$MIG_OK" ]; then
            echo "::error::DB migration failed or timed out"
            kubectl -n teable-prod logs "job/${JOB}" --tail=100 || true
            exit 1
          fi
          echo "migration completed"

          kubectl -n teable-prod set image deploy/teable-prod \
            teable="${ECR}/teable/teable-cloud@${APP_DIGEST}"
          kubectl -n teable-prod set image deploy/teable-prod-byodb-worker \
            teable="${ECR}/teable/teable-cloud@${APP_DIGEST}"
          kubectl -n teable-prod set image deploy/teable-sandbox \
            sandbox="${ECR}/teable/teable-sandbox-cloud@${SANDBOX_DIGEST}"

          kubectl -n teable-prod annotate --overwrite \
            deploy/teable-prod-byodb-worker deploy/teable-sandbox \
            teable.io/deploy-run-id="$MY_ID" teable.io/deploy-release="$RELEASE_ID"
          kubectl -n teable-prod annotate --overwrite \
            deploy/teable-prod teable.io/deploy-release="$RELEASE_ID"

          # Post-mutation check: if a newer run took the lock mid-flight the
          # images may interleave — surface it instead of pretending order.
          FINAL=$(kubectl -n teable-prod get deploy teable-prod \
            -o jsonpath='{.metadata.annotations.teable\.io/deploy-run-id}')
          if [ "$FINAL" != "$MY_ID" ]; then
            echo "::error::run $FINAL overlapped this deploy — EKS may hold mixed images; redeploy the latest release"
            exit 1
          fi

      - name: Wait for rollouts
        if: steps.roll.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          kubectl -n teable-prod rollout status deploy/teable-prod --timeout=600s
          kubectl -n teable-prod rollout status deploy/teable-prod-byodb-worker --timeout=300s
          kubectl -n teable-prod rollout status deploy/teable-sandbox --timeout=300s

      - name: Verify ALB target health (weight-0 passive check)
        if: steps.roll.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # draining targets are old pods on their way out (socket TG holds
          # them up to 300s) — they must not fail the check. Settled means:
          # at least one healthy, nothing still initializing or unhealthy.
          for tg_name in teable-eks-app teable-eks-socket; do
            TG_ARN=$(aws elbv2 describe-target-groups --region us-west-2 \
              --names "$tg_name" --query 'TargetGroups[0].TargetGroupArn' --output text)
            for i in $(seq 1 30); do
              STATES=$(aws elbv2 describe-target-health --region us-west-2 \
                --target-group-arn "$TG_ARN" \
                --query 'TargetHealthDescriptions[].TargetHealth.State' --output text | tr '\t' '\n')
              HEALTHY=$(echo "$STATES" | awk '/^healthy/{c++} END{print c+0}')
              NOTOK=$(echo "$STATES" | awk 'NF && $0 !~ /^healthy/ && $0 !~ /^draining/ {c++} END{print c+0}')
              echo "$tg_name: healthy=$HEALTHY not-ok=$NOTOK (draining ignored)"
              [ "$HEALTHY" -ge 1 ] && [ "$NOTOK" = "0" ] && break
              [ "$i" = "30" ] && echo "::error::$tg_name targets not settled healthy" && exit 1
              sleep 10
            done
          done

      - name: Smoke check through the live domain
        if: steps.roll.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://app.teable.ai/health || true)
            [ "$code" = "200" ] && echo "app.teable.ai /health: 200" && exit 0
            echo "attempt $i: $code"; sleep 6
          done
          echo "::error::app.teable.ai /health never returned 200 after rollout"
          exit 1

      - name: Alert Feishu on deploy failure
        if: failure()
        env:
          RELEASE_ID: ${{ inputs.image_tag }}
        run: |
          PAYLOAD=$(jq -n \
            --arg l1 "🚨 生产 EKS 发布失败: ${RELEASE_ID}" \
            --arg l2 "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{msg_type:"text",content:{text:($l1 + "\n" + $l2)}}')
          HTTP=$(curl -s -o /tmp/feishu.out -w "%{http_code}" -X POST \
            'https://open.feishu.cn/open-apis/bot/v2/hook/66b6ebf2-9bbd-4e41-b629-4062a6be4a42' \
            -H 'Content-Type: application/json' -d "$PAYLOAD")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::warning::Feishu alert failed HTTP $HTTP: $(cat /tmp/feishu.out)"
          fi

  promote-latest:
    name: Promote Release Tag to Latest
    needs: [prepare, deploy-eks]
    runs-on: ubuntu-latest

    steps:
      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote release tag to latest
        env:
          RELEASE_ID: ${{ inputs.image_tag }}
          ECR_REGISTRY: 649941507946.dkr.ecr.us-west-2.amazonaws.com/teable
        run: |
          REGISTRIES=("ghcr.io/teableio" "$ECR_REGISTRY")
          IMAGES=("teable-cloud" "teable-sandbox-cloud")

          for REGISTRY in "${REGISTRIES[@]}"; do
            for IMAGE in "${IMAGES[@]}"; do
              docker buildx imagetools create \
                --tag "$REGISTRY/${IMAGE}:latest" \
                "$REGISTRY/${IMAGE}:${RELEASE_ID}"
            done
          done

  # Aliyun receives images ONLY at release time. The official release.<id>
  # must ship alongside latest: teable.cn (manual-sealos-deploy) deploys
  # that pinned tag from Aliyun, and the sync's cloud lane also carries the
  # canonical agent tag that CN sandboxes pull.
  sync-aliyun:
    needs: [stamp-release, promote-latest]
    if: needs.promote-latest.result == 'success'
    uses: ./.github/workflows/sync-aliyun.yaml
    with:
      edition: cloud
      tags: "latest,${{ inputs.image_tag }}"
    secrets: inherit

  # Preheat CN sandbox-agent nodes as soon as the agent tag lands on Aliyun.
  # Best-effort: not part of the notify gating — a preheat miss only costs
  # first-spawn latency.
  preheat-sandbox-agent:
    needs: sync-aliyun
    if: needs.sync-aliyun.result == 'success'
    uses: ./.github/workflows/preheat-sandbox-agent-cloud.yaml
    with:
      image_tag: ${{ inputs.image_tag }}
      best_effort: true
    secrets: inherit

  # With the release stamped and deployed, the accumulated cloud staging
  # versions have served their purpose: reap beta-* keeping a small cushion
  # for staging rollback. The launched version itself only loses its beta-
  # tag — the image survives, now carrying release.<id>. PACKAGES_KEY has
  # the needed scopes (delete:packages + write:packages, probed
  # 2026-07-18). Shares the ghcr-gc concurrency group: the cleanup action
  # must never run twice against the same package.
  cleanup-beta:
    name: Reap cloud staging versions
    needs: [deploy-eks, promote-latest]
    if: needs.deploy-eks.result == 'success'
    # Housekeeping must never mark a successful production deploy as
    # failed — the scheduled ghcr-gc backstop catches misses.
    continue-on-error: true
    concurrency:
      group: ghcr-gc
    runs-on: ubuntu-latest
    steps:
      - name: Delete old beta versions of the cloud packages
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PACKAGES_KEY }}
          owner: teableio
          packages: teable-cloud,teable-sandbox-cloud
          delete-tags: beta-*
          keep-n-tagged: 5
          exclude-tags: latest,release.*
          validate: true

  notify:
    name: Record Deployment in Teable
    needs: [prepare, deploy-eks, promote-latest, sync-aliyun]
    if: >-
      inputs.record_launch != false &&
      needs.deploy-eks.result == 'success' &&
      needs.promote-latest.result == 'success' &&
      needs.sync-aliyun.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create teable.ai Launch
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          REGION: teable.ai
          IMAGE_TAG: ${{ inputs.image_tag }}
          TRIGGER: ${{ inputs.trigger || github.actor }}
          RELEASE_CREATED_TIME: ${{ inputs.release_created_time }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          RELATED_RELEASE_RECORD_IDS: ${{ inputs.related_release_record_ids }}
          REFINED_CHANGELOG: ${{ inputs.refined_changelog }}
          REFINED_CHANGELOG_ZH: ${{ inputs.refined_changelog_zh }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
        run: bash .github/scripts/record-teable-launch.sh

  finalize-release:
    name: Finalize Release publishing progress
    needs: notify
    if: >-
      inputs.record_launch != false &&
      needs.notify.result == 'success' &&
      inputs.release_record_id != '' &&
      inputs.publish_lock_id != ''
    runs-on: ubuntu-latest
    concurrency:
      group: finalize-teable-release-${{ inputs.release_record_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record teable.ai completion
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: ai
        run: bash .github/scripts/finalize-teable-release.sh
