name: Manual ACK CN Deploy

# teable.cn on Aliyun ACK (cluster teable-cn-app, namespace teable-app). Serves
# production since the 2026-10-20 cutover from Sealos. It replaced the Sealos
# leg (manual-sealos-deploy.yaml, since removed) and kept its inputs/outputs/
# secrets contract; called by rollback-launch (workflow_call) and dispatched by
# Release Publisher.
#
# Differences from the former Sealos leg:
#   - Cluster access via GitHub OIDC -> RAM role teable-cn-app-github-deploy
#     (AssumeRoleWithOIDC, 1h STS); no KUBE_CONFIG. The role trusts
#     refs/heads/main only; callers must grant `id-token: write`.
#   - The migration Job reads PRISMA_DATABASE_URL from the cluster Secret
#     teable-cloud-env; no database credentials in GitHub.
#   - Patched _next/static goes to the OSS public bucket (CDN origin after
#     cutover) with the same STS credentials; no SEALOS_OBJECTSTORAGE_* keys.
#     Uploaded on every run, even when the image was already patched by the
#     former Sealos leg (release tags from before the cutover).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., release.2026-04-20T10-38-57Z.1)'
        required: true
      trigger:
        description: 'Who triggered this deployment'
        required: false
        default: 'Manual'
      release_created_time:
        description: 'Creation time of the Release record that triggered this deploy'
        required: false
        default: ''
      release_record_id:
        description: 'Cloud Release record ID used to track publishing progress'
        required: false
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Release record IDs to link on the Launch'
        required: false
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the Launch'
        required: false
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the Launch'
        required: false
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      trigger:
        description: 'Who triggered this deployment'
        required: false
        type: string
        default: 'Automation'
      release_created_time:
        description: 'Creation time of the Release record that triggered this deploy'
        required: false
        type: string
        default: ''
      release_record_id:
        description: 'Cloud Release record ID used to track publishing progress'
        required: false
        type: string
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Release record IDs to link on the Launch'
        required: false
        type: string
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the Launch'
        required: false
        type: string
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the Launch'
        required: false
        type: string
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        type: string
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        type: string
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
    outputs:
      start_time:
        description: 'Deployment start timestamp'
        value: ${{ jobs.deploy.outputs.start_time }}
      image_tag:
        description: 'Deployed image tag'
        value: ${{ jobs.deploy.outputs.image_tag }}
    secrets:
      TEABLE_API_TOKEN:
        required: false
      LARK_BOT_URL:
        required: false
      # Used by stamp-ghcr and ensure-aliyun to check which tags are already
      # on Aliyun (the copies run on the Hong Kong relay) — callers not using
      # `secrets: inherit` must pass it for the self-heal copy to work.
      ALI_DOCKER_PASSWORD:
        required: false
      # Used by the preheat-sandbox-agent job — same contract as above.
      INFRA_TEABLE_CN_PREHEAT_TOKEN:
        required: false

env:
  # Defaults match terraform/deployments/aliyun-ack-cn-app in teable-infra;
  # repository variables override them.
  ACK_CN_APP_CLUSTER_ID: ${{ vars.ACK_CN_APP_CLUSTER_ID || 'c8200c68711e1417a885670b094a80988' }}
  ACK_CN_APP_REGION: ${{ vars.ACK_CN_APP_REGION || 'cn-hangzhou' }}
  ACK_CN_APP_NAMESPACE: teable-app
  # The API server has only a private endpoint: CI reaches it through this machine bastion
  # (teable-bastion-cn-k8s, terraform/deployments/aliyun-bastion in teable-infra).
  ACK_CN_APP_BASTION: ${{ vars.ACK_CN_APP_BASTION || 'i-bp11l83r5m3vqmbimu1o' }}
  ALIYUN_ROLE_ARN: ${{ vars.ACK_CN_APP_DEPLOY_ROLE_ARN || 'acs:ram::1145786521954482:role/teable-cn-app-github-deploy' }}
  ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ACK_CN_APP_OIDC_PROVIDER_ARN || 'acs:ram::1145786521954482:oidc-provider/github-actions' }}
  # ensure-aliyun copies through the Hong Kong relay (terraform/deployments/aliyun-acr-relay-hk
  # in teable-infra) with its own role; see .github/scripts/acr-relay-copy.sh.
  ACR_RELAY_INSTANCE_ID: ${{ vars.ACR_RELAY_INSTANCE_ID || 'i-j6cgf1dhj2eq8ue1rogk' }}
  ACR_RELAY_ROLE_ARN: ${{ vars.ACR_RELAY_ROLE_ARN || 'acs:ram::1145786521954482:role/acr-relay-hk-github' }}

# GitHub's "re-run failed jobs" reuses successful upstream jobs from the
# previous attempt. Keep the initial fast-fail job, but every job that can
# mutate images or production must also revalidate the lock in its own steps.
jobs:
  validate-publish-lock:
    name: Validate teable.cn publishing lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lock validation script
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        uses: actions/checkout@v4

      - name: Validate publishing lock
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/validate-teable-publish-lock.sh

  # teable.cn deploys official release.<id> tags from Aliyun, but Aliyun
  # only receives images at release time (manual-ecs-deploy's sync-aliyun).
  # stamp-ghcr + ensure-aliyun make the CN launch self-sufficient: if this
  # build was never released yet, its release.<id> is first stamped on ghcr
  # from the beta-<id> staging twin, then any tag missing on Aliyun is copied
  # over — so the CN and AI launches can run in either order. Idempotent:
  # near-instant when the tags already exist.
  #
  # Two jobs because one job has one GITHUB_TOKEN: stamping needs
  # packages: write, while ensure-aliyun hands its token to the Hong Kong
  # relay and so must stay read-only.
  #
  # The agent is included because CN sandboxes pull
  # <aliyun prefix>:<the app's release id> at spawn time; it always carries
  # the release tag already (tagged at build time).
  stamp-ghcr:
    name: Stamp release tags on ghcr
    needs: validate-publish-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout lock validation script
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        uses: actions/checkout@v4

      - name: Revalidate teable.cn publishing lock
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/validate-teable-publish-lock.sh

      - name: Install skopeo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
               sudo env DEBIAN_FRONTEND=noninteractive \
                timeout 180s apt-get install -y skopeo; then
              exit 0
            fi
            echo "::warning::skopeo install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::skopeo installation failed after 3 attempts"
          exit 1

      - name: Stamp release tags missing on ghcr
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          DST_CREDS: ${{ vars.ALI_DOCKER_USERNAME }}:${{ secrets.ALI_DOCKER_PASSWORD }}
          SRC_REGISTRY: ghcr.io/teableio
          DST_REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BETA_TAG="beta-${TAG#release.}"

          retry_copy() {
            local src="$1" dst="$2"
            for attempt in 1 2 3; do
              if timeout --signal=TERM 40m skopeo copy --all \
                  --src-creds="$SRC_CREDS" \
                  --dest-creds="$SRC_CREDS" \
                  "docker://${src}" "docker://${dst}"; then
                return 0
              fi
              echo "⚠️ attempt ${attempt} failed for ${src}, retrying in 10s"
              sleep 10
            done
            echo "❌ failed to copy ${src} -> ${dst}"
            return 1
          }

          for image in teable-cloud teable-sandbox-cloud teable-sandbox-agent; do
            # A tag already on Aliyun needs neither stamping nor copying.
            if timeout 60s skopeo inspect --raw --creds="$DST_CREDS" \
                "docker://${DST_REGISTRY}/${image}:${TAG}" >/dev/null 2>&1; then
              echo "✅ ${image}:${TAG} already on Aliyun"
              continue
            fi
            if timeout 60s skopeo inspect --raw --creds="$SRC_CREDS" \
                "docker://${SRC_REGISTRY}/${image}:${TAG}" >/dev/null 2>&1; then
              echo "✅ ${image}:${TAG} already stamped on ghcr"
              continue
            fi
            echo "⏫ ${image}:${TAG} not stamped yet, stamping from ${BETA_TAG} on ghcr"
            retry_copy \
              "${SRC_REGISTRY}/${image}:${BETA_TAG}" \
              "${SRC_REGISTRY}/${image}:${TAG}"
          done

  ensure-aliyun:
    name: Ensure release images on Aliyun
    needs: stamp-ghcr
    runs-on: ubuntu-latest
    # Shared with manual-ecs-deploy's sync-aliyun for the same release tag:
    # both push the same teable-cloud layers (through the same relay).
    # Serialized, whichever runs second finds the blobs already on Aliyun.
    concurrency:
      group: aliyun-upload-${{ inputs.image_tag }}
      cancel-in-progress: false
    timeout-minutes: 120
    # Read-only token: it goes to the relay for the private ghcr pulls.
    # id-token drives the relay.
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Revalidate teable.cn publishing lock
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/validate-teable-publish-lock.sh

      - name: Get Aliyun STS credentials for the relay
        env:
          ALIYUN_ROLE_ARN: ${{ env.ACR_RELAY_ROLE_ARN }}
        run: bash .github/scripts/aliyun-oidc-login.sh

      - name: Install skopeo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
               sudo env DEBIAN_FRONTEND=noninteractive \
                timeout 180s apt-get install -y skopeo; then
              exit 0
            fi
            echo "::warning::skopeo install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::skopeo installation failed after 3 attempts"
          exit 1

      - name: Copy missing images through the relay
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DST_CREDS: ${{ vars.ALI_DOCKER_USERNAME }}:${{ secrets.ALI_DOCKER_PASSWORD }}
          SRC_REGISTRY: ghcr.io/teableio
          DST_REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          for image in teable-cloud teable-sandbox-cloud teable-sandbox-agent; do
            if timeout 60s skopeo inspect --raw --creds="$DST_CREDS" \
                "docker://${DST_REGISTRY}/${image}:${TAG}" >/dev/null 2>&1; then
              echo "✅ ${image}:${TAG} already on Aliyun"
              continue
            fi

            # Same arch rule as sync-aliyun: the app images are amd64-only on
            # Aliyun (patch-cdn re-pushes the tag amd64-only anyway), so
            # shipping the arm64 half would double the upload for nothing.
            arch=amd64
            [ "$image" = "teable-sandbox-agent" ] && arch=all

            # Over the border a single connection drops to ~200 KB/s, so the
            # copy runs on the Hong Kong relay (which retries it itself).
            echo "⏫ ${image}:${TAG} missing on Aliyun, copying from ghcr via the relay"
            bash .github/scripts/acr-relay-copy.sh \
              "${SRC_REGISTRY}/${image}:${TAG}" \
              "${DST_REGISTRY}/${image}:${TAG}" \
              "$arch" \
              "$GHCR_TOKEN"
          done

  # Preheat CN sandbox-agent nodes as soon as the agent tag lands on Aliyun.
  # This is the only place teable.cn gets preheated: the AI launch preheats
  # teable.ai only, so the CN preheat never moves ahead of a CN deploy.
  # Best-effort: not part of the notify gating — a preheat miss only costs
  # first-spawn latency.
  preheat-sandbox-agent:
    needs: ensure-aliyun
    if: needs.ensure-aliyun.result == 'success'
    uses: ./.github/workflows/preheat-sandbox-agent-cloud.yaml
    with:
      image_tag: ${{ inputs.image_tag }}
      targets: cn
      best_effort: true
    secrets: inherit

  # Stamps the release tag on Aliyun with the CDN origin (the label check
  # makes it idempotent, also for tags the former Sealos leg patched with the
  # same origin) and uploads the patched static to the OSS public bucket that
  # sss.teable.cn uses as origin. Caveat: an AI launch's sync-aliyun overwrites
  # the patch — re-run to re-patch.
  patch-cdn:
    name: Patch image for CN CDN
    needs: ensure-aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: read pulls the patch base from ghcr.
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      # 'true' when the deployed tag carries the CDN patch (patched now or
      # earlier); 'false' only for a pre-Turbopack image launched untouched.
      cdn_patched: ${{ steps.existing.outputs.exists == 'true' || steps.patch.outputs.patched == 'true' }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      CDN_ORIGIN: https://sss.teable.cn
      ASSET_BUCKET: ${{ vars.ACK_CN_APP_PUBLIC_BUCKET || 'teable-cn2-app-public' }}
      ALIYUN_IMAGE: registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud
      GHCR_IMAGE: ghcr.io/teableio/teable-cloud

    steps:
      - name: Checkout deploy and lock validation scripts
        uses: actions/checkout@v4

      - name: Revalidate teable.cn publishing lock
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/validate-teable-publish-lock.sh

      - name: Login to Aliyun container registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ vars.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reads the label and digests from the registries instead of pulling the
      # image first: pulling ~600 MB out of Shenzhen to a GitHub runner took
      # ~105 s of this job's ~4 minutes (2026-11). The patch base comes from
      # ghcr, which a runner pulls in seconds: ensure-aliyun copied the amd64
      # manifest unchanged, so the same digest is on ghcr, and pinning it keeps
      # the patch layer on exactly the layers already on Aliyun (the push then
      # uploads only that layer). On any mismatch the base comes from Aliyun.
      - name: Check if the image is already patched and pick the patch base
        id: existing
        run: |
          set -euo pipefail
          acr_ref="${ALIYUN_IMAGE}:${IMAGE_TAG}"
          CURRENT=$(docker buildx imagetools inspect "$acr_ref" --format '{{json .Image}}' \
            | jq -r 'if .config then (.config.Labels["teable.asset-prefix"] // "") else "" end')
          if [ "$CURRENT" = "$CDN_ORIGIN" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${IMAGE_TAG} already carries the ${CDN_ORIGIN} patch; assets are append-only, skipping"
            # The OSS upload below reads the static files out of this image.
            docker pull "$acr_ref"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

          acr_digest=$(docker buildx imagetools inspect "$acr_ref" --format '{{json .Manifest}}' | jq -r '.digest')
          ghcr_digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest}}' \
            | jq -r 'if .manifests then ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | first // "") else .digest end')
          if [ -n "$ghcr_digest" ] && [ "$ghcr_digest" = "$acr_digest" ]; then
            base="${GHCR_IMAGE}@${acr_digest}"
            docker pull "$base"
            # Same digest from Aliyun: every layer is already local, so this
            # fetches only the manifest and config, but it records that Aliyun
            # holds these layers, which is what lets the push below skip them
            # whichever image store this runner's docker uses.
            docker pull "${ALIYUN_IMAGE}@${acr_digest}"
          else
            echo "::warning::ghcr amd64 digest (${ghcr_digest:-none}) differs from Aliyun (${acr_digest}); pulling the patch base from Aliyun"
            base="$acr_ref"
            docker pull "$base"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build patch layer
        if: steps.existing.outputs.exists == 'false'
        id: patch
        env:
          BASE_REF: ${{ steps.existing.outputs.base }}
        run: |
          set -euo pipefail

          # Pre-flight dry-run with the mounted script. Exit 3: no Turbopack runtime at all (a
          # pre-Turbopack image, its assets uploaded at build time), so it launches untouched. Any
          # other failure is a Turbopack bundle the script cannot patch (a Next upgrade whose form
          # is not in the list yet — the build's verify-cdn-patchability canary goes red first):
          # stop here. Pods read the CDN prefix at boot, so launching it unpatched serves pages
          # whose assets were never uploaded — every asset 403/404 (2026-09-22, Next 16.3).
          set +e
          docker run --rm --entrypoint node -e PATCH_DRY_RUN=1 \
            -v "$PWD/.github/scripts/patch-asset-prefix.mjs:/tmp/patch-asset-prefix.mjs:ro" \
            "${BASE_REF}" /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "::notice::${IMAGE_TAG} has no Turbopack runtime (pre-Turbopack build); deploying it untouched"
            echo "patched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::${IMAGE_TAG} bundle format not recognized by .github/scripts/patch-asset-prefix.mjs; refusing to deploy an image whose CDN assets cannot be uploaded. Add the new pattern to the script and deploy again."
            exit 1
          fi

          docker build -t app-cdn-variant \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --build-arg CDN_ORIGIN="${CDN_ORIGIN}" \
            -f - .github/scripts <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG CDN_ORIGIN
          RUN --mount=type=bind,source=patch-asset-prefix.mjs,target=/tmp/patch-asset-prefix.mjs \
              node /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app
          ENV NEXT_BUILD_ENV_ASSET_PREFIX=${CDN_ORIGIN}
          LABEL teable.asset-prefix=${CDN_ORIGIN}
          EOF
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the patched image
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh app-cdn-variant -c '
            set -e
            SAMPLE=$(ls /app/enterprise/app-ee/.next/static/chunks/turbopack-*.js | head -1)
            grep -q "'"${CDN_ORIGIN}"'/_next/" "$SAMPLE"
            [ "$NEXT_BUILD_ENV_ASSET_PREFIX" = "'"${CDN_ORIGIN}"'" ]
            echo "smoke OK: $SAMPLE"
          '

      - name: Get Aliyun STS credentials via OIDC
        if: steps.existing.outputs.exists == 'true' || steps.patch.outputs.patched == 'true'
        run: bash .github/scripts/aliyun-oidc-login.sh

      # Runs on the fast path too: a tag patched by the former Sealos leg had
      # its static uploaded to the Sealos bucket only.
      - name: Upload patched static assets to the OSS public bucket (append-only)
        if: steps.existing.outputs.exists == 'true' || steps.patch.outputs.patched == 'true'
        env:
          SOURCE_IMAGE: ${{ steps.existing.outputs.exists == 'true' && format('{0}:{1}', env.ALIYUN_IMAGE, env.IMAGE_TAG) || 'app-cdn-variant' }}
        run: |
          set -euo pipefail
          CID=$(docker create "${SOURCE_IMAGE}")
          docker cp "$CID:/app/enterprise/app-ee/.next/static" ./static-out
          docker rm "$CID" >/dev/null
          # NEVER delete: chunks of other builds must survive. -u skips
          # objects that are already there and not older.
          aliyun oss cp ./static-out "oss://${ASSET_BUCKET}/_next/static/" -r -u -f --jobs 16 \
            --mode StsToken \
            --access-key-id "${ALIBABA_CLOUD_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}" \
            --sts-token "${ALIBABA_CLOUD_SECURITY_TOKEN}" \
            --region "${ACK_CN_APP_REGION}" \
            -e "oss-${ACK_CN_APP_REGION}.aliyuncs.com"
          echo "uploaded $(find ./static-out -type f | wc -l) files from ${SOURCE_IMAGE}"

      - name: Push patched image back under the same release tag
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker tag app-cdn-variant "${ALIYUN_IMAGE}:${IMAGE_TAG}"
          docker push "${ALIYUN_IMAGE}:${IMAGE_TAG}"

  deploy:
    name: Deploy to ACK (teable-cn-app)
    needs: [ensure-aliyun, patch-cdn]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    # One rollout at a time against the cluster, whichever caller started it.
    concurrency:
      group: ack-cn-app-deploy
      cancel-in-progress: false
    outputs:
      start_time: ${{ steps.start_time.outputs.start }}
      image_tag: ${{ inputs.image_tag }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable

    steps:
      - name: Checkout deploy and lock validation scripts
        uses: actions/checkout@v4

      - name: Revalidate teable.cn publishing lock
        if: inputs.record_launch != false && inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/validate-teable-publish-lock.sh

      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get Aliyun STS credentials via OIDC
        run: bash .github/scripts/aliyun-oidc-login.sh

      - name: Fetch cluster kubeconfig through the bastion
        run: |
          set -euo pipefail
          # Private-endpoint kubeconfig + Session Manager port forward via the machine bastion;
          # the forward keeps running for the rest of the job.
          bash .github/scripts/aliyun-kube-tunnel.sh "${ACK_CN_APP_CLUSTER_ID}" "${ACK_CN_APP_BASTION}" \
            "${ACK_CN_APP_REGION}" "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"
          # GITHUB_ENV only applies to later steps.
          KUBECONFIG="${RUNNER_TEMP}/kubeconfig" kubectl -n "${ACK_CN_APP_NAMESPACE}" get deploy teable-cloud teable-sandbox-cloud

      - name: Update sandbox deployment
        run: |
          set -euo pipefail
          image="${REGISTRY}/teable-sandbox-cloud:${IMAGE_TAG}"
          kubectl -n "${ACK_CN_APP_NAMESPACE}" set image deployment/teable-sandbox-cloud teable-sandbox-cloud="${image}"
          kubectl -n "${ACK_CN_APP_NAMESPACE}" annotate deployment/teable-sandbox-cloud originImageName="${image}" --overwrite
          kubectl -n "${ACK_CN_APP_NAMESPACE}" rollout status deployment/teable-sandbox-cloud --timeout=10m

      # PRISMA_DATABASE_URL comes from the cluster Secret, the same one the
      # app reads, so GitHub holds no database credentials.
      - name: Run migration job
        run: |
          set -euo pipefail
          job="teable-migration-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          kubectl -n "${ACK_CN_APP_NAMESPACE}" delete job "${job}" --ignore-not-found=true
          cat <<EOF | kubectl -n "${ACK_CN_APP_NAMESPACE}" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${job}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                annotations:
                  # The app pool also has elastic nodes; keep cluster-autoscaler
                  # from evicting the Job on scale-down (backoffLimit is 0).
                  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              spec:
                restartPolicy: Never
                nodeSelector:
                  teable.io/node-pool: app
                imagePullSecrets:
                  - name: teable-cloud
                containers:
                  - name: teable
                    image: "${REGISTRY}/teable-cloud:${IMAGE_TAG}"
                    imagePullPolicy: IfNotPresent
                    args: [migrate-only]
                    env:
                      - name: PRISMA_DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: teable-cloud-env
                            key: PRISMA_DATABASE_URL
                    resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 500m, memory: 512Mi }
          EOF
          # Wait for either outcome so a failed migration fails fast with its log.
          for _ in $(seq 1 120); do
            state=$(kubectl -n "${ACK_CN_APP_NAMESPACE}" get job "${job}" -o jsonpath='{.status.succeeded}/{.status.failed}')
            case "${state}" in
              1/*) echo "migration succeeded"; break ;;
              */1) echo "::error::migration job failed"; kubectl -n "${ACK_CN_APP_NAMESPACE}" logs "job/${job}" --tail=200 || true; exit 1 ;;
            esac
            sleep 10
          done
          # Final assertion (also catches the loop running out). Not 1s: from a
          # GitHub runner to the Hangzhou API server, kubectl's connection setup
          # and discovery alone take longer, so an already-Complete Job timed out.
          kubectl -n "${ACK_CN_APP_NAMESPACE}" wait --for=condition=complete "job/${job}" --timeout=60s
          kubectl -n "${ACK_CN_APP_NAMESPACE}" logs "job/${job}" --tail=20 || true

      - name: Update application deployment
        run: |
          set -euo pipefail
          image="${REGISTRY}/teable-cloud:${IMAGE_TAG}"
          kubectl -n "${ACK_CN_APP_NAMESPACE}" set image deployment/teable-cloud teable-cloud="${image}"
          kubectl -n "${ACK_CN_APP_NAMESPACE}" annotate deployment/teable-cloud originImageName="${image}" --overwrite
          kubectl -n "${ACK_CN_APP_NAMESPACE}" rollout status deployment/teable-cloud --timeout=15m

      # The rollout must end on the CDN-patched image. The patch sets
      # NEXT_BUILD_ENV_ASSET_PREFIX, and a pod without it serves pages whose
      # asset URLs miss the CDN. Ordering already prevents this (deploy needs a
      # successful patch-cdn); this turns any other way of ending up on an
      # unpatched image into a failed launch and an alert instead of a silent
      # one.
      - name: Assert every app pod runs the CDN-patched image
        if: needs.patch-cdn.outputs.cdn_patched == 'true'
        env:
          CDN_ORIGIN: https://sss.teable.cn
        run: |
          set -euo pipefail
          k() { kubectl -n "${ACK_CN_APP_NAMESPACE}" "$@"; }
          selector=$(k get deployment teable-cloud -o json \
            | jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')
          pods=$(k get pods -l "$selector" -o json \
            | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name')
          [ -n "$pods" ] || { echo "::error::no running teable-cloud pods to check"; exit 1; }
          bad=0
          for pod in $pods; do
            prefix=""
            # exec goes through the bastion tunnel, which drops the odd connection.
            for _ in 1 2 3; do
              if prefix=$(k exec "$pod" -c teable-cloud -- printenv NEXT_BUILD_ENV_ASSET_PREFIX); then break; fi
              prefix=""
              sleep 3
            done
            if [ "$prefix" = "$CDN_ORIGIN" ]; then
              echo "✅ ${pod}: ${prefix}"
            else
              echo "::error::${pod} runs an image without the CDN patch (NEXT_BUILD_ENV_ASSET_PREFIX='${prefix}')"
              bad=1
            fi
          done
          exit "$bad"

  notify:
    name: Record teable.cn Launch
    needs: deploy
    if: inputs.record_launch != false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create teable.cn Launch
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          REGION: teable.cn
          IMAGE_TAG: ${{ inputs.image_tag }}
          TRIGGER: ${{ inputs.trigger || github.actor }}
          RELEASE_CREATED_TIME: ${{ inputs.release_created_time }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          RELATED_RELEASE_RECORD_IDS: ${{ inputs.related_release_record_ids }}
          REFINED_CHANGELOG: ${{ inputs.refined_changelog }}
          REFINED_CHANGELOG_ZH: ${{ inputs.refined_changelog_zh }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
        run: bash .github/scripts/record-teable-launch.sh

  finalize-release:
    name: Finalize Release publishing progress
    needs: notify
    if: >-
      inputs.record_launch != false &&
      needs.notify.result == 'success' &&
      inputs.release_record_id != '' &&
      inputs.publish_lock_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: finalize-teable-release-${{ inputs.release_record_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record teable.cn completion
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          RELATED_RELEASE_RECORD_IDS: ${{ inputs.related_release_record_ids }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/finalize-teable-release.sh

  notify-failure:
    name: Report teable.cn deploy failure
    needs: [validate-publish-lock, stamp-ghcr, ensure-aliyun, patch-cdn, deploy, notify, finalize-release]
    if: >-
      always() &&
      inputs.record_launch != false &&
      (needs.validate-publish-lock.result == 'failure' ||
       needs.validate-publish-lock.result == 'cancelled' ||
       needs.stamp-ghcr.result == 'failure' ||
       needs.stamp-ghcr.result == 'cancelled' ||
       needs.ensure-aliyun.result == 'failure' ||
       needs.ensure-aliyun.result == 'cancelled' ||
       needs.patch-cdn.result == 'failure' ||
       needs.patch-cdn.result == 'cancelled' ||
       needs.deploy.result == 'failure' ||
       needs.deploy.result == 'cancelled' ||
       needs.notify.result == 'failure' ||
       needs.notify.result == 'cancelled' ||
       needs.finalize-release.result == 'failure' ||
       needs.finalize-release.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: finalize-teable-release-${{ inputs.release_record_id || github.run_id }}
    steps:
      - name: Checkout code
        if: inputs.release_record_id != '' && inputs.publish_lock_id != ''
        uses: actions/checkout@v4

      - name: Settle teable.cn publishing target
        if: inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          RELATED_RELEASE_RECORD_IDS: ${{ inputs.related_release_record_ids }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
          TARGET_RESULT: ${{ needs.notify.result == 'success' && 'success' || 'failure' }}
          FAILURE_MESSAGE: teable.cn publishing workflow failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TARGET_RESULT" = "success" ]; then
            bash .github/scripts/finalize-teable-release.sh
          else
            bash .github/scripts/mark-teable-release-failed.sh
          fi

      - name: Send Feishu failure notification
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.LARK_BOT_URL }}
          PREFLIGHT_RESULT: ${{ needs.validate-publish-lock.result }}
          # Stamping on ghcr is part of preparing the Aliyun images; when it
          # failed, ensure-aliyun only shows "skipped".
          ENSURE_RESULT: ${{ (needs.stamp-ghcr.result == 'failure' || needs.stamp-ghcr.result == 'cancelled') && format('stamp {0}', needs.stamp-ghcr.result) || needs.ensure-aliyun.result }}
          PATCH_RESULT: ${{ needs.patch-cdn.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LAUNCH_RESULT: ${{ needs.notify.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          set -euo pipefail
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::LARK_BOT_URL is not configured"
            exit 1
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          card_payload=$(jq -n \
            --arg title "teable.cn（ACK）发布失败 ${{ inputs.image_tag }}" \
            --arg preflight "$PREFLIGHT_RESULT" \
            --arg ensure "$ENSURE_RESULT" \
            --arg patch "$PATCH_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg launch "$LAUNCH_RESULT" \
            --arg finalize "$FINALIZE_RESULT" \
            --arg url "$run_url" \
            '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {"tag": "plain_text", "content": $title},
                  "template": "red"
                },
                "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content": ("**发布锁预检**: " + $preflight + "\n**Aliyun 镜像准备**: " + $ensure + "\n**CDN patch**: " + $patch + "\n**ACK 部署**: " + $deploy + "\n**Launch 记录**: " + $launch + "\n**Release 收敛**: " + $finalize + "\n已回写失败目标；重试必须从 Release Publisher 重新获取全局锁。\n[查看 Actions](" + $url + ")")}}
                ]
              }
            }')
          curl -fsS -X POST "$FEISHU_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$card_payload" >/dev/null
