name: Manual Sealos Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., release.2026-04-20T10-38-57Z.1)'
        required: true
      trigger:
        description: 'Who triggered this deployment'
        required: false
        default: 'Manual'
      release_created_time:
        description: 'Creation time of the Release record that triggered this deploy'
        required: false
        default: ''
      release_record_id:
        description: 'Cloud Release record ID used to track publishing progress'
        required: false
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Release record IDs to link on the Launch'
        required: false
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the Launch'
        required: false
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the Launch'
        required: false
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      trigger:
        description: 'Who triggered this deployment'
        required: false
        type: string
        default: 'Automation'
      release_created_time:
        description: 'Creation time of the Release record that triggered this deploy'
        required: false
        type: string
        default: ''
      release_record_id:
        description: 'Cloud Release record ID used to track publishing progress'
        required: false
        type: string
        default: ''
      related_release_record_ids:
        description: 'Comma-separated Release record IDs to link on the Launch'
        required: false
        type: string
        default: ''
      refined_changelog:
        description: 'Reviewed English changelog to store on the Launch'
        required: false
        type: string
        default: ''
      refined_changelog_zh:
        description: 'Reviewed Chinese changelog to store on the Launch'
        required: false
        type: string
        default: ''
      publish_mode:
        description: 'Release Publisher target mode: ai, cn, or all'
        required: false
        type: string
        default: ''
      publish_lock_id:
        description: 'Release Publisher lock identifier'
        required: false
        type: string
        default: ''
      record_launch:
        description: 'Create and finalize Teable Launch records in this workflow'
        required: false
        type: boolean
        default: true
    outputs:
      start_time:
        description: 'Deployment start timestamp'
        value: ${{ jobs.deploy.outputs.start_time }}
      image_tag:
        description: 'Deployed image tag'
        value: ${{ jobs.deploy.outputs.image_tag }}
    secrets:
      KUBE_CONFIG:
        required: true
      PRISMA_DATABASE_URL:
        required: true
      TEABLE_API_TOKEN:
        required: false
      LARK_BOT_URL:
        required: false
      # Used by the ensure-aliyun job (ghcr pull / Aliyun push) — callers
      # not using `secrets: inherit` must pass these for the self-heal
      # copy to work.
      PACKAGES_KEY:
        required: false
      ALI_DOCKER_PASSWORD:
        required: false
      # Used by the preheat-sandbox-agent job — same contract as above.
      INFRA_TEABLE_CN_PREHEAT_TOKEN:
        required: false
      # Used by the patch-cdn job's asset upload to the Sealos bucket —
      # same caller contract as above.
      SEALOS_OBJECTSTORAGE_ACCESS_KEY:
        required: false
      SEALOS_OBJECTSTORAGE_SECRET_KEY:
        required: false

jobs:
  # teable.cn deploys official release.<id> tags from Aliyun, but Aliyun
  # only receives images at release time (manual-ecs-deploy's sync-aliyun).
  # This job makes the CN launch self-sufficient: if this build was never
  # released yet, its release.<id> is first stamped on ghcr from the
  # beta-<id> staging twin, then any tag missing on Aliyun is copied over —
  # so the CN and AI launches can run in either order. Idempotent:
  # near-instant when the tags already exist.
  ensure-aliyun:
    name: Ensure release images on Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install skopeo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
               sudo env DEBIAN_FRONTEND=noninteractive \
                timeout 180s apt-get install -y skopeo; then
              exit 0
            fi
            echo "::warning::skopeo install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::skopeo installation failed after 3 attempts"
          exit 1

      - name: Stamp and copy any missing images
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.PACKAGES_KEY }}
          DST_CREDS: ${{ vars.ALI_DOCKER_USERNAME }}:${{ secrets.ALI_DOCKER_PASSWORD }}
          SRC_REGISTRY: ghcr.io/teableio
          DST_REGISTRY: registry.cn-shenzhen.aliyuncs.com/teable
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BETA_TAG="beta-${TAG#release.}"

          retry_copy() {
            local src="$1" dst="$2" dst_creds="$3"
            for attempt in 1 2 3; do
              if skopeo copy --all \
                  --src-creds="$SRC_CREDS" \
                  --dest-creds="$dst_creds" \
                  "docker://${src}" "docker://${dst}"; then
                return 0
              fi
              echo "⚠️ attempt ${attempt} failed for ${src}, retrying in 10s"
              sleep 10
            done
            echo "❌ failed to copy ${src} -> ${dst}"
            return 1
          }

          # The agent is included because CN sandboxes pull
          # <aliyun prefix>:<the app's release id> at spawn time; it always
          # carries the release tag already (tagged at build time).
          for image in teable-cloud teable-sandbox-cloud teable-sandbox-agent; do
            if skopeo inspect --raw --creds="$DST_CREDS" \
                "docker://${DST_REGISTRY}/${image}:${TAG}" >/dev/null 2>&1; then
              echo "✅ ${image}:${TAG} already on Aliyun"
              continue
            fi

            if ! skopeo inspect --raw --creds="$SRC_CREDS" \
                "docker://${SRC_REGISTRY}/${image}:${TAG}" >/dev/null 2>&1; then
              echo "⏫ ${image}:${TAG} not stamped yet, stamping from ${BETA_TAG} on ghcr"
              retry_copy \
                "${SRC_REGISTRY}/${image}:${BETA_TAG}" \
                "${SRC_REGISTRY}/${image}:${TAG}" \
                "$SRC_CREDS"
            fi

            echo "⏫ ${image}:${TAG} missing on Aliyun, copying from ghcr"
            retry_copy \
              "${SRC_REGISTRY}/${image}:${TAG}" \
              "${DST_REGISTRY}/${image}:${TAG}" \
              "$DST_CREDS"
          done

  # Preheat CN sandbox-agent nodes as soon as the agent tag lands on Aliyun,
  # so a CN-first launch doesn't wait for the AI launch's both-cloud preheat.
  # Best-effort: not part of the notify gating — a preheat miss only costs
  # first-spawn latency.
  preheat-sandbox-agent:
    needs: ensure-aliyun
    if: needs.ensure-aliyun.result == 'success'
    uses: ./.github/workflows/preheat-sandbox-agent-cloud.yaml
    with:
      image_tag: ${{ inputs.image_tag }}
      targets: cn
      best_effort: true
    secrets: inherit

  # CN twin of the staging patch-cdn: patch Aliyun's copy in place with the
  # CN CDN origin, upload the patched static to the Sealos bucket, push back
  # under the same tag (ghcr stays clean). Caveats: first cutover needs a
  # one-time manual Aliyun CDN purge; an AI launch's sync-aliyun overwrites
  # the patch — re-run this deploy to re-patch.
  patch-cdn:
    name: Patch image for CN CDN
    needs: ensure-aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      CDN_ORIGIN: https://sss.teable.cn
      SEALOS_S3_ENDPOINT: https://objectstorageapi.hzh.sealos.run
      ASSET_BUCKET: 38puz7wo-teable-public
      ALIYUN_IMAGE: registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud

    steps:
      - name: Login to Aliyun container registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ vars.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Check if the image is already patched (redeploy fast-path)
        id: existing
        run: |
          set -euo pipefail
          docker pull "${ALIYUN_IMAGE}:${IMAGE_TAG}"
          CURRENT=$(docker inspect --format '{{index .Config.Labels "teable.asset-prefix"}}' \
            "${ALIYUN_IMAGE}:${IMAGE_TAG}" 2>/dev/null || echo "")
          if [ "$CURRENT" = "$CDN_ORIGIN" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${IMAGE_TAG} already carries the ${CDN_ORIGIN} patch; assets are append-only, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy scripts
        if: steps.existing.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Build patch layer
        if: steps.existing.outputs.exists == 'false'
        id: patch
        run: |
          set -euo pipefail

          # Unrecognized bundle format → deploy untouched, don't block.
          if ! docker run --rm --entrypoint node -e PATCH_DRY_RUN=1 \
              -v "$PWD/.github/scripts/patch-asset-prefix.mjs:/tmp/patch-asset-prefix.mjs:ro" \
              "${ALIYUN_IMAGE}:${IMAGE_TAG}" /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app; then
            echo "::warning::${IMAGE_TAG} bundle format not recognized by the patch script; deploying it untouched"
            echo "patched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker build -t app-cdn-variant \
            --build-arg BASE_IMAGE="${ALIYUN_IMAGE}:${IMAGE_TAG}" \
            --build-arg CDN_ORIGIN="${CDN_ORIGIN}" \
            -f - .github/scripts <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG CDN_ORIGIN
          RUN --mount=type=bind,source=patch-asset-prefix.mjs,target=/tmp/patch-asset-prefix.mjs \
              node /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app
          ENV NEXT_BUILD_ENV_ASSET_PREFIX=${CDN_ORIGIN}
          LABEL teable.asset-prefix=${CDN_ORIGIN}
          EOF
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the patched image
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh app-cdn-variant -c '
            set -e
            SAMPLE=$(ls /app/enterprise/app-ee/.next/static/chunks/turbopack-*.js | head -1)
            grep -q "'"${CDN_ORIGIN}"'/_next/" "$SAMPLE"
            [ "$NEXT_BUILD_ENV_ASSET_PREFIX" = "'"${CDN_ORIGIN}"'" ]
            echo "smoke OK: $SAMPLE"
          '

      - name: Upload patched static assets to the Sealos bucket (append-only)
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SEALOS_OBJECTSTORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SEALOS_OBJECTSTORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # MinIO-based endpoint may reject aws cli v2's default checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          CID=$(docker create app-cdn-variant)
          docker cp "$CID:/app/enterprise/app-ee/.next/static" ./static-out
          docker rm "$CID" >/dev/null
          # NEVER --delete: chunks of other builds must survive.
          # Fonts land as octet-stream (CLI can't guess those extensions) —
          # accepted: browsers sniff font magic bytes, nothing breaks.
          aws s3 cp ./static-out "s3://${ASSET_BUCKET}/_next/static/" \
            --recursive --only-show-errors \
            --endpoint-url "${SEALOS_S3_ENDPOINT}"
          echo "uploaded $(find ./static-out -type f | wc -l) files"

      - name: Push patched image back under the same release tag
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker tag app-cdn-variant "${ALIYUN_IMAGE}:${IMAGE_TAG}"
          docker push "${ALIYUN_IMAGE}:${IMAGE_TAG}"

  deploy:
    name: Deploy to Sealos
    needs: [ensure-aliyun, patch-cdn]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      start_time: ${{ steps.start_time.outputs.start }}
      image_tag: ${{ inputs.image_tag }}

    steps:
      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Update sandbox deployment
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: set image deployment/teable-sandbox-cloud teable-sandbox-cloud=registry.cn-shenzhen.aliyuncs.com/teable/teable-sandbox-cloud:${{ inputs.image_tag }}

      - name: Update sandbox deployment annotations
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: annotate deployment/teable-sandbox-cloud originImageName="registry.cn-shenzhen.aliyuncs.com/teable/teable-sandbox-cloud:${{ inputs.image_tag }}" --overwrite

      - name: Rollout sandbox status
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: rollout status deployment/teable-sandbox-cloud --timeout=10m

      - name: Create Job YAML
        run: |
          cat <<EOF > migration-job.yaml
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: teable-migration-${{ github.run_number }}
            labels:
              cloud.sealos.io/deploy-on-sealos: teable
          spec:
            completions: 1
            template:
              metadata:
                name: teable-cloud-teable
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: teable-cloud
                containers:
                  - name: teable
                    image: "registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud:${{ inputs.image_tag }}"
                    imagePullPolicy: IfNotPresent
                    args:
                      - migrate-only
                    env:
                      - name: "PRISMA_DATABASE_URL"
                        value: "${{ secrets.PRISMA_DATABASE_URL }}"
                    resources:
                      limits:
                        memory: 512Mi
                        cpu: 500m
                      requests:
                        cpu: 100m
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
          EOF

      - name: Clean up existing migration job
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: delete job teable-migration-${{ github.run_number }} --ignore-not-found=true

      - name: Apply migration job
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: apply -f migration-job.yaml

      - name: Wait for migration job to complete
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: wait --for=condition=complete job/teable-migration-${{ github.run_number }} --timeout=20m

      - name: Update application deployment
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: set image deployment/teable-cloud teable-cloud=registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud:${{ inputs.image_tag }}

      - name: Update deployment annotations
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: annotate deployment/teable-cloud originImageName="registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud:${{ inputs.image_tag }}" --overwrite

      - name: Rollout status
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: rollout status deployment/teable-cloud --timeout=10m


  notify:
    name: Record teable.cn Launch
    needs: deploy
    if: inputs.record_launch != false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create teable.cn Launch
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          REGION: teable.cn
          IMAGE_TAG: ${{ inputs.image_tag }}
          TRIGGER: ${{ inputs.trigger || github.actor }}
          RELEASE_CREATED_TIME: ${{ inputs.release_created_time }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          RELATED_RELEASE_RECORD_IDS: ${{ inputs.related_release_record_ids }}
          REFINED_CHANGELOG: ${{ inputs.refined_changelog }}
          REFINED_CHANGELOG_ZH: ${{ inputs.refined_changelog_zh }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
        run: bash .github/scripts/record-teable-launch.sh

  finalize-release:
    name: Finalize Release publishing progress
    needs: notify
    if: >-
      inputs.record_launch != false &&
      needs.notify.result == 'success' &&
      inputs.release_record_id != '' &&
      inputs.publish_lock_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: finalize-teable-release-${{ inputs.release_record_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record teable.cn completion
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
        run: bash .github/scripts/finalize-teable-release.sh

  notify-failure:
    name: Report teable.cn deploy failure
    needs: [ensure-aliyun, patch-cdn, deploy, notify, finalize-release]
    if: >-
      always() &&
      inputs.record_launch != false &&
      (needs.ensure-aliyun.result == 'failure' ||
       needs.ensure-aliyun.result == 'cancelled' ||
       needs.patch-cdn.result == 'failure' ||
       needs.patch-cdn.result == 'cancelled' ||
       needs.deploy.result == 'failure' ||
       needs.deploy.result == 'cancelled' ||
       needs.notify.result == 'failure' ||
       needs.notify.result == 'cancelled' ||
       needs.finalize-release.result == 'failure' ||
       needs.finalize-release.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: finalize-teable-release-${{ inputs.release_record_id || github.run_id }}
    steps:
      - name: Checkout code
        if: inputs.release_record_id != '' && inputs.publish_lock_id != ''
        uses: actions/checkout@v4

      - name: Settle teable.cn publishing target
        if: inputs.release_record_id != '' && inputs.publish_lock_id != ''
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_RECORD_ID: ${{ inputs.release_record_id }}
          PUBLISH_LOCK_ID: ${{ inputs.publish_lock_id }}
          TARGET: cn
          TARGET_RESULT: ${{ needs.notify.result == 'success' && 'success' || 'failure' }}
          FAILURE_MESSAGE: teable.cn publishing workflow failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TARGET_RESULT" = "success" ]; then
            bash .github/scripts/finalize-teable-release.sh
          else
            bash .github/scripts/mark-teable-release-failed.sh
          fi

      - name: Send Feishu failure notification
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.LARK_BOT_URL }}
          ENSURE_RESULT: ${{ needs.ensure-aliyun.result }}
          PATCH_RESULT: ${{ needs.patch-cdn.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LAUNCH_RESULT: ${{ needs.notify.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          set -euo pipefail
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::LARK_BOT_URL is not configured"
            exit 1
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          card_payload=$(jq -n \
            --arg title "teable.cn 发布失败 ${{ inputs.image_tag }}" \
            --arg ensure "$ENSURE_RESULT" \
            --arg patch "$PATCH_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg launch "$LAUNCH_RESULT" \
            --arg finalize "$FINALIZE_RESULT" \
            --arg url "$run_url" \
            '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {"tag": "plain_text", "content": $title},
                  "template": "red"
                },
                "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content": ("**Aliyun 镜像准备**: " + $ensure + "\n**CDN patch**: " + $patch + "\n**Sealos 部署**: " + $deploy + "\n**Launch 记录**: " + $launch + "\n**Release 收敛**: " + $finalize + "\n已回写失败目标；其余目标终结后会自动释放发布锁。\n[查看 Actions](" + $url + ")")}}
                ]
              }
            }')
          curl -fsS -X POST "$FEISHU_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$card_payload" >/dev/null
