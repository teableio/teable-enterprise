# EE Remote CI — ai-web suite (was teable-ee's "E2E Tests Frontend - AI"): the AI chat
# Playwright specs against a real model gateway. Selected by path, or on every PR labelled
# "AI test". One workflow per suite so partial reruns produce clean run pages. SOURCE OF TRUTH
# lives in teable-ee .github/enterprise-ci/ and is synced here. Needs AI_GATEWAY_API_KEY,
# E2E_AI_MODEL and E2E_AI_GATEWAY_MODELS in this repository's secrets.

name: EE Remote CI (ai-web)

run-name: 'EE Remote CI ai-web — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-ai-web]

concurrency:
  group: ee-remote-ci-ai-web-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  ai-web:
    # Playwright currently supports Ubuntu 24.04; pin so ubuntu-latest moving to 26.04 cannot
    # break `playwright install --with-deps`.
    runs-on: ubuntu-24.04
    name: AI E2E Tests
    timeout-minutes: 60

    steps:
      - name: 🎫 Mint checkout token
        id: ee-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee
          permission-contents: read

      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ steps.ee-token.outputs.token }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🎭 Setup Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: enterprise/app-ee

      - name: 🗃️ Setup Database
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== switch-db-mode ==="
            echo "1" | make switch-db-mode
          } >> "$LOG_DIR/ai-web.log" 2>&1 || status=$?
          echo "switch-db-mode exit=$status"
          exit $status

      - name: 🧩 Generate Prisma Client
        run: |
          status=0
          {
            echo "=== prisma generate ==="
            pnpm -C community/packages/db-main-prisma prisma-generate-ci &&
            pnpm -C packages/db-main-prisma prisma-generate-ci
          } >> "$LOG_DIR/ai-web.log" 2>&1 || status=$?
          echo "prisma generate exit=$status"
          exit $status

      - name: 🌱 Seed Database
        working-directory: enterprise/backend-ee
        run: |
          status=0
          {
            echo "=== seed (pre-test-e2e) ==="
            pnpm pre-test-e2e
          } >> "$LOG_DIR/ai-web.log" 2>&1 || status=$?
          echo "seed exit=$status"
          exit $status

      - name: 📝 Create Frontend Environment File
        working-directory: enterprise/app-ee
        run: |
          cp .env.development .env.production.local
          cat >> .env.production.local << EOF
          NEXT_BUILD_ENV_EDITION=CLOUD
          NEXT_BUILD_ENV_TYPECHECK=false
          NEXT_BUILD_ENV_SOURCEMAPS=false
          NEXT_BUILD_ENV_SENTRY_ENABLED=false
          PORT=3000
          SOCKET_PORT=3001
          SERVER_PORT=3003
          CI=true
          NEXTJS_DIR=${{ github.workspace }}/enterprise/app-ee
          I18NEXT_DEFAULT_CONFIG_PATH=${{ github.workspace }}/enterprise/app-ee/next-i18next.config.js
          EOF

      # Build BEFORE the backend dev server starts. `pnpm dev-backend` is `nest start -w`
      # (webpack watch) and stays resident; running it alongside the production build has
      # pushed a runner into OOM before, reported as a lost runner rather than a build error.
      - name: 🏗️ Build Frontend
        working-directory: enterprise/app-ee
        timeout-minutes: 30
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          status=0
          {
            echo "=== next build ==="
            pnpm exec next build
          } >> "$LOG_DIR/ai-web.log" 2>&1 || status=$?
          echo "frontend build exit=$status ($(wc -l < "$LOG_DIR/ai-web.log") log lines)"
          exit $status

      - name: 📝 Create Backend Development Environment File
        working-directory: enterprise/app-ee
        run: |
          cp .env.development .env.development.local
          cat >> .env.development.local << 'EOF'
          PORT=3000
          SOCKET_PORT=3001
          SERVER_PORT=3003
          NEXT_BUILD_ENV_EDITION=CLOUD
          EOF

      - name: 🚀 Start Backend Server
        working-directory: enterprise/backend-ee
        run: |
          pnpm dev-backend > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "Backend server started with PID $(cat /tmp/backend.pid)"

      - name: ⏳ Wait for Backend Ready
        run: |
          for i in {1..36}; do
            if curl -sf --connect-timeout 2 --max-time 5 http://localhost:3003/health > /dev/null 2>&1; then
              echo "✅ Backend server is ready after $((i*5)) seconds"
              exit 0
            fi
            echo "Attempt $i/36: waiting for backend..."
            sleep 5
          done
          echo "❌ Backend failed to start within 180 seconds (backend.log ships to teable-ee)"
          exit 1

      - name: 🎭 Run AI E2E Tests
        working-directory: enterprise/app-ee
        env:
          E2E_WEBSERVER_MODE: START
          SERVER_PORT: 3003
          E2E_WORKERS: 4
          NEXTJS_DIR: ${{ github.workspace }}/enterprise/app-ee
          I18NEXT_DEFAULT_CONFIG_PATH: ${{ github.workspace }}/enterprise/app-ee/next-i18next.config.js
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          E2E_AI_MODEL: ${{ secrets.E2E_AI_MODEL }}
          E2E_AI_GATEWAY_MODELS: ${{ secrets.E2E_AI_GATEWAY_MODELS }}
        run: |
          [ -n "$AI_GATEWAY_API_KEY" ] || { echo "AI_GATEWAY_API_KEY is not set in this repository's secrets"; exit 1; }
          status=0
          {
            echo "=== playwright (e2e/pages/ai) ==="
            pnpm exec playwright test e2e/pages/ai/ --trace=on --retries=0
          } >> "$LOG_DIR/ai-web.log" 2>&1 || status=$?
          echo "playwright exit=$status ($(wc -l < "$LOG_DIR/ai-web.log") log lines total)"
          exit $status

      - name: 🎫 Mint log token
        id: logs-token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: write

      - name: 📤 Ship log & artifacts
        if: always()
        # Best effort: a log that fails to ship must not fail a passing shard.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.logs-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Retry with a fresh --clobber run: gh's own 5xx retry gets 422 "already
          # exists" when the failed attempt had in fact stored the asset.
          ship() {
            for n in 1 2 3; do
              gh release upload "$LOG_TAG" "$1" -R "$LOGS_REPO" --clobber && return 0
              if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
            done
            echo "::warning::could not ship $(basename "$1") to $LOGS_REPO"
            return 1
          }
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/ai-web.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/ai-web.log"
          if [ -f /tmp/backend.log ]; then
            { echo ""; echo "=== backend.log ==="; cat /tmp/backend.log; } >> "$LOG_DIR/ai-web.log"
          fi
          # Playwright report/traces/screenshots must not become public artifacts — bundle
          # them into the private channel instead (the report re-homes them for a failure).
          ART_DIRS=""
          for d in enterprise/app-ee/e2e/.out/reports/html enterprise/app-ee/e2e/.out/output enterprise/app-ee/e2e/.out/screenshots; do
            [ -d "$d" ] && ART_DIRS="$ART_DIRS $d"
          done
          if [ -n "$ART_DIRS" ]; then
            tar -czf "$LOG_DIR/ai-web-artifacts.tar.gz" $ART_DIRS || true
          fi
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          ship "$LOG_DIR/ai-web.log"
          if [ -f "$LOG_DIR/ai-web-artifacts.tar.gz" ]; then
            ship "$LOG_DIR/ai-web-artifacts.tar.gz"
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/ai-web.failed"
            ship "$LOG_DIR/ai-web.failed"
          fi

  verdict:
    needs: [ai-web]
    if: always()
    runs-on: ubuntu-latest
    name: AI Web verdict
    timeout-minutes: 5
    steps:
      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint log-read token
        id: logs-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: read

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: ai-web
          results: 'ai-web=${{ needs.ai-web.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ steps.logs-token.outputs.token }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=ai-web" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=ai-web=${{ needs.ai-web.result }}"
