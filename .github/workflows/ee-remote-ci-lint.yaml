# EE Remote CI — lint suite (mirrors teable-ee "Linting and Types").
# One workflow per suite so partial reruns produce clean run pages with no
# skipped-job noise. See ee-remote-ci-integration.yaml header (or the README
# in teable-ee .github/enterprise-ci/) for the architecture and privacy
# contract; SOURCE OF TRUTH lives in teable-ee and is synced here.

name: EE Remote CI (lint)

run-name: 'EE Remote CI lint — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-lint]

concurrency:
  group: ee-remote-ci-lint-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # Verdict jobs read this run's own job timings for the check-run summary.
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck ${{ matrix.scope.name }}
    timeout-minutes: 25

    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      TEABLE_TSDOWN_DISABLE_DTS: '1'

    # One tsc scope per runner: with all three on one 16GB runner the large
    # projects overlapped and the runner was killed mid-tsc (exit 143, "runner
    # has received a shutdown signal") before it could ship its log.
    # The two ee rows together are `pnpm g:typecheck`. backend-ee and app-ee
    # each run tsc with an 8 GiB heap, so they get a runner each instead of
    # running one after the other on a single runner. The filters are spelled
    # out here, not as root scripts, because this template also runs against
    # checkouts that predate it.
    strategy:
      fail-fast: false
      matrix:
        scope:
          - name: ee backend
            args: --fail-if-no-match -F @teable/backend-ee typecheck
          - name: ee app
            args: "-r --fail-if-no-match -F '@teable/*-ee' -F '!@teable/backend-ee' --workspace-concurrency=1 typecheck"
          - name: community
            args: g:typecheck:community
          - name: community backend
            args: g:typecheck:community:backend

    steps:
      - name: 🎫 Mint checkout token
        id: ee-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee
          permission-contents: read

      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ steps.ee-token.outputs.token }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🧩 Generate Prisma Client
        working-directory: packages/db-main-prisma
        run: |
          mkdir -p "$LOG_DIR"
          SLUG=$(echo "${{ matrix.scope.name }}" | tr ' /' '--')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          status=0
          {
            echo "=== prisma generate ==="
            pnpm -F @teable/db-main-prisma-ee prisma-generate --schema ./prisma/postgres/schema.prisma
          } >> "$LOG_DIR/lint-typecheck-$SLUG.log" 2>&1 || status=$?
          echo "prisma generate exit=$status ($(wc -l < "$LOG_DIR/lint-typecheck-$SLUG.log") log lines)"
          exit $status

      - name: 🏗 Build typecheck dependencies
        run: |
          status=0
          {
            echo "=== build typecheck deps ==="
            pnpm -r --filter "./community/packages/**" --sort --workspace-concurrency=4 run build &&
            pnpm -r --filter "./packages/**" --sort --workspace-concurrency=4 run build
          } >> "$LOG_DIR/lint-typecheck-$SLUG.log" 2>&1 || status=$?
          echo "deps build exit=$status ($(wc -l < "$LOG_DIR/lint-typecheck-$SLUG.log") log lines)"
          exit $status

      - name: 🕵️ Typecheck
        run: |
          # Do not prisma-generate here: it rewrites shared @prisma/client
          # while community backend tsc is reading it, which fails as
          # thousands of missing Prisma / PrismaService exports.
          status=0
          {
            echo "=== typecheck (${{ matrix.scope.name }}) ==="
            pnpm ${{ matrix.scope.args }}
          } >> "$LOG_DIR/lint-typecheck-$SLUG.log" 2>&1 || status=$?
          echo "typecheck exit=$status ($(wc -l < "$LOG_DIR/lint-typecheck-$SLUG.log") log lines total)"
          exit $status

      - name: 🎫 Mint log token
        id: logs-token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: write

      - name: 📤 Ship log
        if: always()
        # Best effort: a log that fails to ship must not fail a passing shard.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.logs-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Retry with a fresh --clobber run: gh's own 5xx retry gets 422 "already
          # exists" when the failed attempt had in fact stored the asset.
          ship() {
            for n in 1 2 3; do
              gh release upload "$LOG_TAG" "$1" -R "$LOGS_REPO" --clobber && return 0
              if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
            done
            echo "::warning::could not ship $(basename "$1") to $LOGS_REPO"
            return 1
          }
          mkdir -p "$LOG_DIR"
          SLUG="${SLUG:-$(echo "${{ matrix.scope.name }}" | tr ' /' '--')}"
          [ -f "$LOG_DIR/lint-typecheck-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/lint-typecheck-$SLUG.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          ship "$LOG_DIR/lint-typecheck-$SLUG.log"
          # Failure marker — the conclude step tails only marked logs instead
          # of guessing from log text (which false-positived on ERROR noise).
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/lint-typecheck-$SLUG.failed"
            ship "$LOG_DIR/lint-typecheck-$SLUG.failed"
          fi

  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 20

    steps:
      - name: 🎫 Mint checkout token
        id: ee-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee
          permission-contents: read

      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ steps.ee-token.outputs.token }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      # import-js/order tells workspace packages from npm ones by resolving them,
      # and @teable/* packages resolve through their built dist.
      - name: 🏗 Build community lint dependencies
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== build plugin deps ==="
            pnpm -r --filter "@teable/plugin^..." --sort --workspace-concurrency=4 run build
          } >> "$LOG_DIR/lint-oxlint.log" 2>&1 || status=$?
          echo "deps build exit=$status ($(wc -l < "$LOG_DIR/lint-oxlint.log") log lines)"
          exit $status

      - name: 🔬 Linter
        run: |
          # The four lint scopes are independent — run them in parallel.
          pnpm g:lint > "$LOG_DIR/li-ee.log" 2>&1 & p1=$!
          pnpm g:lint:community > "$LOG_DIR/li-community.log" 2>&1 & p2=$!
          pnpm g:lint-styles > "$LOG_DIR/li-styles-ee.log" 2>&1 & p3=$!
          pnpm g:lint-styles:community > "$LOG_DIR/li-styles-community.log" 2>&1 & p4=$!
          status=0
          wait $p1 || status=1
          wait $p2 || status=1
          wait $p3 || status=1
          wait $p4 || status=1
          for part in ee community styles-ee styles-community; do
            { echo "=== lint ($part) ==="; cat "$LOG_DIR/li-$part.log"; } >> "$LOG_DIR/lint-oxlint.log"
          done
          echo "lint exit=$status ($(wc -l < "$LOG_DIR/lint-oxlint.log") log lines total)"
          exit $status

      - name: 🎫 Mint log token
        id: logs-token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: write

      - name: 📤 Ship log
        if: always()
        # Best effort: a log that fails to ship must not fail a passing shard.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.logs-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Retry with a fresh --clobber run: gh's own 5xx retry gets 422 "already
          # exists" when the failed attempt had in fact stored the asset.
          ship() {
            for n in 1 2 3; do
              gh release upload "$LOG_TAG" "$1" -R "$LOGS_REPO" --clobber && return 0
              if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
            done
            echo "::warning::could not ship $(basename "$1") to $LOGS_REPO"
            return 1
          }
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/lint-oxlint.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/lint-oxlint.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          ship "$LOG_DIR/lint-oxlint.log"
          # Failure marker — the conclude step tails only marked logs instead
          # of guessing from log text (which false-positived on ERROR noise).
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/lint-oxlint.failed"
            ship "$LOG_DIR/lint-oxlint.failed"
          fi

  verdict:
    needs: [typecheck, lint]
    if: always()
    runs-on: ubuntu-latest
    name: Lint verdict
    timeout-minutes: 5
    steps:
      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint log-read token
        id: logs-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: read

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: lint
          results: 'typecheck=${{ needs.typecheck.result }} lint=${{ needs.lint.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ steps.logs-token.outputs.token }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=lint" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=typecheck=${{ needs.typecheck.result }} lint=${{ needs.lint.result }}"
