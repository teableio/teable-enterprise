  verdict:
    needs: [unit-deps, e2e-deps, unit, host-query, e2e, e2e-sensitive, e2e-computed-heavy, e2e-json-formula-cascade, e2e-postgres-only]
    if: always()
    runs-on: ubuntu-latest
    name: V2 verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: v2
          results: 'unit-deps=${{ needs.unit-deps.result }} e2e-deps=${{ needs.e2e-deps.result }} unit=${{ needs.unit.result }} host-query=${{ needs.host-query.result }} e2e=${{ needs.e2e.result }} sensitive=${{ needs.e2e-sensitive.result }} computed-heavy=${{ needs.e2e-computed-heavy.result }} json-formula-cascade=${{ needs.e2e-json-formula-cascade.result }} postgres-only=${{ needs.e2e-postgres-only.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ secrets.PACKAGES_KEY }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=v2" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=unit-deps=${{ needs.unit-deps.result }} e2e-deps=${{ needs.e2e-deps.result }} unit=${{ needs.unit.result }} host-query=${{ needs.host-query.result }} e2e=${{ needs.e2e.result }} sensitive=${{ needs.e2e-sensitive.result }} computed-heavy=${{ needs.e2e-computed-heavy.result }} json-formula-cascade=${{ needs.e2e-json-formula-cascade.result }} postgres-only=${{ needs.e2e-postgres-only.result }}"
