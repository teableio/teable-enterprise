# EE Remote CI — v2 suite (mirrors teable-ee "V2 Tests").
# One workflow per suite so partial reruns produce clean run pages. Fine-
# grained package gates come precomputed from the teable-ee dispatch job
# (dorny/paths-filter "changes" array in client_payload.filters). SOURCE OF
# TRUTH lives in teable-ee .github/enterprise-ci/ and is synced here.

name: EE Remote CI (v2)

run-name: 'EE Remote CI v2 — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-v2]

concurrency:
  group: ee-remote-ci-v2-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  unit-deps:
    if: >-
      contains(fromJson(github.event.client_payload.filters), 'v2_shared') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_adapter_db_postgres_pg') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_adapter_repository_postgres') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_adapter_table_query_ops_postgres') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_adapter_table_repository_postgres') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_core') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_data_query') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_formula_sql_pg') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_table_query_ops')
    runs-on: ubuntu-latest
    name: V2 Unit Dependencies
    timeout-minutes: 15
    outputs:
      data-query-present: ${{ steps.query-package.outputs.present }}
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      # Ephemeral runners need no leak reaper; its socket connect is a known
      # CI flake ("Failed to connect to Reaper").
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Detect optional inline query package
        id: query-package
        run: |
          if [ -f community/packages/v2/data-query/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            {
              echo 'install-args<<EOF'
              printf '%s\n' '--filter' '@teable/v2-data-query...' '--filter' '@teable/cli...'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "inline query package absent at tested SHA — skipping optional checks"
          fi

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-adapter-db-postgres-pg...
            --filter
            @teable/v2-adapter-repository-postgres...
            --filter
            @teable/v2-adapter-table-query-ops-postgres...
            --filter
            @teable/v2-adapter-table-repository-postgres...
            --filter
            @teable/v2-core...
            --filter
            @teable/core...
            --filter
            @teable/v2-formula-sql-pg...
            --filter
            @teable/v2-table-query-ops...
            --filter
            @teable/v2-contract-http-client...
            --filter
            @teable/v2-contract-http-openapi...
            ${{ steps.query-package.outputs.install-args }}

      - name: ☁️ Upload workspace dependencies
        uses: ./.github/actions/workspace-deps-upload
        with:
          name: v2-unit-deps-${{ github.run_id }}

  e2e-deps:
    if: >-
      contains(fromJson(github.event.client_payload.filters), 'v2_shared') ||
      contains(fromJson(github.event.client_payload.filters), 'v2_e2e')
    runs-on: ubuntu-latest
    name: V2 E2E Dependencies
    timeout-minutes: 15
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-e2e...

      - name: ☁️ Upload workspace dependencies
        uses: ./.github/actions/workspace-deps-upload
        with:
          name: v2-e2e-deps-${{ github.run_id }}

  unit:
    needs: [unit-deps]
    if: >-
      !cancelled() && needs.unit-deps.result == 'success'
    runs-on: ubuntu-latest
    name: V2 Unit Tests (${{ matrix.pkg.label }})
    timeout-minutes: 20
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    strategy:
      fail-fast: false
      matrix:
        pkg:
          - label: '@teable/v2-adapter-db-postgres-pg'
            name: '@teable/v2-adapter-db-postgres-pg'
            gate: v2_adapter_db_postgres_pg
          - label: '@teable/v2-adapter-repository-postgres'
            name: '@teable/v2-adapter-repository-postgres'
            gate: v2_adapter_repository_postgres
          - label: '@teable/v2-adapter-table-repository-postgres Shard 1/4'
            name: '@teable/v2-adapter-table-repository-postgres'
            gate: v2_adapter_table_repository_postgres
            shard: 1/4
            workers: 2
          - label: '@teable/v2-adapter-table-repository-postgres Shard 2/4'
            name: '@teable/v2-adapter-table-repository-postgres'
            gate: v2_adapter_table_repository_postgres
            shard: 2/4
            workers: 2
          - label: '@teable/v2-adapter-table-repository-postgres Shard 3/4'
            name: '@teable/v2-adapter-table-repository-postgres'
            gate: v2_adapter_table_repository_postgres
            shard: 3/4
            workers: 2
          - label: '@teable/v2-adapter-table-repository-postgres Shard 4/4'
            name: '@teable/v2-adapter-table-repository-postgres'
            gate: v2_adapter_table_repository_postgres
            shard: 4/4
            workers: 2
          - label: '@teable/v2-adapter-table-query-ops-postgres'
            name: '@teable/v2-adapter-table-query-ops-postgres'
            gate: v2_adapter_table_query_ops_postgres
            postgres: true
            dburl: 'postgresql://postgres:postgres@localhost:5432/teable_test'
          - label: '@teable/v2-core Shard 1/2'
            name: '@teable/v2-core'
            gate: v2_core
            shard: 1/2
            workers: 2
          - label: '@teable/v2-core Shard 2/2'
            name: '@teable/v2-core'
            gate: v2_core
            shard: 2/2
            workers: 2
          - label: '@teable/v2-formula-sql-pg'
            name: '@teable/v2-formula-sql-pg'
            gate: v2_formula_sql_pg
          - label: '@teable/v2-table-query-ops'
            name: '@teable/v2-table-query-ops'
            gate: v2_table_query_ops
          - label: '@teable/v2-data-query'
            name: '@teable/v2-data-query'
            gate: v2_data_query
            optionalQuery: true
          - label: '@teable/v2-contract-http-client'
            name: '@teable/v2-contract-http-client'
            gate: v2_data_query
            queryTests: true
          - label: '@teable/v2-contract-http-openapi'
            name: '@teable/v2-contract-http-openapi'
            gate: v2_data_query
            queryTests: true
          - label: '@teable/cli query protocol'
            name: '@teable/cli'
            gate: v2_data_query
            optionalQuery: true
            queryCli: true

    # Empty image skips the service container for matrix entries without
    # `postgres: true` — only adapter-table-query-ops-postgres needs it.
    services:
      postgres:
        image: ${{ matrix.pkg.postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: teable_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🚪 Gate check
        id: gate
        env:
          FILTERS: ${{ github.event.client_payload.filters }}
          GATE: ${{ matrix.pkg.gate }}
          OPTIONAL_QUERY: ${{ matrix.pkg.optionalQuery }}
          DATA_QUERY_PRESENT: ${{ needs.unit-deps.outputs.data-query-present }}
        run: |
          if [ "$OPTIONAL_QUERY" = "true" ] && [ "$DATA_QUERY_PRESENT" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "inline query package absent at tested SHA — skipping"
          elif echo "$FILTERS" | grep -qE "\"(v2_shared|$GATE)\""; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "package unchanged — skipping"
          fi

      - name: 📦 Checkout teable-ee
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Restore workspace dependencies
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/workspace-deps-download
        with:
          name: v2-unit-deps-${{ github.run_id }}

      - name: 🧪 Run unit tests
        if: steps.gate.outputs.run == 'true'
        env:
          DATA_QUERY_PRESENT: ${{ needs.unit-deps.outputs.data-query-present }}
        run: |
          # Only the query-ops package runs against the service container; the
          # rest use testcontainers/pglite and must NOT see PRISMA_DATABASE_URL
          # (a set value reroutes them to localhost:5432 → ECONNREFUSED).
          if [ -n "${{ matrix.pkg.dburl }}" ]; then
            export PRISMA_DATABASE_URL="${{ matrix.pkg.dburl }}"
          fi
          mkdir -p "$LOG_DIR"
          SLUG=$(echo "${{ matrix.pkg.label }}" | tr '@/' '--' | tr ' ' '-')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          status=0
          {
            echo "=== ${{ matrix.pkg.label }} test-unit ==="
            WORKERS_ARGS=()
            if [ "${{ matrix.pkg.workers }}" = "2" ]; then
              WORKERS_ARGS=(--fileParallelism --maxWorkers=2)
            fi
            if [ "${{ matrix.pkg.queryCli }}" = "true" ]; then
              pnpm --fail-if-no-match -F @teable/cli build &&
                pnpm --fail-if-no-match -F @teable/cli typecheck &&
                node --test packages/ai-tools-cli/test/query-commands.test.js
            elif [ "${{ matrix.pkg.gate }}" = "v2_data_query" ]; then
              pnpm --fail-if-no-match -F "${{ matrix.pkg.name }}" typecheck &&
                if [ "${{ matrix.pkg.queryTests }}" != "true" ] || [ "$DATA_QUERY_PRESENT" = "true" ]; then
                  pnpm --fail-if-no-match -F "${{ matrix.pkg.name }}" test-unit
                else
                  echo "query protocol specs absent before feature — typecheck completed"
                fi
            elif [ -n "${{ matrix.pkg.shard }}" ]; then
              pnpm -F "${{ matrix.pkg.name }}" test-unit --shard=${{ matrix.pkg.shard }} "${WORKERS_ARGS[@]}"
            else
              pnpm -F "${{ matrix.pkg.name }}" --if-present test-unit "${WORKERS_ARGS[@]}"
            fi
          } >> "$LOG_DIR/v2-unit-$SLUG.log" 2>&1 || status=$?
          echo "v2 unit exit=$status ($(wc -l < "$LOG_DIR/v2-unit-$SLUG.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          SLUG="${SLUG:-$(echo "${{ matrix.pkg.label }}" | tr '@/' '--' | tr ' ' '-')}"
          [ -f "$LOG_DIR/v2-unit-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/v2-unit-$SLUG.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/v2-unit-$SLUG.log" -R "$LOGS_REPO" --clobber
          # Failure marker — the conclude step tails only marked logs instead
          # of guessing from log text (which false-positived on ERROR noise).
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/v2-unit-$SLUG.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/v2-unit-$SLUG.failed" -R "$LOGS_REPO" --clobber
          fi

  host-query:
    needs: [unit-deps]
    if: >-
      !cancelled() && needs.unit-deps.result == 'success' &&
      needs.unit-deps.outputs.data-query-present == 'true' &&
      (contains(fromJson(github.event.client_payload.filters), 'v2_shared') ||
       contains(fromJson(github.event.client_payload.filters), 'v2_data_query'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition:
          - label: CLOUD
            script: test-e2e
          - label: EE
            script: test-e2e:ee
    name: V2 Inline Query Host (${{ matrix.edition.label }})
    timeout-minutes: 25
    env:
      CI: 1
      TEABLE_TSDOWN_DISABLE_DTS: '1'
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      PRISMA_DATABASE_URL: 'postgresql://teable:teable@127.0.0.1:25432/e2e_test_teable?schema=public&statement_cache_size=0&connection_limit=20'
      BACKEND_CACHE_REDIS_URI: 'redis://127.0.0.1:6379/0'
      VITEST_MAX_THREADS: 2
      VITEST_MIN_THREADS: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: e2e_test_teable
          POSTGRES_USER: teable
          POSTGRES_PASSWORD: teable
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U teable -d e2e_test_teable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Run focused host checks in fresh processes
        id: host-query-tests
        run: |
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/v2-host-query-${{ matrix.edition.label }}.log"
          set +e
          (
            set -euo pipefail
            test -f enterprise/backend-ee/test/data-query.e2e-spec-edition.ts
            test -f enterprise/backend-ee/test/data-query-disabled.e2e-spec-edition.ts
            (cd packages/db-main-prisma && pnpm prisma-generate)
            (cd community/packages/db-data-prisma && pnpm prisma-generate)
            (cd packages/db-main-prisma && pnpm prisma-migrate deploy --schema ./prisma/postgres/schema.prisma)
            (cd community/packages/db-data-prisma && pnpm prisma-migrate deploy --schema ./prisma/schema.prisma)
            if [ "${{ matrix.edition.label }}" = "CLOUD" ]; then
              echo "=== inline query: PGlite and PostgreSQL executor ==="
              TEABLE_V2_RUN_PG_INTEGRATION=1 pnpm --fail-if-no-match -F @teable/v2-adapter-table-repository-postgres exec vitest run src/record/data-query/PostgresDataQueryExecutor.pglite.spec.ts src/record/data-query/PostgresDataQueryExecutor.pg.integration.spec.ts --passWithNoTests=false
              echo "=== inline query: failure trace privacy and host boundaries ==="
              TEABLE_V2_RUN_PG_INTEGRATION=1 pnpm --fail-if-no-match -F @teable/backend exec vitest run src/tracing-pg.integration.spec.ts src/tracing-db-context.spec.ts src/configs/env.validation.schema.spec.ts src/filter/global-exception.filter.spec.ts --passWithNoTests=false
            fi
            echo "=== ${{ matrix.edition.script }}: inline query enabled ==="
            V2_DATA_QUERY_ENABLED=1 pnpm --fail-if-no-match -F @teable/backend-ee "${{ matrix.edition.script }}" test/data-query.e2e-spec-edition.ts --passWithNoTests=false
            echo "=== ${{ matrix.edition.script }}: inline query disabled ==="
            V2_DATA_QUERY_ENABLED=false pnpm --fail-if-no-match -F @teable/backend-ee "${{ matrix.edition.script }}" test/data-query-disabled.e2e-spec-edition.ts --passWithNoTests=false
          ) >> "$LOG_FILE" 2>&1
          status=$?
          set -e
          echo "inline query host ${{ matrix.edition.label }} exit=$status ($(wc -l < "$LOG_FILE") log lines)"
          exit "$status"

      - name: Ship host check log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/v2-host-query-${{ matrix.edition.label }}.log"
          [ -f "$LOG_FILE" ] || echo "(host checks failed before their first logged step)" > "$LOG_FILE"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_FILE" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_FILE.failed"
            gh release upload "$LOG_TAG" "$LOG_FILE.failed" -R "$LOGS_REPO" --clobber
          fi

  e2e:
    needs: [e2e-deps]
    if: >-
      !cancelled() && needs.e2e-deps.result == 'success'
    runs-on: ubuntu-latest
    name: V2 E2E Tests (Shard ${{ matrix.shard }})
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 1/8
          - 2/8
          - 3/8
          - 4/8
          - 5/8
          - 6/8
          - 7/8
          - 8/8
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Restore workspace dependencies
        uses: ./.github/actions/workspace-deps-download
        with:
          name: v2-e2e-deps-${{ github.run_id }}

      - name: 🧪 Run E2E tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p "$LOG_DIR"
          SLUG=$(echo "${{ matrix.shard }}" | tr '/' '-')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          status=0
          {
            echo "=== v2 e2e shard ${{ matrix.shard }} ==="
            pnpm -C community/packages/v2/e2e exec vitest run --silent --bail 1 --exclude src/field-conversion-deadlock.e2e.spec.ts --exclude src/computed-json-formula-cascade.e2e.spec.ts --exclude src/importMemory.e2e.spec.ts --exclude src/list-records-cursor.e2e.spec.ts --exclude src/computed-convergence.e2e.spec.ts --exclude src/computed-convergence.property.e2e.spec.ts --exclude src/computed-insert-sibling-propagation.e2e.spec.ts --exclude src/computed-outbox-recovery.e2e.spec.ts --shard=${{ matrix.shard }} --fileParallelism --maxWorkers=2
          } >> "$LOG_DIR/v2-e2e-$SLUG.log" 2>&1 || status=$?
          echo "v2 e2e exit=$status ($(wc -l < "$LOG_DIR/v2-e2e-$SLUG.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          SLUG="${SLUG:-$(echo "${{ matrix.shard }}" | tr '/' '-')}"
          [ -f "$LOG_DIR/v2-e2e-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/v2-e2e-$SLUG.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/v2-e2e-$SLUG.log" -R "$LOGS_REPO" --clobber
          # Failure marker — the conclude step tails only marked logs instead
          # of guessing from log text (which false-positived on ERROR noise).
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/v2-e2e-$SLUG.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/v2-e2e-$SLUG.failed" -R "$LOGS_REPO" --clobber
          fi

  e2e-sensitive:
    needs: [e2e-deps]
    if: >-
      !cancelled() && needs.e2e-deps.result == 'success'
    runs-on: ubuntu-latest
    name: V2 E2E Tests (Sensitive)
    timeout-minutes: 15
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Restore workspace dependencies
        uses: ./.github/actions/workspace-deps-download
        with:
          name: v2-e2e-deps-${{ github.run_id }}

      - name: 🧪 Run memory and latency-sensitive regressions
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== v2 e2e memory and latency-sensitive regressions ==="
            pnpm -C community/packages/v2/e2e exec vitest run --silent --bail 1 src/importMemory.e2e.spec.ts src/list-records-cursor.e2e.spec.ts
          } >> "$LOG_DIR/v2-e2e-sensitive.log" 2>&1 || status=$?
          echo "v2 e2e sensitive exit=$status ($(wc -l < "$LOG_DIR/v2-e2e-sensitive.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/v2-e2e-sensitive.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/v2-e2e-sensitive.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/v2-e2e-sensitive.log" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
