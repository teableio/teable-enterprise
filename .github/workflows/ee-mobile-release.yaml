# Source of truth: teableio/teable-ee .github/enterprise-ci/ee-mobile-release.yaml (synced to
# teable-enterprise by sync-ci-to-enterprise.yml). Builds the mobile app from a teable-ee
# commit and ships it to the internal testers: iOS to TestFlight from a hosted macOS runner
# (free on this public repo), Android to Google Play's internal track from Linux. iOS signing
# is cloud-managed through the App Store Connect API key; Android signs with the Play upload
# key held in secrets.
#
# Public logs carry exit codes and error lines only; the private repository's content stays
# in files on the runner. The last job posts the outcome (success, failure or cancelled) as a
# card to the R&D Feishu group, the same bot the Web release notifications use.
name: EE Mobile Release

on:
  workflow_dispatch:
    inputs:
      ee_sha:
        description: 'teable-ee commit to build'
        required: true
        type: string
      platforms:
        description: 'ios, android or both'
        required: false
        type: choice
        default: both
        options: [both, ios, android]
      build_number:
        description: 'Build number / versionCode (default: the commit count)'
        required: false
        type: string
      upload:
        # Off by default: a branch build would take a number ahead of develop's, and Play
        # refuses to go back down. The develop trigger passes upload=true itself.
        description: 'Upload to TestFlight / Play'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [ee-mobile-release]

concurrency:
  group: ee-mobile-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  EE_SHA: ${{ github.event.inputs.ee_sha || github.event.client_payload.ee_sha }}
  PLATFORMS: ${{ github.event.inputs.platforms || github.event.client_payload.platforms || 'both' }}
  BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number || github.event.client_payload.build_number }}
  EXPO_PUBLIC_SERVER_URL: https://app.teable.ai

jobs:
  ios:
    name: iOS · TestFlight
    if: ${{ contains(fromJSON('["both","ios"]'), github.event.inputs.platforms || github.event.client_payload.platforms || 'both') }}
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      subject: ${{ steps.meta.outputs.subject }}
      author: ${{ steps.meta.outputs.author }}
      upload: ${{ steps.meta.outputs.upload }}
      started: ${{ steps.meta.outputs.started }}
    steps:
      - name: Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.EE_SHA }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            enterprise/mobile/pnpm-lock.yaml

      - name: Build number
        id: meta
        env:
          # Read as strings: a boolean false would otherwise vanish in an && / || expression.
          UPLOAD_DISPATCH: ${{ format('{0}', inputs.upload) }}
          UPLOAD_PAYLOAD: ${{ format('{0}', github.event.client_payload.upload) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only this commit's history is fetched (a branch listing would show the private
          # repository's branch names in this public log).
          git fetch --quiet --unshallow --no-tags origin "$EE_SHA" 2>/dev/null || git fetch --quiet --no-tags origin "$EE_SHA"
          N="${BUILD_NUMBER_INPUT:-$(git rev-list --count HEAD)}"
          echo "MOBILE_BUILD_NUMBER=$N" >> "$GITHUB_ENV"
          # Upload unless told not to (a manual run may only want the build checked).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then U="$UPLOAD_DISPATCH"; else U="$UPLOAD_PAYLOAD"; fi
          if [ "$U" = "false" ]; then echo "UPLOAD=false" >> "$GITHUB_ENV"; else echo "UPLOAD=true" >> "$GITHUB_ENV"; fi
          echo "build number: $N (teable-ee ${EE_SHA:0:7}), upload: ${U:-true}"
          # For the Feishu card (values go to the card, not to this log).
          {
            echo "build_number=$N"
            echo "upload=${U:-true}"
            echo "version=$(sed -n "s/^ *version: '\([^']*\)'.*/\1/p" enterprise/mobile/app.config.ts | head -1)"
            echo "subject=$(git log -1 --format=%s)"
            echo "author=$(git log -1 --format=%an)"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Install monorepo (shared packages + their dependencies)
        run: >-
          pnpm install --frozen-lockfile
          --filter "@teable/core..." --filter "@teable/openapi..." --filter "@teable/openapi-ee..."
          --filter "@teable/chat-core..." > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }

      - name: Build shared packages
        run: >-
          pnpm -r --filter @teable/formula --filter @teable/core
          --filter @teable/openapi --filter @teable/openapi-ee --filter @teable/chat-core build
          > /tmp/build-packages.log 2>&1 || { tail -30 /tmp/build-packages.log; exit 1; }

      - name: Install mobile app
        run: pnpm -C enterprise/mobile install --frozen-lockfile > /tmp/install-mobile.log 2>&1 || { tail -30 /tmp/install-mobile.log; exit 1; }

      - name: Prebuild the iOS project
        working-directory: enterprise/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install > /tmp/prebuild.log 2>&1 || { tail -40 /tmp/prebuild.log; exit 1; }

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            enterprise/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('enterprise/mobile/ios/Podfile', 'enterprise/mobile/pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Pod install
        working-directory: enterprise/mobile/ios
        run: pod install > /tmp/pod.log 2>&1 || { tail -40 /tmp/pod.log; exit 1; }

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (cloud-managed signing)
        working-directory: enterprise/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Teable.xcworkspace -scheme Teable -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/Teable.xcarchive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            DEVELOPMENT_TEAM=6RGCFV3CTU archive > /tmp/archive.log 2>&1 \
            || { grep -E "error:|error \(|Provisioning|signing" /tmp/archive.log | tail -30; exit 1; }
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" /tmp/archive.log
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Teable.xcarchive/Products/Applications/Teable.app/Info.plist)"

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        working-directory: enterprise/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>6RGCFV3CTU</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Teable.xcarchive -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}" > /tmp/export.log 2>&1 \
            || { grep -E "error" /tmp/export.log | tail -20; exit 1; }
          grep -E "EXPORT (SUCCEEDED|FAILED)|Upload succeeded" /tmp/export.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS build ${MOBILE_BUILD_NUMBER}"
            echo "- teable-ee: \`${EE_SHA}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android · Play internal
    if: ${{ contains(fromJSON('["both","android"]'), github.event.inputs.platforms || github.event.client_payload.platforms || 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      subject: ${{ steps.meta.outputs.subject }}
      author: ${{ steps.meta.outputs.author }}
      upload: ${{ steps.meta.outputs.upload }}
      started: ${{ steps.meta.outputs.started }}
      apk_url: ${{ steps.apk.outputs.url }}
      play: ${{ steps.play.outcome }}
    steps:
      - name: Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.EE_SHA }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            enterprise/mobile/pnpm-lock.yaml

      - name: Build number
        id: meta
        env:
          # Read as strings: a boolean false would otherwise vanish in an && / || expression.
          UPLOAD_DISPATCH: ${{ format('{0}', inputs.upload) }}
          UPLOAD_PAYLOAD: ${{ format('{0}', github.event.client_payload.upload) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only this commit's history is fetched (a branch listing would show the private
          # repository's branch names in this public log).
          git fetch --quiet --unshallow --no-tags origin "$EE_SHA" 2>/dev/null || git fetch --quiet --no-tags origin "$EE_SHA"
          N="${BUILD_NUMBER_INPUT:-$(git rev-list --count HEAD)}"
          echo "MOBILE_BUILD_NUMBER=$N" >> "$GITHUB_ENV"
          # Upload unless told not to (a manual run may only want the build checked).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then U="$UPLOAD_DISPATCH"; else U="$UPLOAD_PAYLOAD"; fi
          if [ "$U" = "false" ]; then echo "UPLOAD=false" >> "$GITHUB_ENV"; else echo "UPLOAD=true" >> "$GITHUB_ENV"; fi
          echo "build number: $N (teable-ee ${EE_SHA:0:7}), upload: ${U:-true}"
          # For the Feishu card (values go to the card, not to this log).
          {
            echo "build_number=$N"
            echo "upload=${U:-true}"
            echo "version=$(sed -n "s/^ *version: '\([^']*\)'.*/\1/p" enterprise/mobile/app.config.ts | head -1)"
            echo "subject=$(git log -1 --format=%s)"
            echo "author=$(git log -1 --format=%an)"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Install monorepo (shared packages + their dependencies)
        run: >-
          pnpm install --frozen-lockfile
          --filter "@teable/core..." --filter "@teable/openapi..." --filter "@teable/openapi-ee..."
          --filter "@teable/chat-core..." > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }

      - name: Build shared packages
        run: >-
          pnpm -r --filter @teable/formula --filter @teable/core
          --filter @teable/openapi --filter @teable/openapi-ee --filter @teable/chat-core build
          > /tmp/build-packages.log 2>&1 || { tail -30 /tmp/build-packages.log; exit 1; }

      - name: Install mobile app
        run: pnpm -C enterprise/mobile install --frozen-lockfile > /tmp/install-mobile.log 2>&1 || { tail -30 /tmp/install-mobile.log; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild the Android project
        working-directory: enterprise/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install > /tmp/prebuild.log 2>&1 || { tail -40 /tmp/prebuild.log; exit 1; }

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.teable/mobile
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.teable/mobile/upload.keystore
          chmod 600 ~/.teable/mobile/upload.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('enterprise/mobile/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the bundle (signed with the upload key)
        working-directory: enterprise/mobile/android
        env:
          MOBILE_UPLOAD_KEYSTORE: /home/runner/.teable/mobile/upload.keystore
          MOBILE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MOBILE_UPLOAD_KEY_ALIAS: upload
          MOBILE_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon -q > /tmp/gradle.log 2>&1 || { grep -E "error|FAILED|What went wrong" -A3 /tmp/gradle.log | tail -40; exit 1; }
          ls -la app/build/outputs/bundle/release/app-release.aab | awk '{print "bundle: "$5" bytes"}'
          ls -la app/build/outputs/apk/release/app-release.apk | awk '{print "apk: "$5" bytes"}'
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "^Owner:" | head -1

      # The APK for hand distribution goes to the private logs repository, never to a public
      # artifact of this repository.
      - name: Keep the APK (teable-ci-logs release)
        id: apk
        working-directory: enterprise/mobile/android/app/build/outputs
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          LOGS_REPO: teableio/teable-ci-logs
        run: |
          TAG="mobile-android-${MOBILE_BUILD_NUMBER}"
          cp apk/release/app-release.apk "Teable-android-${MOBILE_BUILD_NUMBER}.apk"
          cp bundle/release/app-release.aab "Teable-android-${MOBILE_BUILD_NUMBER}.aab"
          gh release create "$TAG" -R "$LOGS_REPO" --title "Teable Android ${MOBILE_BUILD_NUMBER}" \
            --notes "teable-ee ${EE_SHA} · run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>/dev/null || true
          gh release upload "$TAG" "Teable-android-${MOBILE_BUILD_NUMBER}.apk" "Teable-android-${MOBILE_BUILD_NUMBER}.aab" -R "$LOGS_REPO" --clobber
          echo "APK: https://github.com/${LOGS_REPO}/releases/tag/${TAG}"
          echo "url=https://github.com/${LOGS_REPO}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      # Play only accepts a versionCode above the highest one it already has. After a squash
      # merge (or a manual branch build) develop's commit count can sit below that for a few
      # days, and Play rejects the upload: skip it, keep TestFlight and the APK, and say so
      # on the card. develop's count passes the mark on its own.
      - name: Upload to Google Play (internal testing)
        id: play
        if: env.UPLOAD == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.teable.app
          releaseFiles: enterprise/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ env.MOBILE_BUILD_NUMBER }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build ${MOBILE_BUILD_NUMBER}"
            echo "- teable-ee: \`${EE_SHA}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # One card per run to the R&D Feishu group: what shipped where (TestFlight / Play / APK), or
  # which platform failed, with a button to this run. Runs whatever the build jobs did.
  notify:
    name: Feishu
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Card to the R&D group
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number || needs.android.outputs.build_number }}
          VERSION: ${{ needs.ios.outputs.version || needs.android.outputs.version }}
          SUBJECT: ${{ needs.ios.outputs.subject || needs.android.outputs.subject }}
          AUTHOR: ${{ needs.ios.outputs.author || needs.android.outputs.author }}
          UPLOAD: ${{ needs.ios.outputs.upload || needs.android.outputs.upload }}
          IOS_STARTED: ${{ needs.ios.outputs.started }}
          ANDROID_STARTED: ${{ needs.android.outputs.started }}
          APK_URL: ${{ needs.android.outputs.apk_url }}
          PLAY: ${{ needs.android.outputs.play }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && format('手动 · {0}', github.actor) || 'develop 合并' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTFLIGHT_URL: https://appstoreconnect.apple.com/apps/6810557646/testflight/ios
        run: |
          platform() {
            # $1 result, $2 label when uploaded, $3 label when built only
            case "$1" in
              success) if [ "$UPLOAD" = "false" ]; then echo "✅ $3"; else echo "✅ $2"; fi ;;
              failure) echo "❌ 失败" ;;
              cancelled) echo "⏹ 取消" ;;
              *) echo "— 未构建" ;;
            esac
          }
          IOS_LABEL=$(platform "$IOS" "TestFlight" "已构建（未上传）")
          ANDROID_LABEL=$(platform "$ANDROID" "Play 内测 + APK" "APK（未上传 Play）")
          # A rejected Play upload does not fail the job; the card has to say it anyway.
          if [ "$ANDROID" = "success" ] && [ "$UPLOAD" != "false" ] && [ "$PLAY" = "failure" ]; then
            ANDROID_LABEL="⚠️ 仅 APK（Play 未接受，版本号需高于线上）"
          fi
          if [ -n "$BUILD_NUMBER" ]; then VER="${VERSION:-?} (${BUILD_NUMBER})"; else VER="${EE_SHA:0:7}"; fi
          if [ "$IOS" = "failure" ] || [ "$ANDROID" = "failure" ]; then
            TITLE="移动端构建失败! ${VER}"; COLOR="red"
          elif [ "$IOS" = "cancelled" ] || [ "$ANDROID" = "cancelled" ]; then
            TITLE="移动端构建取消 ${VER}"; COLOR="grey"
          elif [ "$IOS" = "success" ] || [ "$ANDROID" = "success" ]; then
            if [ "$UPLOAD" = "false" ]; then TITLE="移动端构建成功（未上传） ${VER}"; else TITLE="移动端构建成功! ${VER}"; fi
            COLOR="green"
          else
            TITLE="移动端构建状态未知 ${VER}"; COLOR="grey"
          fi
          START="${IOS_STARTED:-$ANDROID_STARTED}"
          if [ -n "$ANDROID_STARTED" ] && [ -n "$IOS_STARTED" ] && [ "$ANDROID_STARTED" -lt "$IOS_STARTED" ]; then START="$ANDROID_STARTED"; fi
          MINUTES="?"; if [ -n "$START" ]; then MINUTES=$(( ($(date +%s) - START + 59) / 60 )); fi
          INFO="**iOS**: ${IOS_LABEL} | **Android**: ${ANDROID_LABEL}"
          META="**build**: ${BUILD_NUMBER:-?} | **触发人**: ${AUTHOR:-?} | **用时**: ${MINUTES}分钟 | **来源**: ${SOURCE} | **提交**: ${EE_SHA:0:7}"
          button() { jq -n --arg label "$1" --arg url "$2" --arg type "$3" \
            '{tag:"button",text:{tag:"plain_text",content:$label},type:$type,behaviors:[{type:"open_url",default_url:$url}]}'; }
          BUTTONS="[$(button "查看CI" "$RUN_URL" primary)"
          if [ "$IOS" = "success" ] && [ "$UPLOAD" != "false" ]; then BUTTONS="$BUTTONS,$(button "TestFlight" "$TESTFLIGHT_URL" default)"; fi
          if [ -n "$APK_URL" ]; then BUTTONS="$BUTTONS,$(button "APK 下载" "$APK_URL" default)"; fi
          BUTTONS="$BUTTONS]"
          jq -n --arg title "$TITLE" --arg color "$COLOR" --arg info "$INFO" --arg meta "$META" --arg subject "$SUBJECT" \
            --argjson buttons "$BUTTONS" '
            def md: {tag:"div", text:{tag:"lark_md", content:.}};
            {msg_type:"interactive", card:{schema:"2.0",
              config:{enable_forward:true, update_multi:true, width_mode:"default"},
              header:{title:{tag:"plain_text", content:$title}, template:$color},
              body:{direction:"vertical", padding:"12px", vertical_spacing:"8px",
                elements: ([($info|md), ($meta|md)] + (if $subject == "" then [] else [($subject|md)] end) + [
                  {tag:"column_set", flex_mode:"none", background_style:"default", horizontal_spacing:"8px",
                   columns: ($buttons | map({tag:"column", width:"auto", elements:[.]}))}])}}}' > /tmp/card.json
          echo "card: ${TITLE}"
          if [ -z "$WEBHOOK_URL" ]; then echo "::warning::FEISHU_WEBHOOK_URL is not set; notification skipped"; exit 0; fi
          HTTP=$(curl -sS -o /tmp/feishu.json -w '%{http_code}' -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' --data @/tmp/card.json)
          echo "feishu: HTTP ${HTTP} $(jq -c '{code, msg}' /tmp/feishu.json 2>/dev/null)"
          [ "$HTTP" = "200" ] && [ "$(jq -r '.code' /tmp/feishu.json 2>/dev/null)" = "0" ]
