name: Isolated iPad WDA signing
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Private signing source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Mint checkout token
        id: ee-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.ee-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and sign WDA privately
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash .github/wda-signing/build.sh > "$RUNNER_TEMP/wda-build.log" 2>&1
      - name: Mint logs token
        id: logs-token
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ci-logs
          permission-contents: write
      - name: Store result in private artifact repository
        if: always()
        env:
          GH_TOKEN: ${{ steps.logs-token.outputs.token }}
        run: |
          tag="wda-ipad-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          files=("$RUNNER_TEMP/wda-build.log")
          for file in WebDriverAgentRunner-signed.zip wda-result.txt; do
            if [ -f "$RUNNER_TEMP/$file" ]; then files+=("$RUNNER_TEMP/$file"); fi
          done
          gh release create "$tag" "${files[@]}" -R teableio/teable-ci-logs --draft --title 'iPad WDA signing' --notes 'Isolated QA driver signing result.' > /dev/null 2>&1
      - name: Remove ephemeral signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/wda-signing/signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/wda-signing/AuthKey.p8" "$RUNNER_TEMP/wda-signing/cert.p12"
