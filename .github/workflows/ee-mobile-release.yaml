# Source of truth: teableio/teable-ee .github/enterprise-ci/ee-mobile-release.yaml (synced to
# teable-enterprise by sync-ci-to-enterprise.yml). Builds the mobile app from a teable-ee
# commit and uploads it: iOS to App Store Connect from a hosted macOS runner
# (free on this public repo), Android to Google Play's internal track from Linux. iOS signing
# is cloud-managed through the App Store Connect API key; Android signs with the Play upload
# key held in secrets.
#
# Public logs carry exit codes and error lines only; the private repository's content stays
# in files on the runner. The first job reserves a Mobile Releases row and its build number;
# the last job updates its outcome (success, failure, cancelled, or superseded by a newer run).
# A Teable automation there is what posts the R&D Feishu card, the same way Web releases are
# announced.
name: EE Mobile Release

on:
  workflow_dispatch:
    inputs:
      ee_sha:
        description: 'teable-ee commit to build'
        required: true
        type: string
      platforms:
        description: 'ios, android or both'
        required: false
        type: choice
        default: both
        options: [both, ios, android]
      upload:
        # Off by default for validation. Only commits on develop may upload. On, the run joins
        # the release lane (see concurrency) and cancels a release build in flight.
        description: 'Upload to App Store Connect / Play (does not submit for review; cancels a release build in flight)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [ee-mobile-release]

# Every run that may upload (develop merges, and manual runs with upload on) shares one lane,
# and the newest run in it cancels the build in flight rather than queueing behind it: a merge
# dispatches develop's head, which already contains the commit being built, so finishing that
# build would only ship a stale commit and hold the current one back half an hour. Order still
# holds: one run at a time allocates, builds and uploads, so a faster newer build can never
# upload ahead of an older one, which is cancelled before its successor starts. A rerun joins
# as the newest run and cancels whatever is building. A manual check (upload off) never
# uploads, so it gets a lane of its own and neither interrupts a release nor is interrupted.
concurrency:
  group: ${{ (github.event_name == 'repository_dispatch' || format('{0}', inputs.upload) == 'true') && 'ee-mobile-release' || format('ee-mobile-release-check-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EE_SHA: ${{ github.event.inputs.ee_sha || github.event.client_payload.ee_sha }}
  PLATFORMS: ${{ github.event.inputs.platforms || github.event.client_payload.platforms || 'both' }}
  MOBILE_TABLE: tblheQqpvzF9MpTSYqO
  EXPO_PUBLIC_SERVER_URL: https://app.teable.ai

jobs:
  prepare:
    name: Reserve build number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      build_number: ${{ steps.allocate.outputs.build_number }}
      record_id: ${{ steps.allocate.outputs.record_id }}
      attempt: ${{ steps.allocate.outputs.attempt }}
      started: ${{ steps.allocate.outputs.started }}
    steps:
      - name: Validate request
        env:
          LEGACY_BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
        run: |
          case "$PLATFORMS" in ios|android|both) ;; *) exit 1 ;; esac
          [ -z "$LEGACY_BUILD_NUMBER" ] || { echo 'Build number overrides are no longer supported'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.EE_SHA }}
          fetch-depth: 1
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Allocate from Teable
        id: allocate
        env:
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && '手动' || 'develop 合并' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const table = `https://app.teable.ai/api/table/${process.env.MOBILE_TABLE}`;
          const allocated = 'fldvxneaC4umnduDmDT';
          const actual = 'fldWgSjUszaamyu1qiu';
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          async function api(path, method = 'GET', body) {
            const res = await fetch(`${table}${path}`, {
              method,
              headers: { Authorization: `Bearer ${process.env.TEABLE_API_TOKEN}`, 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            if (!res.ok) throw new Error(`Teable allocation HTTP ${res.status}`);
            return res.json();
          }
          async function maximum(field) {
            const query = new URLSearchParams({
              fieldKeyType: 'id', take: '1', projection: field,
              orderBy: JSON.stringify([{ fieldId: field, order: 'desc' }]),
              filter: JSON.stringify({ conjunction: 'and', filterSet: [{ fieldId: field, operator: 'isNotEmpty', value: null }] }),
            });
            const data = await api(`/record?${query}`);
            if (!Array.isArray(data.records)) throw new Error('Invalid Teable record response');
            const value = data.records[0]?.fields[field] ?? 0;
            if (!Number.isSafeInteger(value) || value < 0) throw new Error('Invalid previous build number');
            return value;
          }
          (async () => {
            if (!process.env.TEABLE_API_TOKEN) throw new Error('Missing TEABLE_API_TOKEN');
            // Changing/resetting the remote formula must never silently move releases backwards.
            const field = await api(`/field/${allocated}`);
            if (field.type !== 'formula' || field.options?.expression !== 'AUTO_NUMBER() + 14332') {
              throw new Error('Build allocation formula changed; reconcile the sequence before building');
            }
            const previous = Math.max(14366, await maximum(actual), await maximum(allocated));
            // One POST only: an ambiguous network failure may consume a number, never reuse it.
            const created = await api('/record', 'POST', {
              fieldKeyType: 'id', typecast: true,
              records: [{ fields: {
                fldgBV1XkZ6l5d6r9W6: `Building ${process.env.GITHUB_RUN_ID}/${process.env.GITHUB_RUN_ATTEMPT}`,
                fld0Mt4fh2adcyAb1o3: 'Building',
                fldVQzDCz4j5nnxts17: process.env.RELEASE_SHA,
                fldma4dHn1odiPU3wyg: process.env.RUN_URL,
                fldOQr5i2AzUzwPOge1: process.env.SOURCE,
                ...(process.env.PLATFORMS !== 'android' ? {
                  fldckrvAHfy4HfffRpb: 'App Store',
                } : {}),
              } }],
            });
            let row = created.records?.[0];
            if (!row || !/^rec[a-zA-Z0-9]+$/.test(row.id)) throw new Error('Allocation returned no record ID');
            // Allow computed values to become readable without creating another allocation.
            for (let attempt = 0; row.fields?.[allocated] == null && attempt < 5; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 1000));
              row = await api(`/record/${row.id}?fieldKeyType=id`);
            }
            const number = row.fields?.[allocated];
            if (!Number.isSafeInteger(number) || number <= previous || number > 2100000000) {
              throw new Error('Allocated build number is missing, stale or out of range; stop without fallback');
            }
            await api(`/record/${row.id}`, 'PATCH', {
              fieldKeyType: 'id', record: { fields: { [actual]: number } },
            });
            output('record_id', row.id);
            output('build_number', number);
            output('attempt', process.env.GITHUB_RUN_ATTEMPT);
            output('started', Math.floor(Date.now() / 1000));
            console.log(`Reserved build ${number}`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

  ios:
    needs: prepare
    env:
      EE_SHA: ${{ needs.prepare.outputs.sha }}
      MOBILE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    name: iOS · App Store Connect
    if: ${{ contains(fromJSON('["both","ios"]'), github.event.inputs.platforms || github.event.client_payload.platforms || 'both') }}
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      subject: ${{ steps.meta.outputs.subject }}
      author: ${{ steps.meta.outputs.author }}
      upload: ${{ steps.meta.outputs.upload }}
      started: ${{ steps.meta.outputs.started }}
    steps:
      - name: Require a fresh allocation for this attempt
        env:
          ALLOCATED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          [ "$ALLOCATED_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] || { echo 'Use Re-run all jobs or Run workflow to reserve a fresh build number'; exit 1; }
      - name: Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.EE_SHA }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The repository's Node (`use-node-version` in .npmrc): the PR gate tests on it.
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build number
        id: meta
        env:
          # Read as strings: a boolean false would otherwise vanish in an && / || expression.
          UPLOAD_DISPATCH: ${{ format('{0}', inputs.upload) }}
          UPLOAD_PAYLOAD: ${{ format('{0}', github.event.client_payload.upload) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only this commit's history is fetched (a branch listing would show the private
          # repository's branch names in this public log); develop is named explicitly for
          # the ancestry test below, which lists nothing either.
          git fetch --quiet --unshallow --no-tags origin "$EE_SHA" 2>/dev/null || git fetch --quiet --no-tags origin "$EE_SHA"
          DEVELOP=
          if git fetch --quiet --no-tags origin develop 2>/dev/null; then DEVELOP=$(git rev-parse FETCH_HEAD); fi
          if [ -n "$DEVELOP" ] && git merge-base --is-ancestor HEAD "$DEVELOP"; then ON_DEVELOP=true; else ON_DEVELOP=false; fi
          N="$MOBILE_BUILD_NUMBER"
          # Upload unless told not to (a manual run may only want the build checked), and
          # never from a commit that is not on develop: merge it first.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then U="$UPLOAD_DISPATCH"; else U="$UPLOAD_PAYLOAD"; fi
          if [ "$ON_DEVELOP" = false ]; then U=false; fi
          if [ "$U" = "false" ]; then echo "UPLOAD=false" >> "$GITHUB_ENV"; else echo "UPLOAD=true" >> "$GITHUB_ENV"; fi
          echo "build number: $N (teable-ee ${EE_SHA:0:7}), on develop: $ON_DEVELOP, upload: ${U:-true}"
          # For the Teable row the last job writes (values go to the row, not to this log).
          {
            echo "build_number=$N"
            echo "upload=${U:-true}"
            echo "version=$(sed -n "s/^ *version: '\([^']*\)'.*/\1/p" enterprise/mobile/app.config.ts | head -1)"
            echo "subject=$(git log -1 --format=%s)"
            echo "author=$(git log -1 --format=%an)"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Install the app and the packages it depends on
        run: >-
          pnpm install --frozen-lockfile --filter "@teable/mobile..."
          > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }

      - name: Build shared packages
        run: >-
          pnpm -r --filter @teable/formula --filter @teable/core
          --filter @teable/openapi --filter @teable/openapi-ee --filter @teable/chat-core build
          > /tmp/build-packages.log 2>&1 || { tail -30 /tmp/build-packages.log; exit 1; }

      - name: Prebuild the iOS project
        working-directory: enterprise/mobile
        env:
          CI: '1'
          # The org and project slugs are defaulted in app.config.ts; only the token is a
          # secret. Without it the plugin writes no upload credentials and the build carries
          # on, shipping unsymbolicated crash reports.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --platform ios --no-install > /tmp/prebuild.log 2>&1 || { tail -40 /tmp/prebuild.log; exit 1; }

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            enterprise/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('enterprise/mobile/ios/Podfile', 'pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Pod install
        working-directory: enterprise/mobile/ios
        run: pod install > /tmp/pod.log 2>&1 || { tail -40 /tmp/pod.log; exit 1; }

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Signing identity
        # A hosted runner starts with an empty keychain, so -allowProvisioningUpdates asked
        # App Store Connect for a fresh Apple Development certificate on every archive. Ten
        # runs filled the account's pool and the eleventh failed with "your account has
        # reached the maximum number of certificates". Import the one certificate we keep
        # (873N4FD8Y6, expires 2027-09-15) instead: Xcode finds a valid identity and only
        # provisioning profiles, which are not capped, are created from here on.
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign blocks on a UI prompt for the key that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[" ]//g')
          security default-keychain -s "$KEYCHAIN"
          # The archive cannot sign without one, and the failure it gives is indirect.
          security find-identity -v -p codesigning | grep -q "Apple Development" \
            || { echo "no Apple Development identity in the keychain"; exit 1; }

      - name: Archive (cloud-managed signing)
        working-directory: enterprise/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Teable.xcworkspace -scheme Teable -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/Teable.xcarchive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            DEVELOPMENT_TEAM=6RGCFV3CTU archive > /tmp/archive.log 2>&1 \
            || { grep -E "error:|error \(|Provisioning|signing" /tmp/archive.log | tail -30; exit 1; }
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" /tmp/archive.log
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Teable.xcarchive/Products/Applications/Teable.app/Info.plist)"

      - name: Upload to App Store Connect
        if: env.UPLOAD == 'true'
        working-directory: enterprise/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>6RGCFV3CTU</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Teable.xcarchive -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}" > /tmp/export.log 2>&1 \
            || { grep -E "error" /tmp/export.log | tail -20; exit 1; }
          grep -E "EXPORT (SUCCEEDED|FAILED)|Upload succeeded" /tmp/export.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS build ${MOBILE_BUILD_NUMBER}"
            echo "- distribution: App Store eligible (upload only; no review submission)"
            echo "- teable-ee: \`${EE_SHA}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: prepare
    env:
      EE_SHA: ${{ needs.prepare.outputs.sha }}
      MOBILE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    name: Android · Play internal
    if: ${{ contains(fromJSON('["both","android"]'), github.event.inputs.platforms || github.event.client_payload.platforms || 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      subject: ${{ steps.meta.outputs.subject }}
      author: ${{ steps.meta.outputs.author }}
      upload: ${{ steps.meta.outputs.upload }}
      started: ${{ steps.meta.outputs.started }}
      apk_url: ${{ steps.apk.outputs.url }}
      play: ${{ steps.play.outcome }}
    steps:
      - name: Require a fresh allocation for this attempt
        env:
          ALLOCATED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          [ "$ALLOCATED_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] || { echo 'Use Re-run all jobs or Run workflow to reserve a fresh build number'; exit 1; }
      - name: Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          token: ${{ secrets.PACKAGES_KEY }}
          ref: ${{ env.EE_SHA }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The repository's Node (`use-node-version` in .npmrc): the PR gate tests on it.
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build number
        id: meta
        env:
          # Read as strings: a boolean false would otherwise vanish in an && / || expression.
          UPLOAD_DISPATCH: ${{ format('{0}', inputs.upload) }}
          UPLOAD_PAYLOAD: ${{ format('{0}', github.event.client_payload.upload) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only this commit's history is fetched (a branch listing would show the private
          # repository's branch names in this public log); develop is named explicitly for
          # the ancestry test below, which lists nothing either.
          git fetch --quiet --unshallow --no-tags origin "$EE_SHA" 2>/dev/null || git fetch --quiet --no-tags origin "$EE_SHA"
          DEVELOP=
          if git fetch --quiet --no-tags origin develop 2>/dev/null; then DEVELOP=$(git rev-parse FETCH_HEAD); fi
          if [ -n "$DEVELOP" ] && git merge-base --is-ancestor HEAD "$DEVELOP"; then ON_DEVELOP=true; else ON_DEVELOP=false; fi
          N="$MOBILE_BUILD_NUMBER"
          # Upload unless told not to (a manual run may only want the build checked), and
          # never from a commit that is not on develop: merge it first.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then U="$UPLOAD_DISPATCH"; else U="$UPLOAD_PAYLOAD"; fi
          if [ "$ON_DEVELOP" = false ]; then U=false; fi
          if [ "$U" = "false" ]; then echo "UPLOAD=false" >> "$GITHUB_ENV"; else echo "UPLOAD=true" >> "$GITHUB_ENV"; fi
          echo "build number: $N (teable-ee ${EE_SHA:0:7}), on develop: $ON_DEVELOP, upload: ${U:-true}"
          # For the Teable row the last job writes (values go to the row, not to this log).
          {
            echo "build_number=$N"
            echo "upload=${U:-true}"
            echo "version=$(sed -n "s/^ *version: '\([^']*\)'.*/\1/p" enterprise/mobile/app.config.ts | head -1)"
            echo "subject=$(git log -1 --format=%s)"
            echo "author=$(git log -1 --format=%an)"
            echo "started=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Install the app and the packages it depends on
        run: >-
          pnpm install --frozen-lockfile --filter "@teable/mobile..."
          > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }

      - name: Build shared packages
        run: >-
          pnpm -r --filter @teable/formula --filter @teable/core
          --filter @teable/openapi --filter @teable/openapi-ee --filter @teable/chat-core build
          > /tmp/build-packages.log 2>&1 || { tail -30 /tmp/build-packages.log; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild the Android project
        working-directory: enterprise/mobile
        env:
          CI: '1'
          # The org and project slugs are defaulted in app.config.ts; only the token is a
          # secret. Without it the plugin writes no upload credentials and the build carries
          # on, shipping unsymbolicated crash reports.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --platform android --no-install > /tmp/prebuild.log 2>&1 || { tail -40 /tmp/prebuild.log; exit 1; }

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.teable/mobile
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.teable/mobile/upload.keystore
          chmod 600 ~/.teable/mobile/upload.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the bundle (signed with the upload key)
        working-directory: enterprise/mobile/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MOBILE_UPLOAD_KEYSTORE: /home/runner/.teable/mobile/upload.keystore
          MOBILE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MOBILE_UPLOAD_KEY_ALIAS: upload
          MOBILE_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon -q > /tmp/gradle.log 2>&1 || { grep -E "error|FAILED|What went wrong" -A3 /tmp/gradle.log | tail -40; exit 1; }
          ls -la app/build/outputs/bundle/release/app-release.aab | awk '{print "bundle: "$5" bytes"}'
          ls -la app/build/outputs/apk/release/app-release.apk | awk '{print "apk: "$5" bytes"}'
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "^Owner:" | head -1

      # The APK for hand distribution goes to the private logs repository, never to a public
      # artifact of this repository.
      - name: Keep the APK (teable-ci-logs release)
        id: apk
        working-directory: enterprise/mobile/android/app/build/outputs
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          LOGS_REPO: teableio/teable-ci-logs
        run: |
          TAG="mobile-android-${MOBILE_BUILD_NUMBER}"
          cp apk/release/app-release.apk "Teable-android-${MOBILE_BUILD_NUMBER}.apk"
          cp bundle/release/app-release.aab "Teable-android-${MOBILE_BUILD_NUMBER}.aab"
          gh release create "$TAG" -R "$LOGS_REPO" --title "Teable Android ${MOBILE_BUILD_NUMBER}" \
            --notes "teable-ee ${EE_SHA} · run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>/dev/null || true
          gh release upload "$TAG" "Teable-android-${MOBILE_BUILD_NUMBER}.apk" "Teable-android-${MOBILE_BUILD_NUMBER}.aab" -R "$LOGS_REPO" --clobber
          echo "APK: https://github.com/${LOGS_REPO}/releases/tag/${TAG}"
          echo "url=https://github.com/${LOGS_REPO}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      # Play only accepts a versionCode above the highest one it already has, and only
      # develop gets to claim one (see the build number step). Should it still refuse, keep
      # TestFlight and the APK, and say so on the card rather than failing the release.
      - name: Upload to Google Play (internal testing)
        id: play
        if: env.UPLOAD == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.teable.app
          releaseFiles: enterprise/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ env.MOBILE_BUILD_NUMBER }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build ${MOBILE_BUILD_NUMBER}"
            echo "- teable-ee: \`${EE_SHA}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Update the row reserved by prepare; never create a second row and consume another number. A Teable
  # automation (移动端构建通知（研发群）) turns that row into the Feishu card — the same place the
  # Web release notification is built, so the card lives with the people who read it and not
  # in this file. Nothing here talks to Feishu. Runs whatever the build jobs did.
  track:
    name: Teable
    needs: [prepare, ios, android]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.attempt == format('{0}', github.run_attempt) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This run's jobs, and the note GitHub leaves on the ones a newer run cancelled.
    permissions:
      actions: read
      checks: read
    steps:
      - name: Record the build in Teable
        env:
          GH_TOKEN: ${{ github.token }}
          TEABLE_API_TOKEN: ${{ secrets.TEABLE_API_TOKEN }}
          EE_SHA: ${{ needs.prepare.outputs.sha }}
          ALLOCATION_ROW: ${{ needs.prepare.outputs.record_id }}
          ALLOCATION_STARTED: ${{ needs.prepare.outputs.started }}
          # https://app.teable.ai/base/bserJ2pmgiLHFHfXNwE/table/tblheQqpvzF9MpTSYqO
          MOBILE_TABLE: tblheQqpvzF9MpTSYqO
          RELEASES_TABLE: tblAhVLOxNtvkaF1ii5
          RELEASES_COMMIT_FIELD: fldmRSvaoLTr4uAb6Hh
          RELEASES_MOBILE_FIELD: fldTVCH1y2dtFjA4FRA
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          VERSION: ${{ needs.ios.outputs.version || needs.android.outputs.version }}
          SUBJECT: ${{ needs.ios.outputs.subject || needs.android.outputs.subject }}
          AUTHOR: ${{ needs.ios.outputs.author || needs.android.outputs.author }}
          UPLOAD: ${{ needs.ios.outputs.upload || needs.android.outputs.upload }}
          IOS_STARTED: ${{ needs.ios.outputs.started }}
          ANDROID_STARTED: ${{ needs.android.outputs.started }}
          APK_URL: ${{ needs.android.outputs.apk_url }}
          PLAY: ${{ needs.android.outputs.play }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && '手动' || 'develop 合并' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          api() { curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $TEABLE_API_TOKEN" "$@"; }

          platform() {
            case "$1" in
              success) echo Success ;;
              failure) echo Fail ;;
              cancelled) echo Cancelled ;;
              *) echo Skipped ;;  # the platform was not asked for, or never started
            esac
          }
          case "$PLAY" in
            success) PLAY_STATUS=Uploaded ;;
            # Play refuses a versionCode at or below the highest one it already has; the
            # step carries continue-on-error so TestFlight and the APK still ship.
            failure) PLAY_STATUS=Rejected ;;
            *) PLAY_STATUS=Skipped ;;
          esac
          if [ "$IOS" = failure ] || [ "$ANDROID" = failure ]; then STATUS=Fail
          elif [ "$IOS" = cancelled ] || [ "$ANDROID" = cancelled ]; then STATUS=Cancelled
          elif [ "$IOS" = success ] || [ "$ANDROID" = success ]; then STATUS=Released
          else STATUS=Unknown  # neither platform ran: the card says so rather than staying silent
          fi

          # A newer release run cancels this one (see concurrency), and GitHub says so on each
          # job it stops. The newer run replaces whatever this one was building, and the next
          # card's changelog, which counts from the last Released row, covers this commit too:
          # record it as Superseded, a status the card automation does not post, rather than a
          # cancelled card for every merge that lands while a build is running. A cancel by
          # hand stays Cancelled.
          if [ "$STATUS" = Cancelled ] && [ "$IOS" != success ] && [ "$ANDROID" != success ]; then
            CHECKS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '.jobs[] | select(.conclusion == "cancelled") | .check_run_url | sub("^https://api.github.com/"; "")' || true)
            for check in $CHECKS; do
              NOTES=$(gh api "${check}/annotations" --jq '.[].message' 2>/dev/null || true)
              case "$NOTES" in *'higher priority waiting request'*) STATUS=Superseded; break ;; esac
            done
          fi

          START="${IOS_STARTED:-$ANDROID_STARTED}"
          START="${START:-$ALLOCATION_STARTED}"
          if [ -n "$ANDROID_STARTED" ] && [ -n "$IOS_STARTED" ] && [ "$ANDROID_STARTED" -lt "$IOS_STARTED" ]; then START="$ANDROID_STARTED"; fi
          MINUTES=null; if [ -n "$START" ]; then MINUTES=$(( ($(date +%s) - START + 59) / 60 )); fi

          if [ -n "$BUILD_NUMBER" ]; then BUILD="${VERSION:-?} (${BUILD_NUMBER})"; else BUILD="${EE_SHA:0:7}"; fi
          if [ "$UPLOAD" = "false" ]; then UPLOADED=false; else UPLOADED=true; fi

          # A merge that touched both the app and the server also produced a Web release from
          # this very commit (one row per edition); hang this build off them. A mobile-only
          # merge has none — build-trigger.yml ignores those paths — and the link stays empty.
          FILTER=$(jq -n --arg field "$RELEASES_COMMIT_FIELD" --arg sha "$EE_SHA" \
            '{conjunction:"and",filterSet:[{fieldId:$field,operator:"is",value:$sha}]}')
          RELEASE_IDS=
          FOUND=$(api -G "https://app.teable.ai/api/table/${RELEASES_TABLE}/record" \
            --data-urlencode 'fieldKeyType=dbFieldName' --data-urlencode 'take=10' \
            --data-urlencode 'projection=tag' --data-urlencode "filter=$FILTER" | sed '$d')
          if [ -n "$FOUND" ]; then RELEASE_IDS=$(printf '%s' "$FOUND" | jq -r '.records[]?.id' 2>/dev/null || true); fi
          echo "web releases from this commit: $(printf '%s' "$RELEASE_IDS" | grep -c . || true)"

          payload=$(jq -n \
            --arg build "$BUILD" --arg status "$STATUS" \
            --arg ios "$(platform "$IOS")" --arg android "$(platform "$ANDROID")" \
            --arg play "$PLAY_STATUS" --arg version "$VERSION" \
            --argjson build_number "${BUILD_NUMBER:-null}" \
            --arg commit "$EE_SHA" --arg subject "$SUBJECT" --arg author "$AUTHOR" \
            --argjson duration "$MINUTES" --arg source "$SOURCE" \
            --arg runs "$RUN_URL" --arg apk "$APK_URL" \
            --argjson uploaded "$UPLOADED" \
            '{fieldKeyType:"dbFieldName", typecast:true, records:[{fields:{
                Build:$build, Status:$status, iOS:$ios, Android:$android, Play:$play,
                Version:$version, Build_number:$build_number, Commit:$commit,
                Commit_message:$subject, Author:$author, Build_duration:$duration,
                Source:$source, Runs:$runs, APK:$apk, Uploaded:$uploaded}}]}')

          payload=$(printf '%s' "$payload" | jq '{fieldKeyType, typecast, record: .records[0]}')
          RESPONSE=$(api -X PATCH "https://app.teable.ai/api/table/${MOBILE_TABLE}/record/${ALLOCATION_ROW}" \
            -H 'Content-Type: application/json' -d "$payload")
          HTTP=$(printf '%s' "$RESPONSE" | tail -1)
          echo "teable: HTTP ${HTTP}"
          # A row that never lands means no Feishu card and no trace of this build — fail loudly.
          case "$HTTP" in
            2??) ;;
            *) echo "::error title=Teable tracking failed::${BUILD} (${STATUS}) was not recorded"
               exit 1 ;;
          esac

          # Link from the Releases side, which is many-to-one: assigning it moves the row to
          # this build. Creating the row with a Releases[] array instead is rejected with
          # "already linked to another record" as soon as the commit has been built before,
          # and a rejected create means no row, no Feishu card and a red run for a build that
          # actually succeeded. The card matters more than the link, so a failure here warns.
          ROW="$ALLOCATION_ROW"
          for rid in $RELEASE_IDS; do
            [ -n "$ROW" ] || break
            LINK=$(api -X PATCH "https://app.teable.ai/api/table/${RELEASES_TABLE}/record/${rid}" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg f "$RELEASES_MOBILE_FIELD" --arg row "$ROW" \
                    '{fieldKeyType:"id", record:{fields:{($f):{id:$row}}}}')" | tail -1)
            case "$LINK" in
              2??) echo "linked ${rid} -> ${ROW}" ;;
              *) echo "::warning title=Release link skipped::${rid} -> ${ROW} (HTTP ${LINK})" ;;
            esac
          done
