name: Testing CN Build and Deploy

on:
  repository_dispatch:
    types: [testing-cn-deploy]

permissions: {}

concurrency:
  group: testing-cn-deploy
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      control_sha: ${{ steps.control.outputs.sha }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Pin protected controller
        id: control
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PACKAGES_KEY }}
          script: |
            const {data: branch} = await github.rest.repos.getBranch({owner:'teableio', repo:'teable-ee', branch:'develop'});
            if (!branch.protected || !/^[a-f0-9]{40}$/.test(branch.commit.sha)) throw new Error('Protected controller unavailable');
            core.setOutput('sha', branch.commit.sha);
      - uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ steps.control.outputs.sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate sender and exact source workflow attempt
        id: verify
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          CONTROL_SHA: ${{ steps.control.outputs.sha }}
        run: node control/.github/scripts/testing-cn-deployment.mjs verify-dispatch
      - uses: actions/upload-artifact@v4
        with:
          name: testing-cn-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: request.json
          if-no-files-found: error

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: teable-cloud-preview
            file: Dockerfile
          - image: teable-sandbox-cloud-preview
            file: Dockerfile.sandbox
          - image: teable-sandbox-agent-cloud-preview
            file: Dockerfile.sandbox-agent
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
      - name: Login to Ali container registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ vars.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install --global zx
      - name: Exact SHA image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            registry.cn-shenzhen.aliyuncs.com/teable/${{ matrix.image }}
            ghcr.io/teableio/${{ matrix.image }}
          tags: type=raw,value=${{ needs.verify.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build and push exact SHA image
        env:
          TEABLE_PREVIEW_KIND: cloud
          PREVIEW_PUSH_REGISTRIES: registry.cn-shenzhen.aliyuncs.com
          # The metadata version selects preview BUILD_VERSION even with only a SHA tag.
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          zx scripts/build-image.mjs --file="dockers/teable/${DOCKERFILE}" \
            --build-arg=ENABLE_CSP=false \
            --build-arg=SENTRY_ENABLED=false \
            --build-arg=SENTRY_SOURCEMAPS_UPLOAD=false \
            --build-arg=NEXT_BUILD_ENV_EDITION=CLOUD \
            --tag="${IMAGE_TAGS}" --platform=linux/amd64 --push

  deploy:
    needs: [verify, build-push]
    if: vars.TESTING_CN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: testing-cn-runtime
      cancel-in-progress: false
    outputs:
      state: ${{ steps.freshness.outputs.current == 'false' && 'superseded' || steps.result.outputs.state }}
      deployment_id: ${{ steps.receipt.outputs.deployment_id }}
      environment_url: ${{ steps.result.outputs.environment_url }}
    env:
      NAMESPACE: 38puz7wo
      INSTANCE_NAME: testing-cn
      INSTANCE_DOMAIN: testing-cn
      DISPLAY_NAME: teable-testing-cn
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.verify.outputs.control_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          path: control
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows/templates
      - name: Checkout matching bootstrap scripts and action scopes
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            community/packages/core/src/auth
      - uses: actions/download-artifact@v4
        with:
          name: testing-cn-request-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-kubectl@v4
      - name: Install template parser
        run: npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund yaml@2.9.0
      - name: Render preview resources with external test database
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          MAIN_IMAGE_REPOSITORY: registry.cn-shenzhen.aliyuncs.com/teable/teable-cloud-preview
          SANDBOX_IMAGE_REPOSITORY: registry.cn-shenzhen.aliyuncs.com/teable/teable-sandbox-cloud-preview
          IMAGE_TAG: ${{ needs.verify.outputs.source_sha }}
          ENABLE_TRACING: "true"
          PREVIEW_CONFIG_SOURCE: ${{ secrets.PREVIEW_CONFIG_SOURCE }}
          PREVIEW_PRESET_ENV_DEFAULTS: |
            SANDBOX_OPENSANDBOX_IMAGE=registry.cn-shenzhen.aliyuncs.com/teable/teable-sandbox-agent-cloud-preview
            BACKEND_RECORD_HISTORY_COLD_DISABLED=false
            ENABLE_CANARY_FEATURE=true
            MAX_SEARCH_FIELD_COUNT=20
            NEXT_BUILD_ENV_EDITION=CLOUD
            V2_TABLE_QUERY_OPS_SEARCH_ACCESS_PATH_RUNTIME=auto
            V2_TABLE_QUERY_OPS_TASK_WORKER_ENABLED=false
          PREVIEW_PRESET_ENV_VARS: ${{ vars.PREVIEW_PRESET_ENV_VARS }}
          PREVIEW_PRESET_ENV: ${{ secrets.PREVIEW_PRESET_ENV }}
          TESTING_CN_DATABASE_URL: ${{ secrets.TESTING_CN_DATABASE_URL }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/testing-cn-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          if [ -z "$KUBE_CONFIG" ] || [ -z "$PREVIEW_CONFIG_SOURCE" ] || [ -z "$TESTING_CN_DATABASE_URL" ]; then
            echo '::error::Missing KUBE_CONFIG, PREVIEW_CONFIG_SOURCE or TESTING_CN_DATABASE_URL'
            exit 1
          fi
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$KUBECONFIG"
          kubectl config set-context --current --namespace=ns-38puz7wo >/dev/null
          node control/.github/scripts/render-testing-cn.mjs "$RUNNER_TEMP/deploy.yaml"
      - name: Skip obsolete source requests before mutation
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: node control/.github/scripts/testing-cn-deployment.mjs check-current request.json
      - name: Record deployment in private source repository
        if: steps.freshness.outputs.current == 'true'
        id: receipt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PACKAGES_KEY }}
          script: |
            const {request} = JSON.parse(require('node:fs').readFileSync('request.json', 'utf8'));
            const repo = {owner:'teableio', repo:'teable-ee'};
            const response = await github.rest.repos.createDeployment({
              ...repo, ref:request.source_sha, task:'deploy', environment:'testing-cn',
              auto_merge:false, required_contexts:[], transient_environment:false, production_environment:false,
              payload:{...request, build_run_id:Number(context.runId), build_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT)},
            });
            if (response.status !== 201 || !Number.isSafeInteger(response.data.id)) throw new Error('Deployment receipt not created');
            core.setOutput('deployment_id', response.data.id);
            if (response.data.sha !== request.source_sha) throw new Error('Deployment SHA mismatch');
            await github.rest.repos.createDeploymentStatus({
              ...repo, deployment_id:response.data.id, state:'in_progress', auto_inactive:false,
              log_url:`https://github.com/teableio/teable-ee/actions/runs/${request.source_run_id}/attempts/${request.source_run_attempt}`,
            });
      - name: Apply fixed preview resources
        if: steps.freshness.outputs.current == 'true'
        run: |
          # API errors may echo Secret contents; keep diagnostics on the runner only.
          if ! kubectl --namespace=ns-38puz7wo apply -f "$RUNNER_TEMP/deploy.yaml" >"$RUNNER_TEMP/testing-cn-apply.log" 2>&1; then
            echo '::error::Testing CN apply failed; inspect the fixed resources through authorized cluster access'
            exit 1
          fi
      - name: Wait for preview rollouts and health
        if: steps.freshness.outputs.current == 'true'
        run: |
          kubectl --namespace=ns-38puz7wo rollout status deployment/teable-testing-cn-sandbox --timeout=300s
          kubectl --namespace=ns-38puz7wo rollout status deployment/teable-testing-cn --timeout=300s
          kubectl --namespace=ns-38puz7wo rollout status deployment/teable-testing-cn-jaeger --timeout=300s
          kubectl --namespace=ns-38puz7wo exec deployment/teable-testing-cn -- curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 5 --retry-connrefused http://localhost:3000/health
          curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 5 --retry-connrefused https://testing-cn.sealoshzh.site/health
      - name: Bootstrap preview admin without publishing credentials
        if: steps.freshness.outputs.current == 'true'
        run: |
          umask 077
          if ! GITHUB_OUTPUT="$RUNNER_TEMP/testing-cn-admin-output" bash source/.github/scripts/preview-bootstrap-admin.sh >"$RUNNER_TEMP/testing-cn-admin.log" 2>&1; then
            echo '::error::Testing CN admin bootstrap failed; credentials and diagnostics were not published'
            exit 1
          fi
          echo 'Preview admin bootstrap completed; credentials were not published'
      - name: Finalize private deployment receipt
        if: always() && steps.receipt.outputs.deployment_id != ''
        id: result
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.receipt.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.PACKAGES_KEY }}
          script: |
            const {request} = JSON.parse(require('node:fs').readFileSync('request.json', 'utf8'));
            const state = process.env.JOB_STATUS === 'success' ? 'success' : process.env.JOB_STATUS === 'cancelled' ? 'error' : 'failure';
            const environment_url = 'https://testing-cn.sealoshzh.site';
            await github.rest.repos.createDeploymentStatus({
              owner:'teableio', repo:'teable-ee', deployment_id:Number(process.env.DEPLOYMENT_ID), state,
              auto_inactive:false, environment_url,
              log_url:`https://github.com/teableio/teable-ee/actions/runs/${request.source_run_id}/attempts/${request.source_run_attempt}`,
            });
            core.setOutput('state', state === 'error' ? 'cancelled' : state);
            core.setOutput('environment_url', environment_url);
      - name: Record product env drift versus cn-prod
        if: always() && env.KUBECONFIG != ''
        run: node control/.github/scripts/testing-cn-env-drift.mjs from-cluster "$RUNNER_TEMP/env-drift.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testing-cn-env-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/env-drift.json
          if-no-files-found: ignore
      - name: Remove local credentials and rendered secrets
        if: always()
        run: |
          rm -f "$KUBECONFIG" "$RUNNER_TEMP/deploy.yaml" "$RUNNER_TEMP/testing-cn-apply.log" \
            "$RUNNER_TEMP/testing-cn-admin-output" "$RUNNER_TEMP/testing-cn-admin.log"

  notify:
    needs: [verify, build-push, deploy]
    if: always() && !cancelled() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.verify.outputs.control_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: testing-cn-request-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: testing-cn-env-drift-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify Feishu with changes and PR acceptance instructions
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          LARK_BOT_URL: ${{ secrets.LARK_BOT_URL }}
          DEPLOY_ENABLED: ${{ vars.TESTING_CN_DEPLOY_ENABLED }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { notifyTestingDeployment } from './control/.github/scripts/testing-cn-notify.mjs';
          const needs = JSON.parse(process.env.JOBS);
          const jobs = Object.fromEntries(Object.entries(needs).map(([name, job]) => [name, job.result]));
          const outputs = needs.deploy.outputs;
          const state = Object.values(jobs).includes('failure') ? 'failure'
            : Object.values(jobs).includes('cancelled') ? 'cancelled'
            : process.env.DEPLOY_ENABLED !== 'true' ? 'disabled'
            : outputs.state || 'failure';
          const result = { state };
          if (outputs.deployment_id) result.deployment_id = Number(outputs.deployment_id);
          if (outputs.environment_url) result.environment_url = outputs.environment_url;
          let drift;
          try { drift = JSON.parse(readFileSync('env-drift.json', 'utf8')); } catch {}
          const summary = await notifyTestingDeployment({
            request: JSON.parse(readFileSync('request.json')).request,
            result, jobs, drift,
            build_run_id: Number(process.env.GITHUB_RUN_ID),
            build_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          });
          console.log(JSON.stringify(summary));
          NODE
