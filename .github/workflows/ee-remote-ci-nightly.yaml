# EE Remote CI — nightly suite: the computed convergence gate's scheduled profiles (was
# teable-ee's "Computed Convergence Gate" schedule leg). teable-ee's
# computed-convergence-nightly.yml opens the check run on develop's head and dispatches this
# at 03:23 UTC. One workflow per suite so partial reruns produce clean run pages. SOURCE OF
# TRUTH lives in teable-ee .github/enterprise-ci/ and is synced here; the test commands are
# teable-ee's .github/scripts/ci-computed-gate.sh. The watchdog gives this check its own,
# longer ceiling (the extended profiles alone may take 90 minutes).

name: EE Remote CI (nightly)

run-name: 'EE Remote CI nightly — ${{ github.event.client_payload.ee_ref }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-nightly]

concurrency:
  group: ee-remote-ci-nightly-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  focused:
    runs-on: ubuntu-latest
    name: Computed contracts PostgreSQL ${{ matrix.postgres }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: computed_frontier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d computed_frontier"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 1
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      TEABLE_V2_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
      FRONTIER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/computed_frontier
      SLUG: focused-pg${{ matrix.postgres }}

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-e2e...

      - name: 🧪 Verify bounded convergence and PostgreSQL recovery
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== computed contracts PostgreSQL ${{ matrix.postgres }} ==="
            bash .github/scripts/ci-computed-gate.sh focused "$GITHUB_WORKSPACE/nightly-artifacts"
          } >> "$LOG_DIR/nightly-$SLUG.log" 2>&1 || status=$?
          echo "nightly $SLUG exit=$status ($(wc -l < "$LOG_DIR/nightly-$SLUG.log") log lines)"
          exit $status

      - name: 🐘 PostgreSQL survived
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== postgres service state ==="
            bash .github/scripts/ci-computed-gate.sh pg-state "$GITHUB_WORKSPACE/nightly-artifacts" "$POSTGRES_CONTAINER"
          } >> "$LOG_DIR/nightly-$SLUG.log" 2>&1 || status=$?
          echo "postgres state exit=$status"
          exit $status

      - name: 📤 Ship log & artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/nightly-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/nightly-$SLUG.log"
          # Replays and evidence must not become public artifacts — bundle them into the
          # private channel instead (the report re-homes them for a failed suite).
          if [ -d nightly-artifacts ]; then
            tar -czf "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" nightly-artifacts || true
          fi
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (nightly)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.log" -R "$LOGS_REPO" --clobber
          if [ -f "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" ]; then
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" -R "$LOGS_REPO" --clobber
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/nightly-$SLUG.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.failed" -R "$LOGS_REPO" --clobber
          fi

  extended:
    runs-on: ubuntu-latest
    name: Extended properties seed ${{ matrix.seed }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: ['7152', '3337']
    env:
      CI: 1
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      SLUG: extended-${{ matrix.seed }}

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-e2e...

      - name: 🧪 Exercise expanded profiles and shrink failing sequences
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== extended properties seed ${{ matrix.seed }} ==="
            bash .github/scripts/ci-computed-gate.sh extended "$GITHUB_WORKSPACE/nightly-artifacts" "${{ matrix.seed }}"
          } >> "$LOG_DIR/nightly-$SLUG.log" 2>&1 || status=$?
          echo "nightly $SLUG exit=$status ($(wc -l < "$LOG_DIR/nightly-$SLUG.log") log lines)"
          exit $status

      - name: 📤 Ship log & artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/nightly-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/nightly-$SLUG.log"
          # Replays and evidence must not become public artifacts — bundle them into the
          # private channel instead (the report re-homes them for a failed suite).
          if [ -d nightly-artifacts ]; then
            tar -czf "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" nightly-artifacts || true
          fi
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (nightly)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.log" -R "$LOGS_REPO" --clobber
          if [ -f "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" ]; then
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" -R "$LOGS_REPO" --clobber
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/nightly-$SLUG.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.failed" -R "$LOGS_REPO" --clobber
          fi

  mutation:
    runs-on: ubuntu-latest
    name: Computed fault sensitivity
    timeout-minutes: 90
    env:
      CI: 1
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      SLUG: mutation

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-e2e...

      - name: 🧪 Require baseline success and intended assertion kills
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== computed fault sensitivity ==="
            bash .github/scripts/ci-computed-gate.sh mutation "$GITHUB_WORKSPACE/nightly-artifacts"
          } >> "$LOG_DIR/nightly-$SLUG.log" 2>&1 || status=$?
          echo "nightly $SLUG exit=$status ($(wc -l < "$LOG_DIR/nightly-$SLUG.log") log lines)"
          exit $status

      - name: 📤 Ship log & artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/nightly-$SLUG.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/nightly-$SLUG.log"
          # Replays and evidence must not become public artifacts — bundle them into the
          # private channel instead (the report re-homes them for a failed suite).
          if [ -d nightly-artifacts ]; then
            tar -czf "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" nightly-artifacts || true
          fi
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (nightly)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.log" -R "$LOGS_REPO" --clobber
          if [ -f "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" ]; then
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-artifacts-$SLUG.tar.gz" -R "$LOGS_REPO" --clobber
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/nightly-$SLUG.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/nightly-$SLUG.failed" -R "$LOGS_REPO" --clobber
          fi

  verdict:
    needs: [focused, extended, mutation]
    if: always()
    runs-on: ubuntu-latest
    name: Nightly verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: nightly
          results: 'focused=${{ needs.focused.result }} extended=${{ needs.extended.result }} mutation=${{ needs.mutation.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ secrets.PACKAGES_KEY }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=nightly" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=focused=${{ needs.focused.result }} extended=${{ needs.extended.result }} mutation=${{ needs.mutation.result }}"
