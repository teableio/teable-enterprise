name: Manual ECS Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., release.2026-04-20T10-38-57Z.1)'
        required: true
      trigger:
        description: 'Who triggered this deployment'
        required: false
        default: 'Manual'
      release_created_time:
        description: 'Creation time of the release record that triggered this deploy (ISO 8601)'
        required: false
        default: ''
      release_record_id:
        description: 'Teable Release record ID for status update'
        required: false
        default: ''
      release_author:
        description: 'Release author'
        required: false
        default: ''
      release_pr:
        description: 'Pull request number'
        required: false
        default: ''
      release_issues:
        description: 'Related issue titles (newline separated)'
        required: false
        default: ''
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      trigger:
        description: 'Who triggered this deployment'
        required: false
        type: string
        default: 'Automation'
      release_created_time:
        description: 'Creation time of the release record that triggered this deploy (ISO 8601)'
        required: false
        type: string
        default: ''
      release_record_id:
        description: 'Teable Release record ID for status update'
        required: false
        type: string
        default: ''
      release_author:
        description: 'Release author'
        required: false
        type: string
        default: ''
      release_pr:
        description: 'Pull request number'
        required: false
        type: string
        default: ''
      release_issues:
        description: 'Related issue titles (newline separated)'
        required: false
        type: string
        default: ''
    outputs:
      start_time:
        description: 'Deployment start timestamp'
        value: ${{ jobs.prepare.outputs.start_time }}
      image_tag:
        description: 'Deployed image tag'
        value: ${{ jobs.prepare.outputs.image_tag }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      TEABLE_API_TOKEN:
        required: false

# NOTE: no workflow-level concurrency — GitHub cancels superseded PENDING
# runs in a group, which would cancel a whole staging release (incl. its DB
# migration). Cross-run EKS ordering is guarded inside deploy-eks with a
# deploy-epoch annotation instead (older attempt refuses to overwrite newer).
jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.start_time.outputs.start }}
      image_tag: ${{ inputs.image_tag }}
      staging_tag: ${{ steps.resolve.outputs.staging_tag }}

    steps:
      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Resolve staging registry tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Records and automation identify a build by its release id
          # (release.<ts>.<seq>); the registry tag of a staging build is the
          # derived beta-<ts>.<seq> twin. Builds from before the channel
          # split were pushed as release.* directly, so fall back to the
          # input tag when the beta twin is absent on ECR.
          case "$INPUT_TAG" in
            release.*) CANDIDATE="beta-${INPUT_TAG#release.}" ;;
            *)         CANDIDATE="$INPUT_TAG" ;;
          esac
          if aws ecr describe-images --region us-west-2 \
               --repository-name teable/teable-cloud \
               --image-ids imageTag="$CANDIDATE" >/dev/null 2>&1; then
            STAGING_TAG="$CANDIDATE"
          else
            echo "beta twin ${CANDIDATE} not on ECR, falling back to ${INPUT_TAG}"
            STAGING_TAG="$INPUT_TAG"
          fi
          echo "staging_tag=${STAGING_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying registry tag: ${STAGING_TAG}"

  # Staging rehearsal of the CDN release flow: patch the staging image with
  # the CDN origin (.github/scripts/patch-asset-prefix.mjs, bind-mounted into
  # the build — nothing baked into product images), upload the patched static
  # set to the assets bucket, invalidate the CDN edge, and push the patched
  # image back under the SAME staging tag — the deploy flow keeps referencing
  # beta-<id> exactly as before; the patch is invisible to everything
  # downstream. Idempotency comes from the teable.asset-prefix image label,
  # not from tag names. ECR-only (this workflow has no ghcr credentials),
  # which means the in-place push makes ECR's beta-<id> diverge from ghcr's —
  # ghcr stays the authoritative UNPATCHED artifact, and the production
  # stamp-release sources release tags from ghcr for that reason. Assets
  # share the production bucket: keys are content-hashed per build so nothing
  # referenced by a released build is ever touched, and the upload is
  # append-only (never --delete). Images whose bundle format the script does
  # not recognize are deployed untouched.
  patch-cdn:
    name: Patch staging image for CDN
    needs: prepare
    runs-on: ubuntu-latest
    env:
      STAGING_TAG: ${{ needs.prepare.outputs.staging_tag }}
      CDN_ORIGIN: https://sss.teable.ai
      ASSET_BUCKET: teable-next-asset
      ECR_IMAGE: 649941507946.dkr.ecr.us-west-2.amazonaws.com/teable/teable-cloud

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if the staging image is already patched (redeploy fast-path)
        id: existing
        run: |
          set -euo pipefail
          docker pull "${ECR_IMAGE}:${STAGING_TAG}"
          CURRENT=$(docker inspect --format '{{index .Config.Labels "teable.asset-prefix"}}' \
            "${ECR_IMAGE}:${STAGING_TAG}" 2>/dev/null || echo "")
          if [ "$CURRENT" = "$CDN_ORIGIN" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${STAGING_TAG} already carries the ${CDN_ORIGIN} patch; assets are append-only, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy scripts
        if: steps.existing.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Build patch layer
        if: steps.existing.outputs.exists == 'false'
        id: patch
        run: |
          set -euo pipefail

          # Pre-flight dry-run with the mounted script: an image whose bundle
          # format the script does not recognize (pre-Turbopack build, or a
          # Next upgrade whose pattern is not in the list yet — see the
          # verify-cdn-patchability canary) is deployed untouched instead of
          # blocking the staging deploy.
          if ! docker run --rm --entrypoint node -e PATCH_DRY_RUN=1 \
              -v "$PWD/.github/scripts/patch-asset-prefix.mjs:/tmp/patch-asset-prefix.mjs:ro" \
              "${ECR_IMAGE}:${STAGING_TAG}" /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app; then
            echo "::warning::${STAGING_TAG} bundle format not recognized by the patch script; deploying it untouched"
            echo "patched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Patching is deploy policy: the script and this 4-line wrapper
          # both live in this repo, and the script is bind-mounted into the
          # build — nothing is baked into product images, so ANY image is
          # patchable. The teable.asset-prefix label written here is the same
          # contract the idempotency check above reads.
          docker build -t app-cdn-variant \
            --build-arg BASE_IMAGE="${ECR_IMAGE}:${STAGING_TAG}" \
            --build-arg CDN_ORIGIN="${CDN_ORIGIN}" \
            -f - .github/scripts <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG CDN_ORIGIN
          RUN --mount=type=bind,source=patch-asset-prefix.mjs,target=/tmp/patch-asset-prefix.mjs \
              node /tmp/patch-asset-prefix.mjs "${CDN_ORIGIN}" /app
          ENV NEXT_BUILD_ENV_ASSET_PREFIX=${CDN_ORIGIN}
          LABEL teable.asset-prefix=${CDN_ORIGIN}
          EOF
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the patched image
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh app-cdn-variant -c '
            set -e
            SAMPLE=$(ls /app/enterprise/app-ee/.next/static/chunks/turbopack-*.js | head -1)
            grep -q "'"${CDN_ORIGIN}"'/_next/" "$SAMPLE"
            [ "$NEXT_BUILD_ENV_ASSET_PREFIX" = "'"${CDN_ORIGIN}"'" ]
            echo "smoke OK: $SAMPLE"
          '

      - name: Upload patched static assets to S3 (append-only)
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          CID=$(docker create app-cdn-variant)
          docker cp "$CID:/app/enterprise/app-ee/.next/static" ./static-out
          docker rm "$CID" >/dev/null
          # NEVER --delete: chunks of other builds must survive.
          # Fonts land as octet-stream (CLI can't guess those extensions) —
          # accepted: browsers sniff font magic bytes, nothing breaks.
          aws s3 cp ./static-out "s3://${ASSET_BUCKET}/_next/static/" \
            --recursive --only-show-errors
          echo "uploaded $(find ./static-out -type f | wc -l) files"

      - name: Push patched image back under the same staging tag
        if: steps.existing.outputs.exists == 'false' && steps.patch.outputs.patched == 'true'
        run: |
          set -euo pipefail
          docker tag app-cdn-variant "${ECR_IMAGE}:${STAGING_TAG}"
          docker push "${ECR_IMAGE}:${STAGING_TAG}"

  # EKS is THE staging deploy since 2026-07-26 (ECS legs removed 07-27).
  # DB migration runs as a K8s Job before the deployments roll.
  deploy-eks:
    name: Deploy to Staging EKS
    needs: [prepare, patch-cdn]
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.roll.outputs.skipped }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC, namespace-scoped role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::649941507946:role/teable-staging-eks-deploy
          role-session-name: eks-staging-deploy
          aws-region: us-west-2

      - name: Roll EKS deployments to this build
        id: roll
        env:
          STAGING_TAG: ${{ needs.prepare.outputs.staging_tag }}
          ECR: 649941507946.dkr.ecr.us-west-2.amazonaws.com
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region us-west-2 --name teable-infra

          # Ordering guard: token = run id (assigned at run creation, immune
          # to stage delays); CAS via resourceVersion (see prod twin).
          MY_ID=${{ github.run_id }}
          for attempt in 1 2 3 4 5; do
            read -r RV CUR <<<"$(kubectl -n teable-staging get deploy teable-staging \
              -o jsonpath='{.metadata.resourceVersion} {.metadata.annotations.teable\.io/deploy-run-id}')"
            if [ -n "$CUR" ] && [ "$CUR" -gt "$MY_ID" ] 2>/dev/null; then
              echo "::notice::run $CUR (> mine $MY_ID) already deployed EKS; skipping"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # rerun of the same run keeps its run_id — resume, don't skip
            [ "$CUR" = "$MY_ID" ] && echo "resuming own run $MY_ID" && break
            kubectl -n teable-staging annotate --overwrite --resource-version="$RV" \
              deploy/teable-staging teable.io/deploy-run-id="$MY_ID" 2>/dev/null && break
            [ "$attempt" = "5" ] && echo "::error::deploy-run-id CAS failed 5x" && exit 1
            sleep 2
          done

          # Resolve the digests the staging tags point at RIGHT NOW (after
          # patch-cdn potentially rewrote them earlier in this run).
          APP_DIGEST=$(aws ecr describe-images --region us-west-2 \
            --repository-name teable/teable-cloud \
            --image-ids imageTag="$STAGING_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          SANDBOX_DIGEST=$(aws ecr describe-images --region us-west-2 \
            --repository-name teable/teable-sandbox-cloud \
            --image-ids imageTag="$STAGING_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "app:     ${STAGING_TAG} -> ${APP_DIGEST}"
          echo "sandbox: ${STAGING_TAG} -> ${SANDBOX_DIGEST}"

          # ── DB migration as a K8s Job (was an ECS one-off RunTask) ──
          JOB="migrate-${{ github.run_id }}-${{ github.run_attempt }}"
          kubectl -n teable-staging delete job "$JOB" --ignore-not-found >/dev/null 2>&1
          cat <<MIGEOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: teable-staging
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 7200
            activeDeadlineSeconds: 900
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { teable.io/node-pool: general }
                containers:
                  - name: migrate
                    image: ${ECR}/teable/teable-cloud@${APP_DIGEST}
                    args: ["migrate-only"]
                    envFrom: [{ secretRef: { name: teable-staging-env } }]
                    resources:
                      requests: { cpu: 250m, memory: 1Gi }
                      limits: { cpu: "2", memory: 3Gi }
          MIGEOF
          echo "waiting for migration job ${JOB}..."
          MIG_OK=""
          for i in $(seq 1 180); do
            ST=$(kubectl -n teable-staging get job "${JOB}" \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' 2>/dev/null || echo "")
            case "$ST" in
              *Complete=True*) MIG_OK=1; break ;;
              *Failed=True*)   break ;;
            esac
            sleep 5
          done
          if [ -z "$MIG_OK" ]; then
            echo "::error::DB migration failed or timed out"
            kubectl -n teable-staging logs "job/${JOB}" --tail=100 || true
            exit 1
          fi
          echo "migration completed"

          # Re-validate ownership after the migration window (see prod twin).
          CUR2=$(kubectl -n teable-staging get deploy teable-staging \
            -o jsonpath='{.metadata.annotations.teable\.io/deploy-run-id}')
          if [ "$CUR2" != "$MY_ID" ]; then
            echo "::notice::run $CUR2 took over during migration; skipping rollout"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kubectl -n teable-staging set image deploy/teable-staging \
            teable="${ECR}/teable/teable-cloud@${APP_DIGEST}"
          kubectl -n teable-staging set image deploy/teable-staging-byodb-worker \
            teable="${ECR}/teable/teable-cloud@${APP_DIGEST}"
          kubectl -n teable-staging set image deploy/teable-sandbox \
            sandbox="${ECR}/teable/teable-sandbox-cloud@${SANDBOX_DIGEST}"

          kubectl -n teable-staging annotate --overwrite \
            deploy/teable-staging-byodb-worker deploy/teable-sandbox \
            teable.io/deploy-run-id="$MY_ID" teable.io/deploy-release="$STAGING_TAG"
          kubectl -n teable-staging annotate --overwrite \
            deploy/teable-staging teable.io/deploy-release="$STAGING_TAG"

          FINAL=$(kubectl -n teable-staging get deploy teable-staging \
            -o jsonpath='{.metadata.annotations.teable\.io/deploy-run-id}')
          if [ "$FINAL" != "$MY_ID" ]; then
            echo "::error::run $FINAL overlapped this deploy — EKS may hold mixed images; redeploy the latest build"
            exit 1
          fi

      - name: Wait for rollouts
        if: steps.roll.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          kubectl -n teable-staging rollout status deploy/teable-staging --timeout=300s
          kubectl -n teable-staging rollout status deploy/teable-staging-byodb-worker --timeout=300s
          kubectl -n teable-staging rollout status deploy/teable-sandbox --timeout=300s

      - name: Smoke check through the ALB
        if: steps.roll.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging.teable.ai/health || true)
            [ "$code" = "200" ] && echo "staging /health: 200" && exit 0
            echo "attempt $i: $code"; sleep 6
          done
          echo "::error::staging /health never returned 200 after EKS rollout"
          exit 1

  notify:
    name: Record Deployment in Teable
    needs: [prepare, deploy-eks]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Update Staging Status in Releases table
        if: inputs.release_record_id != ''
        env:
          RECORD_ID: ${{ inputs.release_record_id }}
          DEPLOY_RESULT: ${{ needs.deploy-eks.result == 'success' && 'Deployed' || 'Failed' }}
        run: |
          echo "Updating record $RECORD_ID Staging Status to $DEPLOY_RESULT"
          update_payload=$(jq -n \
            --arg status "$DEPLOY_RESULT" \
            '{
              "fieldKeyType": "id",
              "typecast": true,
              "record": {
                "fields": {
                  "fldDTDMmcyJ7jmn6YsH": $status
                }
              }
            }')
          curl -s -o /dev/null -w "Update HTTP %{http_code}\n" -X PATCH \
            "https://app.teable.ai/api/table/tblAhVLOxNtvkaF1ii5/record/${RECORD_ID}" \
            -H 'Authorization: Bearer ${{ secrets.TEABLE_API_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$update_payload"

      - name: Send Feishu staging deploy notification
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          # 手动 dispatch 无 release 元数据时,用 trigger 输入标注来源(如运维验证跑),不再显示 unknown
          AUTHOR: ${{ inputs.release_author || inputs.trigger || 'unknown' }}
          PR: ${{ inputs.release_pr || '无' }}
          ISSUES: ${{ inputs.release_issues || '无关联 Issue' }}
          DEPLOY_SUCCESS: ${{ needs.deploy-eks.result == 'success' && 'true' || 'false' }}
          EKS_SUPERSEDED: ${{ needs.deploy-eks.outputs.skipped == 'true' && 'true' || 'false' }}
        run: |
          RELEASE_TAG="${IMAGE_TAG}"
          if [ "$EKS_SUPERSEDED" = "true" ]; then
            RELEASE_TAG="${RELEASE_TAG}（EKS 侧被更新的 run 取代，未安装本版本）"
          fi

          if [ "$DEPLOY_SUCCESS" = "true" ]; then
            HEADER_COLOR="yellow"
            TITLE="🚀 Staging 部署成功 ${RELEASE_TAG}"
          else
            HEADER_COLOR="red"
            TITLE="❌ Staging 部署失败 ${RELEASE_TAG}"
          fi

          # Format issues as bullet list
          ISSUE_LIST=$(echo "$ISSUES" | sed 's/^/• /' | sed '/^• $/d')
          if [ -z "$ISSUE_LIST" ]; then
            ISSUE_LIST="无关联 Issue"
          fi

          card_payload=$(jq -n \
            --arg title "$TITLE" \
            --arg color "$HEADER_COLOR" \
            --arg tag "$RELEASE_TAG" \
            --arg author "$AUTHOR" \
            --arg pr "$PR" \
            --arg issues "$ISSUE_LIST" \
            '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": { "tag": "plain_text", "content": $title },
                  "template": $color
                },
                "elements": [
                  {
                    "tag": "div",
                    "fields": [
                      { "is_short": true, "text": { "tag": "lark_md", "content": ("**Tag**\n" + $tag) } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": ("**Author**\n" + $author) } },
                      { "is_short": true, "text": { "tag": "lark_md", "content": ("**PR**\n" + $pr) } }
                    ]
                  },
                  { "tag": "hr" },
                  {
                    "tag": "div",
                    "text": { "tag": "lark_md", "content": ("**📋 关联 Issue：**\n" + $issues) }
                  }
                ]
              }
            }')

          http_code=$(curl -s -w "%{http_code}" -o /tmp/feishu.json -X POST \
            'https://open.feishu.cn/open-apis/bot/v2/hook/66b6ebf2-9bbd-4e41-b629-4062a6be4a42' \
            -H 'Content-Type: application/json' \
            -d "$card_payload")

          echo "Feishu notification HTTP: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Feishu notification failed"
            cat /tmp/feishu.json
          fi
