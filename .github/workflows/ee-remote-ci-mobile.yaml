# EE Remote CI — mobile suite (was teable-ee's "Mobile CI"): typecheck, lint, unit tests and
# a Metro export smoke test of enterprise/mobile. One workflow per suite so partial reruns
# produce clean run pages. SOURCE OF TRUTH lives in teable-ee .github/enterprise-ci/ and is
# synced here; the gate itself is teable-ee's .github/scripts/ci-mobile.sh.

name: EE Remote CI (mobile)

run-name: 'EE Remote CI mobile — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-mobile]

concurrency:
  group: ee-remote-ci-mobile-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  mobile:
    runs-on: ubuntu-latest
    name: Mobile typecheck · lint · test · export
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          # The repository's Node (`use-node-version` in .npmrc), which is what pnpm runs the
          # gate's scripts with; the bare `node` of the export step is then the same one.
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🧪 Typecheck · lint · test · export
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== mobile gate ==="
            bash .github/scripts/ci-mobile.sh
          } >> "$LOG_DIR/mobile.log" 2>&1 || status=$?
          echo "mobile exit=$status ($(wc -l < "$LOG_DIR/mobile.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/mobile.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/mobile.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/mobile.log" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/mobile.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/mobile.failed" -R "$LOGS_REPO" --clobber
          fi

  verdict:
    needs: [mobile]
    if: always()
    runs-on: ubuntu-latest
    name: Mobile verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: mobile
          results: 'mobile=${{ needs.mobile.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ secrets.PACKAGES_KEY }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=mobile" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=mobile=${{ needs.mobile.result }}"
