# EE Remote CI — ai-api suite (was teable-ee's "E2E Tests Backend - AI"): the AI, chat, task
# and automation integration tests against a real model gateway. Selected by path, or on
# every PR labelled "AI test". One workflow per suite so partial reruns produce clean run
# pages. SOURCE OF TRUTH lives in teable-ee .github/enterprise-ci/ and is synced here.
# Needs AI_GATEWAY_API_KEY and TEST_AI_CONFIG in this repository's secrets.

name: EE Remote CI (ai-api)

run-name: 'EE Remote CI ai-api — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-ai-api]

concurrency:
  group: ee-remote-ci-ai-api-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  ai-api:
    runs-on: ubuntu-latest
    name: AI Integration Tests
    timeout-minutes: 45
    env:
      CI: 1

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🧪 Run AI tests
        env:
          VITEST_MAX_THREADS: 2
          VITEST_MIN_THREADS: 1
          VITEST_SHARD: 1/1
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TEST_AI_CONFIG: ${{ secrets.TEST_AI_CONFIG }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -n "$AI_GATEWAY_API_KEY" ] && [ -n "$TEST_AI_CONFIG" ] \
            || { echo "AI_GATEWAY_API_KEY / TEST_AI_CONFIG are not set in this repository's secrets"; exit 1; }
          status=0
          {
            echo "=== AI integration tests ==="
            make postgres-ee-ai.integration.test
          } >> "$LOG_DIR/ai-api.log" 2>&1 || status=$?
          echo "ai-api exit=$status ($(wc -l < "$LOG_DIR/ai-api.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/ai-api.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/ai-api.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/ai-api.log" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/ai-api.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/ai-api.failed" -R "$LOGS_REPO" --clobber
          fi

  verdict:
    needs: [ai-api]
    if: always()
    runs-on: ubuntu-latest
    name: AI API verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: ai-api
          results: 'ai-api=${{ needs.ai-api.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ secrets.PACKAGES_KEY }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=ai-api" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=ai-api=${{ needs.ai-api.result }}"
