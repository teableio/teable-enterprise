name: Preview Reaper

# Frees the CN test cluster (namespace teable-preview) from previews nobody uses.
# A preview is reaped when its pull request is no longer open, or when it has gone
# PREVIEW_MAX_IDLE_DAYS (default 3) without a deploy. preview-ack.yml stamps
# teable.io/deployed-at on every deploy, so every push resets the clock; PR comments
# and label edits do not.
#
# An idle preview of an open PR also loses its preview-<edition> label, so the label
# keeps meaning "this PR has a preview", and the PR gets a comment on how to bring it
# back. Removing the label sends teable-ee's cleanup-<edition> event, which finds
# nothing left to delete.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete previews whose last deploy is older than this many days'
        required: true
        default: '3'
      dry_run:
        description: 'Only list candidates without deleting resources'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      target:
        description: 'Preview type to reap'
        required: true
        type: choice
        default: all
        options:
          - all
          - cloud
          - ee

concurrency:
  group: preview-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: Delete expired preview environments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || vars.PREVIEW_MAX_IDLE_DAYS || '3' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
      ALIYUN_ROLE_ARN: ${{ vars.CN_TEST_DEPLOY_ROLE_ARN || 'acs:ram::1145786521954482:role/teable-cn-test-github-deploy' }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.CN_TEST_OIDC_PROVIDER_ARN || 'acs:ram::1145786521954482:oidc-provider/github-actions' }}
    steps:
      - name: Checkout cluster access scripts
        uses: actions/checkout@v4

      - name: Get Aliyun STS credentials via OIDC
        run: bash .github/scripts/aliyun-oidc-login.sh

      - name: Fetch cluster kubeconfig
        run: bash .github/scripts/cn-test-kubeconfig.sh

      - name: Reap expired previews
        run: |
          set -euo pipefail

          [[ "${MAX_AGE_DAYS}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::max_age_days must be a positive integer"; exit 1; }
          case "${DRY_RUN}" in true | false) ;; *) echo "::error::dry_run must be true or false"; exit 1 ;; esac
          case "${TARGET}" in all | cloud | ee) ;; *) echo "::error::target must be all, cloud, or ee"; exit 1 ;; esac

          now_epoch="$(date -u +%s)"
          cutoff_epoch=$(( now_epoch - MAX_AGE_DAYS * 86400 ))

          # One line per preview: instance, kind, PR number, last deploy (the
          # deployed-at stamp; creation time for previews deployed before the stamp).
          previews="$(
            kubectl get deployments -l teable.io/preview-role=app -o json |
              jq -r --arg target "${TARGET}" '
                .items[]
                | (.metadata.labels["teable.io/preview-instance"] // "") as $instance
                | select($instance | test("^teable-pr-(cloud|ee)-[0-9]+$"))
                | ($instance | capture("^teable-pr-(?<kind>cloud|ee)-(?<pr>[0-9]+)$")) as $p
                | select($target == "all" or $target == $p.kind)
                | [$instance, $p.kind, $p.pr,
                   (.metadata.annotations["teable.io/deployed-at"] // .metadata.creationTimestamp)]
                | @tsv'
          )"

          {
            echo "### Preview Reaper"
            echo ""
            echo "- Max idle: \`${MAX_AGE_DAYS}\` days since the last deploy · target \`${TARGET}\` · dry run \`${DRY_RUN}\`"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -z "${previews}" ]; then
            echo "No preview environments found." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          candidates=""
          while IFS=$'\t' read -r instance kind pr_number deployed_at; do
            deployed_epoch="$(date -u -d "${deployed_at}" +%s)"
            idle_days=$(( (now_epoch - deployed_epoch) / 86400 ))
            if ! pr_state="$(gh api "repos/teableio/teable-ee/pulls/${pr_number}" --jq .state </dev/null 2>/tmp/reaper-gh-error)"; then
              echo "::warning::skipping ${instance}: failed to fetch teable-ee PR #${pr_number}: $(cat /tmp/reaper-gh-error)"
              continue
            fi
            reason=""
            if [ "${pr_state}" != "open" ]; then
              reason="pr_${pr_state}"
            elif [ "${deployed_epoch}" -le "${cutoff_epoch}" ]; then
              reason="idle_${idle_days}d"
            fi
            echo "${instance}: PR #${pr_number} ${pr_state}, last deploy ${deployed_at} (${idle_days}d) -> ${reason:-keep}"
            if [ -n "${reason}" ]; then
              candidates+="${instance}"$'\t'"${kind}"$'\t'"${pr_number}"$'\t'"${deployed_at}"$'\t'"${reason}"$'\n'
            fi
          done <<<"${previews}"

          if [ -z "${candidates}" ]; then
            echo "No expired preview environments found." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "| Instance | PR | Last deploy | Reason |"
            echo "| --- | --- | --- | --- |"
            while IFS=$'\t' read -r instance kind pr_number deployed_at reason; do
              [ -n "${instance}" ] && echo "| \`${instance}\` | #${pr_number} | \`${deployed_at}\` | ${reason} |"
            done <<<"${candidates}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run complete. No resources were deleted." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          failures=0
          while IFS=$'\t' read -r instance kind pr_number deployed_at reason; do
            [ -n "${instance}" ] || continue
            selector="teable.io/preview-instance=${instance}"
            echo "Deleting ${instance} (${reason})"
            if ! kubectl delete deployment,statefulset,service,ingress,secret,job,configmap -l "${selector}" \
              --ignore-not-found --wait=true --timeout=180s </dev/null; then
              echo "::warning::failed to delete ${instance}"
              failures=$((failures + 1))
              continue
            fi
            # The StatefulSet deletes its own PVC (whenDeleted: Delete); this catches leftovers.
            kubectl delete pvc -l "${selector}" --ignore-not-found --wait=false </dev/null || true

            # Idle preview of an open PR: drop the label and say how to get it back.
            case "${reason}" in idle_*)
              gh api -X DELETE "repos/teableio/teable-ee/issues/${pr_number}/labels/preview-${kind}" </dev/null >/dev/null 2>&1 \
                || echo "::warning::could not remove preview-${kind} from PR #${pr_number} (already gone?)"
              gh api "repos/teableio/teable-ee/issues/${pr_number}/comments" \
                -f body="🧹 The ${kind} preview had no deploy for ${MAX_AGE_DAYS} days and was removed from the CN test cluster to free capacity. The \`preview-${kind}\` label was removed too; add it again to rebuild the preview (its data is not kept)." </dev/null >/dev/null \
                || echo "::warning::could not comment on PR #${pr_number}"
              ;;
            esac
          done <<<"${candidates}"

          echo "Deletion complete. failures=${failures}" | tee -a "${GITHUB_STEP_SUMMARY}"
          [ "${failures}" -eq 0 ]
