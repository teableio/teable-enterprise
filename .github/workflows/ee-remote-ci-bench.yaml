name: EE Remote CI (bench calibration)
run-name: "EE bench calibration — ${{ github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ inputs.source_sha }}
  LOG_TAG: ee-bench-calibration-${{ github.run_id }}
  CAL_TAG: bench-calibration-${{ github.run_id }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs
  TEABLE_BENCH_SAMPLES: 100

jobs:
  runtime:
    runs-on: ubuntu-latest
    name: Build benchmark runtime
    timeout-minutes: 30
    outputs:
      checkout_sha: ${{ steps.source.outputs.sha }}
      runtime_tag: ${{ steps.source.outputs.runtime_tag }}
      runtime_asset: ${{ steps.source.outputs.runtime_asset }}
    env:
      CI: 1
      TEABLE_TSDOWN_DISABLE_DTS: '1'
      EVIDENCE_PREFIX: runtime-${{ github.run_attempt }}
    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🙈 Mask private values
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          echo "::add-mask::$GH_TOKEN"

      - name: 🔒 Resolve exact checkout
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout did not resolve to the dispatched commit"
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=ee-bench-runtime-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "runtime_asset=ee-bench-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.zst" >> "$GITHUB_OUTPUT"

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 📥 Install headless benchmark dependencies
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-headless-bench...

      - name: 🏗️ Build and pack benchmark runtime
        env:
          RUNTIME_ASSET: ${{ steps.source.outputs.runtime_asset }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          status=0
          {
            echo "=== build shared benchmark runtime ==="
            pnpm -r --filter @teable/v2-headless-bench... build &&
              node community/.github/scripts/bench-runtime-archive.mjs create \
                --root . \
                --archive "/tmp/$RUNTIME_ASSET" \
                --sha "${{ steps.source.outputs.sha }}"
          } >> "$log" 2>&1 || status=$?
          echo "runtime build exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 🔐 Publish private run-scoped runtime
        env:
          RUNTIME_RELEASE_TAG: ${{ steps.source.outputs.runtime_tag }}
          RUNTIME_ASSET: ${{ steps.source.outputs.runtime_asset }}
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -uo pipefail
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
            stale_releases=$(mktemp)
            gh api --paginate "repos/$LOGS_REPO/releases?per_page=100" \
              --jq '.[] | select((.tag_name | startswith("ee-bench-runtime-v1-")) and .published_at != null) | [.tag_name, .published_at] | @tsv' \
              > "$stale_releases" &&
              while IFS=$'\t' read -r tag published; do
                [ -n "$tag" ] || continue
                if [[ "$published" < "$cutoff" ]]; then
                  gh release delete "$tag" -R "$LOGS_REPO" --cleanup-tag --yes || exit
                fi
              done < "$stale_releases" &&
              gh release create "$RUNTIME_RELEASE_TAG" -R "$LOGS_REPO" --prerelease \
                --title "Temporary EE benchmark runtime ${{ github.run_id }}.${{ github.run_attempt }}" \
                --notes "checkout=${{ steps.source.outputs.sha }} node=24.22.2 run=$RUN_URL cleanup=next-producer-after-24h" &&
              gh release upload "$RUNTIME_RELEASE_TAG" "/tmp/$RUNTIME_ASSET" -R "$LOGS_REPO"
          } >> "$log" 2>&1 || status=$?
          echo "runtime publish exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Ship runtime producer evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/evidence
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(runtime producer failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C /tmp ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "runtime ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

  prepare:
    needs: [runtime]
    runs-on: ubuntu-latest
    name: Prepare calibration release
    timeout-minutes: 5
    env:
      EVIDENCE_PREFIX: prepare-${{ github.run_attempt }}
    steps:
      - name: 🙈 Mask private values
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          echo "::add-mask::$GH_TOKEN"

      - name: 🗂️ Create private calibration release
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          status=0
          {
            echo "=== create private calibration releases ==="
            gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
            gh release create "$CAL_TAG" -R "$LOGS_REPO" --prerelease \
              --title "Benchmark calibration ${{ github.run_id }}" \
              --notes "ee_sha=$EE_SHA run=$RUN_URL samples=100"
          } >> "$log" 2>&1 || status=$?
          echo "prepare exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Ship prepare evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/evidence
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(prepare failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C /tmp ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "prepare ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

  fixed:
    needs: [runtime, prepare]
    runs-on: ubuntu-latest
    name: Calibrate fixed (${{ matrix.track }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        track:
          - core-operations
          - core-extra
          - core-scale
          - core-transitions
          - core-views
          - core-computed-changes
          - core-query-cases
          - core-relation-cases
          - core-field-transitions
          - core-fanout-deletion
          - core-volume-cases
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      TEABLE_BENCH_OUT_DIR: /tmp/bench-output
      TEABLE_BENCH_BUDGETS: /tmp/calibration/${{ matrix.track }}.budgets.json
      TEABLE_BENCH_TRACK: ${{ matrix.track }}
      TEABLE_BENCH_CALIBRATE: '3'
      EVIDENCE_PREFIX: fixed-${{ matrix.track }}-${{ github.run_attempt }}
    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.runtime.outputs.checkout_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🙈 Mask private connection and auth values
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 🔐 Restore private benchmark runtime
        env:
          EXPECTED_SHA: ${{ needs.runtime.outputs.checkout_sha }}
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          RUNTIME_RELEASE_TAG: ${{ needs.runtime.outputs.runtime_tag }}
          RUNTIME_ASSET: ${{ needs.runtime.outputs.runtime_asset }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/calibration
          log="$LOG_DIR/restore-$EVIDENCE_PREFIX.log"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== restore private benchmark runtime $RUNTIME_ASSET ==="
            corepack enable &&
              gh release download "$RUNTIME_RELEASE_TAG" -R "$LOGS_REPO" \
                -D /tmp --pattern "$RUNTIME_ASSET" --clobber &&
              node community/.github/scripts/bench-runtime-archive.mjs restore \
                --root . \
                --archive "/tmp/$RUNTIME_ASSET" \
                --sha "$EXPECTED_SHA" &&
              sync
          } >> "$log" 2>&1 || status=$?
          echo "restore fixed $TEABLE_BENCH_TRACK exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 🧪 Calibrate
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          TEABLE_BENCH_CALIBRATE_SOURCE: GitHub ubuntu-latest Node 24.22.2 PostgreSQL 16 calibration run ${{ github.run_id }} fixed leg ${{ matrix.track }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" "$TEABLE_BENCH_OUT_DIR" /tmp/calibration
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== calibrate fixed leg $TEABLE_BENCH_TRACK ==="
            pnpm --filter @teable/v2-headless-bench bench:core-ci &&
              test -s "$TEABLE_BENCH_BUDGETS" &&
              node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error(`calibration JSON is not an object: ${process.argv[1]}`);' "$TEABLE_BENCH_BUDGETS" &&
              gh release upload "$CAL_TAG" "$TEABLE_BENCH_BUDGETS" -R "$LOGS_REPO" --clobber
          } >> "$log" 2>&1 || status=$?
          echo "fixed $TEABLE_BENCH_TRACK calibration exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Ship private calibration evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/evidence /tmp/bench-output /tmp/calibration
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(calibration produced no log: leg failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C /tmp bench-output calibration ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "fixed $TEABLE_BENCH_TRACK ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

  catalogue:
    needs: [runtime, prepare]
    runs-on: ubuntu-latest
    name: Calibrate catalogue (${{ matrix.family }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family:
          - storage-query
          - write
          - formula
          - lookup
          - rollup
          - conditional-link
          - propagation
          - api-limit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
