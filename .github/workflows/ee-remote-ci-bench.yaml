          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(calibration produced no log: leg failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C /tmp bench-output calibration ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "http ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

  complexity:
    needs: [runtime, prepare]
    runs-on: ubuntu-latest
    name: Calibrate complexity
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      EVIDENCE_PREFIX: complexity-${{ github.run_attempt }}
    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.runtime.outputs.checkout_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🙈 Mask private connection and auth values
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 🔐 Restore private benchmark runtime
        env:
          EXPECTED_SHA: ${{ needs.runtime.outputs.checkout_sha }}
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          RUNTIME_RELEASE_TAG: ${{ needs.runtime.outputs.runtime_tag }}
          RUNTIME_ASSET: ${{ needs.runtime.outputs.runtime_asset }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/calibration
          log="$LOG_DIR/restore-$EVIDENCE_PREFIX.log"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== restore private benchmark runtime $RUNTIME_ASSET ==="
            corepack enable &&
              gh release download "$RUNTIME_RELEASE_TAG" -R "$LOGS_REPO" \
                -D /tmp --pattern "$RUNTIME_ASSET" --clobber &&
              node community/.github/scripts/bench-runtime-archive.mjs restore \
                --root . \
                --archive "/tmp/$RUNTIME_ASSET" \
                --sha "$EXPECTED_SHA" &&
              sync
          } >> "$log" 2>&1 || status=$?
          echo "restore complexity exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 🧪 Calibrate
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/bench-output /tmp/calibration
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== calibrate complexity leg ==="
            pnpm --filter @teable/v2-headless-bench bench:complexity-ci calibrate \
              --connection-string "$PRISMA_DATABASE_URL" \
              --out-dir /tmp/bench-output \
              --samples 100 \
              --headroom 3 \
              --source "GitHub ubuntu-latest Node 24.22.2 PostgreSQL 16 calibration run ${{ github.run_id }} complexity leg" \
              --runner github-ubuntu-latest-node24-postgres16 \
              --json /tmp/calibration/complexity.calibration.json \
              --markdown /tmp/calibration/complexity.calibration.md &&
              test -s /tmp/calibration/complexity.calibration.json &&
              node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error(`calibration JSON is not an object: ${process.argv[1]}`);' /tmp/calibration/complexity.calibration.json &&
              gh release upload "$CAL_TAG" /tmp/calibration/complexity.calibration.json /tmp/calibration/complexity.calibration.md -R "$LOGS_REPO" --clobber
          } >> "$log" 2>&1 || status=$?
          echo "complexity calibration exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Ship private calibration evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/evidence /tmp/bench-output /tmp/calibration
          echo "::add-mask::$PRISMA_DATABASE_URL"
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(calibration produced no log: leg failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C /tmp bench-output calibration ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "complexity ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

  collect:
    if: always()
    needs: [runtime, prepare, fixed, catalogue, http, complexity]
    runs-on: ubuntu-latest
    name: Merge calibration artifacts
    timeout-minutes: 15
    env:
      EVIDENCE_PREFIX: collect-${{ github.run_attempt }}
    steps:
      - name: 🙈 Mask private auth values
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          echo "::add-mask::$GH_TOKEN"

      - name: 📥 Download calibration assets
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -uo pipefail
          mkdir -p calibration "$LOG_DIR"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== download calibration assets from $CAL_TAG ==="
            gh release download "$CAL_TAG" -R "$LOGS_REPO" -D calibration --clobber
            download_status=$?
            missing=0
            for name in \
              core-operations.budgets.json \
              core-extra.budgets.json \
              core-scale.budgets.json \
              core-transitions.budgets.json \
              core-views.budgets.json \
              core-computed-changes.budgets.json \
              core-query-cases.budgets.json \
              core-relation-cases.budgets.json \
              core-field-transitions.budgets.json \
              core-fanout-deletion.budgets.json \
              core-volume-cases.budgets.json \
              catalogue-storage-query.json \
              catalogue-write.json \
              catalogue-formula.json \
              catalogue-lookup.json \
              catalogue-rollup.json \
              catalogue-conditional-link.json \
              catalogue-propagation.json \
              catalogue-api-limit.json \
              http.budgets.json \
              complexity.calibration.json \
              complexity.calibration.md
            do
              if [ ! -s "calibration/$name" ]; then
                echo "missing calibration asset: $name"
                missing=1
              fi
            done
            [ "$download_status" -eq 0 ] && [ "$missing" -eq 0 ]
          } >> "$log" 2>&1 || status=$?
          echo "collect download exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 🧮 Merge catalogue budgets
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          status=0
          {
          echo "=== merge catalogue budgets ==="
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync, readdirSync, unlinkSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = 'calibration';
          const files = readdirSync(dir).filter((name) => /^catalogue-.*\.json$/.test(name)).sort();
          if (files.length === 0) throw new Error('no catalogue calibration pieces');
          const pieces = files.map((name) => JSON.parse(readFileSync(join(dir, name), 'utf8')));
          const first = pieces[0];
          const keys = ['schema', 'headroom', 'floorMs', 'provenance.backend', 'provenance.samples', 'provenance.warmup', 'provenance.repetitions'];
          const get = (object, key) => key.split('.').reduce((value, part) => value?.[part], object);
          for (const piece of pieces.slice(1)) {
            for (const key of keys) {
              if (get(piece, key) !== get(first, key)) {
                throw new Error(`catalogue calibration mismatch at ${key}: ${get(piece, key)} != ${get(first, key)}`);
              }
            }
            if (JSON.stringify(piece.provenance.measurementProtocol) !== JSON.stringify(first.provenance.measurementProtocol)) {
              throw new Error('catalogue calibration measurement protocol mismatch');
            }
          }
          const cases = {};
          const calibratedAt = pieces
            .map((piece) => piece.provenance.calibratedAt)
            .sort()
            .at(-1);
          const source = [...new Set(pieces.map((piece) => piece.provenance.source))].join('; ');
          for (const piece of pieces) {
            for (const [key, value] of Object.entries(piece.cases)) {
              if (Object.hasOwn(cases, key)) throw new Error(`duplicate catalogue case ${key}`);
              cases[key] = value;
            }
          }
          const merged = {
            ...first,
            provenance: { ...first.provenance, source, calibratedAt },
            cases: Object.fromEntries(Object.entries(cases).sort(([left], [right]) => left.localeCompare(right))),
          };
          writeFileSync(join(dir, 'catalogue.budgets.json'), `${JSON.stringify(merged, null, 2)}\n`);
          for (const name of files) unlinkSync(join(dir, name));
          console.log(`merged ${pieces.length} catalogue pieces into ${Object.keys(cases).length} cases`);
          EOF
          } >> "$log" 2>&1 || status=$?
          echo "collect merge exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Publish merged calibration
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          echo "::add-mask::$GH_TOKEN"
          status=0
          {
            echo "=== publish merged calibration ==="
            test -s calibration/catalogue.budgets.json &&
              node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error(`calibration JSON is not an object: ${process.argv[1]}`);' calibration/catalogue.budgets.json &&
              for file in calibration/*; do
                [ -f "$file" ] || continue
                gh release upload "$CAL_TAG" "$file" -R "$LOGS_REPO" --clobber || exit
              done &&
              (cd calibration && sha256sum * | sort) > /tmp/calibration-sha256.txt &&
              gh release upload "$CAL_TAG" /tmp/calibration-sha256.txt -R "$LOGS_REPO" --clobber
          } >> "$log" 2>&1 || status=$?
          echo "collect publish exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"

      - name: 📤 Ship private collect evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p "$LOG_DIR" /tmp/evidence calibration
          echo "::add-mask::$GH_TOKEN"
          log="$LOG_DIR/$EVIDENCE_PREFIX.log"
          archive="/tmp/evidence/$EVIDENCE_PREFIX-evidence.tar.gz"
          [ -f "$log" ] || echo "(collect failed before its first logged step)" > "$log"
          printf 'job.status=%s\n' "$JOB_STATUS" >> "$log"
          status=0
          tar -czf "$archive" -C "$GITHUB_WORKSPACE" calibration -C /tmp ci-logs || status=$?
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE bench calibration $LOG_TAG" --notes "ee_sha=$EE_SHA run=$RUN_URL" >> "$log" 2>&1 || true
          gh release upload "$LOG_TAG" "$log" -R "$LOGS_REPO" --clobber || status=$?
          gh release upload "$LOG_TAG" "$archive" -R "$LOGS_REPO" --clobber || status=$?
          if [ "$JOB_STATUS" != "success" ]; then
            printf 'job.status=%s\n' "$JOB_STATUS" > "/tmp/evidence/$EVIDENCE_PREFIX.failed"
            gh release upload "$LOG_TAG" "/tmp/evidence/$EVIDENCE_PREFIX.failed" -R "$LOGS_REPO" --clobber || status=$?
          fi
          echo "collect ship exit=$status ($(wc -l < "$log") log lines)"
          exit "$status"
