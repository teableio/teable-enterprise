name: PR4215 headless HTTP diagnostic
run-name: "PR4215 headless HTTP ${{ inputs.mode }} — ${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      mode:
        type: choice
        required: true
        options: [calibrate, gate]
permissions:
  contents: read
  actions: read
env:
  EE_SHA: ${{ inputs.source_sha }}
  LOG_TAG: pr4215-http-${{ github.run_id }}-a${{ github.run_attempt }}
  PR_NUMBER: "4215"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs
jobs:
  bench:
    runs-on: ubuntu-latest
    name: V2 headless HTTP benchmark
    # Each behavior-family leg runs one bounded case per registered rule in that family.
    # Full-size stress scenarios remain opt-in; bounded counterparts have separate identities.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      TEABLE_BENCH_OUT_DIR: /tmp/teable-headless-bench
      TEABLE_BENCH_SAMPLES: 20
      TEABLE_BENCH_FAMILIES: headless-http
      TEABLE_BENCH_CALIBRATE: ${{ inputs.mode == 'calibrate' && '3' || '' }}
      TEABLE_BENCH_CALIBRATE_SOURCE: GitHub ubuntu-latest Node 24.19.0 PostgreSQL 16; PR4215 ${{ inputs.source_sha }}; run ${{ github.run_id }}
      TEABLE_BENCH_HTTP_BUDGETS: /tmp/teable-headless-bench/http.budgets.json

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Install headless benchmark dependencies
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-headless-bench...

      - name: 🧪 Run bounded PostgreSQL benchmark catalogue
        run: |
          mkdir -p "$LOG_DIR" "$TEABLE_BENCH_OUT_DIR"
          status=0
          (
            set -euo pipefail
            echo "=== v2 headless benchmark catalogue ==="
            if [ "${{ inputs.mode }}" = 'gate' ]; then
              cp community/packages/v2/headless-bench/budgets/http.budgets.json "$TEABLE_BENCH_HTTP_BUDGETS"
            fi
            pnpm -r --filter @teable/v2-headless-bench... build &&
              if [ "$TEABLE_BENCH_FAMILIES" = 'headless-http' ]; then
                pnpm --filter @teable/v2-headless-bench bench:http-ci
              else
                pnpm --filter @teable/v2-headless-bench bench:ci
              fi &&
              echo "=== summary ===" && cat "$TEABLE_BENCH_OUT_DIR/summary.json"
          ) >> "$LOG_DIR/bench.log" 2>&1 || status=$?
          if [ -f "$TEABLE_BENCH_OUT_DIR/summary.md" ]; then
            cat "$TEABLE_BENCH_OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "bench exit=$status family=headless-http ($(wc -l < "$LOG_DIR/bench.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/bench-headless-http.log"
          [ -f "$LOG_DIR/bench.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/bench.log"
          mv "$LOG_DIR/bench.log" "$LOG_FILE"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_FILE" -R "$LOGS_REPO" --clobber
          if [ -d "$TEABLE_BENCH_OUT_DIR" ]; then
            tar -C "$TEABLE_BENCH_OUT_DIR" -czf "$LOG_DIR/headless-bench-headless-http.tgz" .
            gh release upload "$LOG_TAG" "$LOG_DIR/headless-bench-headless-http.tgz" -R "$LOGS_REPO" --clobber
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/bench-headless-http.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/bench-headless-http.failed" -R "$LOGS_REPO" --clobber
          fi

