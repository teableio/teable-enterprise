# Manual PR4215 benchmark validation for the current head.

name: PR4215 current benchmark

run-name: "PR4215 benchmark gate — ${{ github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true

concurrency:
  group: ee-remote-ci-bench-pr4215
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ inputs.source_sha }}
  LOG_TAG: pr4215-gate-${{ github.run_id }}-a${{ github.run_attempt }}
  PR_NUMBER: '4215'
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs
  BENCH_REPORT_ASSET: bench-unified-${{ github.run_id }}-${{ github.run_attempt }}.md

jobs:
  runtime:
    runs-on: ubuntu-latest
    name: Build benchmark runtime
    timeout-minutes: 30
    outputs:
      checkout_sha: ${{ steps.source.outputs.sha }}
      runtime_tag: ${{ steps.source.outputs.runtime_tag }}
      runtime_asset: ${{ steps.source.outputs.runtime_asset }}
    env:
      CI: 1
      TEABLE_TSDOWN_DISABLE_DTS: '1'
    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🔒 Resolve exact checkout
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout did not resolve to the dispatched commit"
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=ee-bench-runtime-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "runtime_asset=ee-bench-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.zst" >> "$GITHUB_OUTPUT"

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 🧪 Test benchmark report behavior
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          node --test community/.github/scripts/benchmark-unified-report.test.mjs community/.github/scripts/bench-runtime-archive.test.mjs \
            >> "$LOG_DIR/bench-runtime.log" 2>&1 || status=$?
          echo "report tests exit=$status ($(wc -l < "$LOG_DIR/bench-runtime.log") private log lines)"
          exit "$status"

      - name: 📥 Install headless benchmark dependencies
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-headless-bench...

      - name: 🏗️ Build and pack benchmark runtime
        env:
          RUNTIME_ASSET: ${{ steps.source.outputs.runtime_asset }}
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== build shared benchmark runtime ==="
            pnpm -r --filter @teable/v2-headless-bench... build &&
              node community/.github/scripts/bench-runtime-archive.mjs create \
                --root . \
                --archive "/tmp/$RUNTIME_ASSET" \
                --sha "${{ steps.source.outputs.sha }}"
          } >> "$LOG_DIR/bench-runtime.log" 2>&1 || status=$?
          echo "runtime build exit=$status ($(wc -l < "$LOG_DIR/bench-runtime.log") log lines)"
          exit "$status"

      - name: 🔐 Publish private run-scoped runtime
        env:
          RUNTIME_RELEASE_TAG: ${{ steps.source.outputs.runtime_tag }}
          RUNTIME_ASSET: ${{ steps.source.outputs.runtime_asset }}
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          status=0
          {
            cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
            stale_releases=$(mktemp)
            gh api --paginate "repos/$LOGS_REPO/releases?per_page=100" \
              --jq '.[] | select((.tag_name | startswith("ee-bench-runtime-v1-")) and .published_at != null) | [.tag_name, .published_at] | @tsv' \
              > "$stale_releases" &&
              while IFS=$'\t' read -r tag published; do
                [ -n "$tag" ] || continue
                if [[ "$published" < "$cutoff" ]]; then
                  gh release delete "$tag" -R "$LOGS_REPO" --cleanup-tag --yes || exit
                fi
              done < "$stale_releases" &&
              gh release create "$RUNTIME_RELEASE_TAG" -R "$LOGS_REPO" --prerelease \
                --title "Temporary EE benchmark runtime ${{ github.run_id }}.${{ github.run_attempt }}" \
                --notes "checkout=${{ steps.source.outputs.sha }} node=24.22.2 run=$RUN_URL cleanup=next-producer-after-24h" &&
              gh release upload "$RUNTIME_RELEASE_TAG" "/tmp/$RUNTIME_ASSET" -R "$LOGS_REPO"
          } >> "$LOG_DIR/bench-runtime.log" 2>&1 || status=$?
          echo "runtime publish exit=$status ($(wc -l < "$LOG_DIR/bench-runtime.log") log lines)"
          exit "$status"

      - name: 📤 Ship runtime producer log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/bench-runtime.log" ] || echo "(runtime producer failed before its first logged step)" > "$LOG_DIR/bench-runtime.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/bench-runtime.log" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/bench-runtime.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/bench-runtime.failed" -R "$LOGS_REPO" --clobber
          fi

  bench:
    needs: [runtime]
    runs-on: ubuntu-latest
    name: V2 Benchmarks (${{ matrix.family }})
    # Each behavior-family leg runs one bounded case per registered rule in that family.
    # Full-size stress scenarios remain opt-in; bounded counterparts have separate identities.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family:
          - storage-query
          - write
          - formula
          - lookup
          - rollup
          - conditional-link
          - propagation
          - api-limit
          - headless-http
          - core-operations
          - core-extra
          - core-scale
          - core-transitions
          - core-views
          - core-computed-changes
          - core-query-cases
          - core-relation-cases
          - core-field-transitions
          - core-fanout-deletion
          - core-volume-cases
          - complexity-score
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      # Runtime dependencies and dist were built once by the producer job.
      PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      TEABLE_BENCH_OUT_DIR: /tmp/teable-headless-bench
      TEABLE_BENCH_SAMPLES: 100
      TEABLE_BENCH_FAMILIES: ${{ matrix.family }}

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.runtime.outputs.checkout_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🔒 Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.runtime.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || {
            echo "::error::Benchmark leg checkout differs from the built runtime"
            exit 1
          }

      - name: 🟢 Use Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: 🔐 Restore private benchmark runtime
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            corepack enable &&
              gh release download "$RUNTIME_RELEASE_TAG" -R "$LOGS_REPO" \
                -D /tmp --pattern "$RUNTIME_ASSET" --clobber &&
              node community/.github/scripts/bench-runtime-archive.mjs restore \
                --root . \
                --archive "/tmp/$RUNTIME_ASSET" \
                --sha "$EXPECTED_SHA" &&
              # Complete archive writeback before latency sampling starts.
              sync
          } >> "$LOG_DIR/bench.log" 2>&1 || status=$?
          echo "runtime restore exit=$status family=${{ matrix.family }} ($(wc -l < "$LOG_DIR/bench.log") log lines)"
          exit "$status"
        env:
          EXPECTED_SHA: ${{ needs.runtime.outputs.checkout_sha }}
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          RUNTIME_RELEASE_TAG: ${{ needs.runtime.outputs.runtime_tag }}
          RUNTIME_ASSET: ${{ needs.runtime.outputs.runtime_asset }}

      - name: 🧪 Run bounded PostgreSQL benchmark catalogue
        run: |
          mkdir -p "$LOG_DIR" "$TEABLE_BENCH_OUT_DIR"
          status=0
          (
            set -euo pipefail
            echo "=== v2 headless benchmark catalogue ==="
            case "$TEABLE_BENCH_FAMILIES" in
              headless-http) pnpm --filter @teable/v2-headless-bench bench:http-ci ;;
              complexity-score) DATABASE_URL="$PRISMA_DATABASE_URL" pnpm --filter @teable/v2-headless-bench bench:complexity-ci gate --samples 100 --out-dir "$TEABLE_BENCH_OUT_DIR" --runner github-ubuntu-latest-node24-postgres16 --calibration budgets/complexity.calibration.json --calibration-sha256 ec24ef31d3638f2e85b65b2be47c11780f43e1b1eac522eec2a80282ddca0111 --json "$TEABLE_BENCH_OUT_DIR/summary.json" --markdown "$TEABLE_BENCH_OUT_DIR/summary.md" ;;
              core-*) TEABLE_BENCH_TRACK="$TEABLE_BENCH_FAMILIES" pnpm --filter @teable/v2-headless-bench bench:core-ci ;;
              *) pnpm --filter @teable/v2-headless-bench bench:ci ;;
            esac &&
              echo "=== summary ===" &&
              cat "$TEABLE_BENCH_OUT_DIR/summary.json"
          ) >> "$LOG_DIR/bench.log" 2>&1 || status=$?
          echo "bench exit=$status family=${{ matrix.family }} ($(wc -l < "$LOG_DIR/bench.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/bench-${{ matrix.family }}.log"
          [ -f "$LOG_DIR/bench.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/bench.log"
          mv "$LOG_DIR/bench.log" "$LOG_FILE"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_FILE" -R "$LOGS_REPO" --clobber
          if [ -d "$TEABLE_BENCH_OUT_DIR" ]; then
            tar -C "$TEABLE_BENCH_OUT_DIR" -czf "$LOG_DIR/headless-bench-${{ matrix.family }}.tgz" .
            gh release upload "$LOG_TAG" "$LOG_DIR/headless-bench-${{ matrix.family }}.tgz" -R "$LOGS_REPO" --clobber
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/bench-${{ matrix.family }}.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/bench-${{ matrix.family }}.failed" -R "$LOGS_REPO" --clobber
          fi

  verdict:
    needs: [runtime, bench]
    if: always()
    runs-on: ubuntu-latest
    name: Bench verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.runtime.outputs.checkout_sha || inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github
            community/.github/scripts

      - name: 🧮 Consolidate benchmark report
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          set -euo pipefail
          mkdir -p bench-evidence
          gh release download "$LOG_TAG" -R "$LOGS_REPO" -D bench-evidence --pattern 'headless-bench-*.tgz' --clobber || true
          for archive in bench-evidence/headless-bench-*.tgz; do
            [ -f "$archive" ] || continue
            dir="bench-evidence/$(basename "$archive" .tgz)"
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir" || true
          done
          status=0
          node community/.github/scripts/benchmark-unified-report.mjs \
            --root bench-evidence \
            --families 'storage-query,write,formula,lookup,rollup,conditional-link,propagation,api-limit,headless-http,core-operations,core-extra,core-scale,core-transitions,core-views,core-computed-changes,core-query-cases,core-relation-cases,core-field-transitions,core-fanout-deletion,core-volume-cases,complexity-score' \
            --runtime-status '${{ needs.runtime.result }}' \
            --bench-status '${{ needs.bench.result }}' \
            --output "bench-evidence/$BENCH_REPORT_ASSET" || status=$?
          if [ "$status" -gt 1 ] || [ ! -s "bench-evidence/$BENCH_REPORT_ASSET" ]; then
            printf '## Unified benchmark report\n\nOverall verdict: **FAIL**.\n\nThe current report process failed (exit %s) before publishing complete evidence. No performance pass is available for this attempt.\n' "$status" > "bench-evidence/$BENCH_REPORT_ASSET"
            status=1
          fi
          gh release upload "$LOG_TAG" "bench-evidence/$BENCH_REPORT_ASSET" -R "$LOGS_REPO" --clobber
          exit "$status"

