      TEABLE_BENCH_FAMILIES: ${{ matrix.family }}
      TEABLE_BENCH_CALIBRATE: '3'
      EVIDENCE_PREFIX: catalogue-${{ matrix.family }}-${{ github.run_attempt }}
    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ needs.runtime.outputs.checkout_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🙈 Mask private connection and auth values
        env:
