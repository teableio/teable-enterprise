# EE Remote CI — bench suite (was teable-ee's "V2 Benchmarks"). One workflow per suite so
# partial reruns produce clean run pages. SOURCE OF TRUTH lives in teable-ee
# .github/enterprise-ci/ and is synced here. The benchmarks assert nothing about timings; the
# suite fails only if a benchmark does, and its numbers are in the private log. They read
# higher here than on teable-ee's 2-core runners — compare runs within this suite only.

name: EE Remote CI (bench)

run-name: 'EE Remote CI bench — PR #${{ github.event.client_payload.pr_number }} ${{ github.event.client_payload.log_tag }}'

on:
  repository_dispatch:
    types: [ee-remote-ci-bench]

concurrency:
  group: ee-remote-ci-bench-${{ github.event.client_payload.pr_number || github.event.client_payload.ee_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EE_SHA: ${{ github.event.client_payload.ee_sha }}
  LOG_TAG: ${{ github.event.client_payload.log_tag }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  LOG_DIR: /tmp/ci-logs
  LOGS_REPO: teableio/teable-ci-logs

jobs:
  bench:
    runs-on: ubuntu-latest
    name: V2 Benchmarks
    timeout-minutes: 30
    env:
      CI: 1
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: 📦 Checkout teable-ee
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false

      - name: 🟢 Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-benchmark-node...

      - name: 🧪 Run v2 benchmarks
        run: |
          mkdir -p "$LOG_DIR"
          status=0
          {
            echo "=== v2 benchmarks ==="
            pnpm -C community/packages/v2/benchmark-node bench
          } >> "$LOG_DIR/bench.log" 2>&1 || status=$?
          echo "bench exit=$status ($(wc -l < "$LOG_DIR/bench.log") log lines)"
          exit $status

      - name: 📤 Ship log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"
          [ -f "$LOG_DIR/bench.log" ] || echo "(no log produced — job failed before its first logged step)" > "$LOG_DIR/bench.log"
          gh release create "$LOG_TAG" -R "$LOGS_REPO" --title "EE Remote CI $LOG_TAG (PR #$PR_NUMBER)" --notes "ee_sha=$EE_SHA run=$RUN_URL" 2>/dev/null || true
          gh release upload "$LOG_TAG" "$LOG_DIR/bench.log" -R "$LOGS_REPO" --clobber
          if [ "$JOB_STATUS" != "success" ]; then
            echo failed > "$LOG_DIR/bench.failed"
            gh release upload "$LOG_TAG" "$LOG_DIR/bench.failed" -R "$LOGS_REPO" --clobber
          fi

  verdict:
    needs: [bench]
    if: always()
    runs-on: ubuntu-latest
    name: Bench verdict
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout teable-ee (.github only)
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ github.event.client_payload.ee_checkout_sha || github.event.client_payload.ee_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: 🎫 Mint App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RCI_APP_ID }}
          private-key: ${{ secrets.RCI_APP_PRIVATE_KEY }}
          owner: teableio
          repositories: teable-ee

      - name: 🧾 Conclude check run
        uses: ./.github/actions/remote-ci-conclude
        with:
          suite: bench
          results: 'bench=${{ needs.bench.result }}'
          app-token: ${{ steps.app.outputs.token }}
          logs-token: ${{ secrets.PACKAGES_KEY }}

      - name: 📨 Dispatch ee-remote-ci-done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          gh api repos/teableio/teable-ee/dispatches \
            -f event_type=ee-remote-ci-done \
            -f "client_payload[suite]=bench" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f "client_payload[ee_sha]=${EE_SHA}" \
            -f "client_payload[log_tag]=${LOG_TAG}" \
            -f "client_payload[remote_run_url]=${RUN_URL}" \
            -f "client_payload[check_run_id]=${{ github.event.client_payload.check_run_id }}" \
            -f "client_payload[results]=bench=${{ needs.bench.result }}"
