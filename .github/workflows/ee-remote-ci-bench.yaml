name: PR4215 structure-scale core case calibration
run-name: "PR4215 structure-scale core calibration — ${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  calibrate:
    name: Core case calibration (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        track: [core-relation-cases, core-field-transitions, core-fanout-deletion, core-volume-cases]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      PRISMA_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      TEABLE_BENCH_OUT_DIR: /tmp/teable-headless-bench
      TEABLE_BENCH_SAMPLES: 20
      TEABLE_BENCH_TRACK: ${{ matrix.track }}
      TEABLE_BENCH_CALIBRATE: 3
      TEABLE_BENCH_CALIBRATE_SOURCE: GitHub ubuntu-latest Node 24.19.0 PostgreSQL 16 PR4215 ${{ inputs.source_sha }} run ${{ github.run_id }}
      LOG_TAG: pr4215-structure-scale-calibration-${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - name: Checkout Teable EE
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-headless-bench...
      - name: Run PostgreSQL case calibration
        run: |
          mkdir -p "$TEABLE_BENCH_OUT_DIR"
          pnpm -r --filter @teable/v2-headless-bench... build > "$TEABLE_BENCH_OUT_DIR/build.log" 2>&1
          TEABLE_BENCH_BUDGETS="$TEABLE_BENCH_OUT_DIR/$TEABLE_BENCH_TRACK.budgets.json" pnpm --filter @teable/v2-headless-bench bench:core-ci > "$TEABLE_BENCH_OUT_DIR/calibration.log" 2>&1
      - name: Ship private evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          mkdir -p "$TEABLE_BENCH_OUT_DIR"
          gh release create "$LOG_TAG" -R teableio/teable-ci-logs --title "PR4215 structure-scale case calibration ${{ github.run_id }}" --notes "source=${{ inputs.source_sha }}" 2>/dev/null || true
          tar -C "$TEABLE_BENCH_OUT_DIR" -czf "/tmp/structure-scale-${TEABLE_BENCH_TRACK}.tgz" .
          gh release upload "$LOG_TAG" "/tmp/structure-scale-${TEABLE_BENCH_TRACK}.tgz" -R teableio/teable-ci-logs --clobber
