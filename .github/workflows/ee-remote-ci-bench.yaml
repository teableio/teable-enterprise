name: PR4215 complexity benchmark gate
run-name: "PR4215 complexity gate — ${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  calibrate:
    name: Complexity budget gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teable_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teable_bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 1
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/teable_bench
      OUT_DIR: /tmp/teable-complexity
      LOG_TAG: pr4215-complexity-gate-${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - name: Checkout Teable EE
        uses: actions/checkout@v4
        with:
          repository: teableio/teable-ee
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PACKAGES_KEY }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          install-args: |
            --filter
            @teable/v2-headless-bench...
      - name: Run independent-holdout gate
        run: |
          mkdir -p "$OUT_DIR"
          pnpm -r --filter @teable/v2-headless-bench... build > "$OUT_DIR/build.log" 2>&1
          pnpm --filter @teable/v2-headless-bench bench:complexity-ci gate --out-dir "$OUT_DIR" --runner "github-ubuntu-latest-node24-postgres16" --calibration budgets/complexity.calibration.json --calibration-sha256 602c17100438a9299a1d75081f182fa0d85603b18b9ffbf28f3ba0c296024b86 > "$OUT_DIR/gate.log" 2>&1
      - name: Render gate report
        if: always()
        run: |
          if [ -f "$OUT_DIR/gate.md" ]; then cat "$OUT_DIR/gate.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Ship private benchmark evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_KEY }}
        run: |
          mkdir -p "$OUT_DIR"
          gh release create "$LOG_TAG" -R teableio/teable-ci-logs --title "PR4215 complexity gate ${{ github.run_id }}" --notes "source=${{ inputs.source_sha }} run=${{ github.run_id }}" 2>/dev/null || true
          tar -C "$OUT_DIR" -czf /tmp/complexity-gate.tgz .
          gh release upload "$LOG_TAG" /tmp/complexity-gate.tgz -R teableio/teable-ci-logs --clobber
